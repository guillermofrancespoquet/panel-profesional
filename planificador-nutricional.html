/* ═══ Menú semanal: sistema visual de la página ═══ */

.embed .lab-top{display:none}

.page{max-width:1120px;padding:32px 28px 72px}

.mn-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}

}
button,a,[role=button],select,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

const AUTH_KEY='nl_session';
function authLoad(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch(e){ return null; } }
function authSave(j){ localStorage.setItem(AUTH_KEY,JSON.stringify({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+Math.max((j.expires_in||3600)-60,30)*1000})); }
function authClear(){ try{ localStorage.removeItem(AUTH_KEY); }catch(e){} }
async function authPost(grant,body){
  const r=await fetch(SURL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{'apikey':SKEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.access_token){ const e=new Error(j.error_description||j.msg||'auth'); e.status=r.status; throw e; }
  return j;
}
let _authRefreshing=null;
function authRefresh(){
  if(_authRefreshing) return _authRefreshing;
  const s=authLoad(); if(!s||!s.refresh_token) return Promise.resolve(null);
  _authRefreshing=authPost('refresh_token',{refresh_token:s.refresh_token})
    .then(j=>{ authSave(j); return j.access_token; })
    .catch(e=>{ if(e.status>=400&&e.status<500) authClear(); return null; })   // un fallo de red no cierra la sesión
    .finally(()=>{ _authRefreshing=null; });
  return _authRefreshing;
}
async function authToken(){ const s=authLoad(); if(!s) return null; return Date.now()<s.expires_at ? s.access_token : authRefresh(); }
async function authFetch(url,opts={}){
  const go=async tok=>{ try{ const rr=await fetch(url,{...opts,headers:{'apikey':SKEY,'Authorization':'Bearer '+(tok||SKEY),...(opts.headers||{})}}); conexion(true); return rr; }catch(e){ conexion(false); throw e; } };
  const habiaSesion=!!authLoad();
  const tok=await authToken();
  if(habiaSesion&&!tok&&!authLoad()) sesionCaducada();   // la renovación fue rechazada: la sesión ya no vale
  let r=await go(tok);
  if(r.status===401&&authLoad()){
    const t=await authRefresh();
    if(t) r=await go(t); else sesionCaducada();
  }
  return r;
}
function conexion(ok){ document.body.classList.toggle('sin-conexion',!ok); }
function sesionCaducada(){ authClear(); mostrarSinSesion(); }

  const r=await authFetch(SURL+'/rest/v1/'+path,{...opts,headers:{'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})}});

}

function toast(msg,o={}){
  const box=document.getElementById('toasts'); if(!box) return {cerrar(){}};

  el.setAttribute('role',o.tipo==='error'?'alert':'status');
  const t=document.createElement('span'); t.textContent=msg; el.appendChild(t);
  let tm=null, cerrado=false;
  const cerrar=()=>{ if(cerrado) return; cerrado=true; clearTimeout(tm); el.classList.add('out'); setTimeout(()=>el.remove(),220); };
  if(o.accion){ const b=document.createElement('button'); b.type='button'; b.textContent=o.accion.texto; b.onclick=()=>{ cerrar(); o.accion.fn(); }; el.appendChild(b); }
  box.appendChild(el);

  return {cerrar};
}

  if(_pend) _pend.ahora();

    if(hecho) return; hecho=true; clearTimeout(tm); if(_pend===p) _pend=null; if(aviso) aviso.cerrar();

function compNormalize(raw, source){

      name: raw.product_name || raw.generic_name || 'Sin nombre',
      brand: raw.brands ? raw.brands.split(',')[0] : '',
      extra: '', nutri: raw.nutriscore_grade && /^[a-e]$/i.test(raw.nutriscore_grade) ? raw.nutriscore_grade.toUpperCase() : '',
      img: raw.image_small_url || raw.image_front_small_url || '',
      kcal: n['energy-kcal_100g'], protein: n['proteins_100g'], carbs: n['carbohydrates_100g'],
      sugars: n['sugars_100g'], fat: n['fat_100g'], satfat: n['saturated-fat_100g'],
      fiber: n['fiber_100g'], sodium_mg: n['sodium_100g']!==undefined ? n['sodium_100g']*1000 : undefined

  } else {
    const get = (id) => {
      const found = (raw.foodNutrients||[]).find(x => x.nutrientId===id || x.nutrient?.id===id);
      return found ? (found.value!==undefined?found.value:found.amount) : undefined;
    };
    return {
      name: raw.description || 'Sin nombre',
      brand: raw.brandOwner || raw.dataType || '',
      extra: raw.brandOwner ? (raw.dataType || '') : '', nutri: '', img: '',
      kcal: get(1008), protein: get(1003), carbs: get(1005),
      sugars: get(2000), fat: get(1004), satfat: get(1258),
      fiber: get(1079), sodium_mg: get(1093)
    };
  }
}

// ═══════════════ MENÚ SEMANAL POR CLIENTE (ficha → Plan → «Menú semanal») ═══════════════
// Cada plan empieza en blanco: la estructura (semanas → días → comidas → ingredientes) la decide el profesional.
// El borrador vive en menus_cliente.contenido y se guarda solo; «Publicar» escribe la copia que ve el cliente (publicado).
// Los ingredientes se escriben como texto, una línea cada uno («80 g avena (en copos)»), y la app los estructura.
const MN_TIPOS = [['D','Desayuno'],['A','Almuerzo'],['C','Comida'],['Me','Merienda'],['Ce','Cena'],['O','Otra']];
const MN_DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MN_CTX = [['','Sin etiqueta'],['entreno','Entreno'],['descanso','Descanso'],['partido','Partido'],['libre','Día libre'],['otro','Otro']];
const MN_COL = [['green','Verde'],['blue','Azul'],['amber','Ámbar'],['coral','Coral']];
let MN = null, _mnT = null, _mnFila = null;
const mnId = p => p + Math.random().toString(36).slice(2, 8);
const mnNorm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const mnFecha = iso => new Date(iso).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });

// ── Texto → ingredientes ──
const MN_UG = { g:'g', gr:'g', grs:'g', gramo:'g', gramos:'g', kg:'kg', ml:'ml', l:'l', lt:'l', litro:'l', litros:'l' };
const MN_UU = ['ud', 'uds', 'u', 'unidad', 'unidades'];
const MN_UC = /^(cditas?|cdas?|cdtas?|cucharad[ao]s?|cucharitas?|vasos?|vasitos?|lonchas?|rebanadas?|puñados?|latas?|botes?|tarros?|rodajas?|dientes?|ramas?|tazas?|platos?|piezas?|sobres?|barras?|paquetes?|tortitas?|filetes?|hojas?|trozos?|chorritos?)$/i;
const MN_RE_N = '(\\d+(?:[.,]\\d+)?(?:\\/\\d+)?|[¼½¾])';
function mnNum(s) {
  s = String(s).replace(',', '.');
  if (s === '¼') return 0.25; if (s === '½') return 0.5; if (s === '¾') return 0.75;
  if (s.indexOf('/') > 0) { const p = s.split('/'); return +p[0] / +p[1]; }
  return +s;
}
// «2-3 lonchas pavo» → { cant:{modo,min,max,u}, rest:'pavo', exp:true si trae unidad }
function mnQty(str) {
  str = String(str || '').trim();
  let m = str.match(new RegExp('^' + MN_RE_N + '(?:\\s*[-–]\\s*' + MN_RE_N + ')?\\s*(.*)$'));
  if (!m) {
    const w = str.match(/^(un|una|medio|media)\s+(.*)$/i);
    if (!w) return null;
    m = [0, /^m/i.test(w[1]) ? '0.5' : '1', undefined, w[2]];
  }
  const min = mnNum(m[1]); let max = m[2] !== undefined ? mnNum(m[2]) : null, rest = (m[3] || '').trim();
  if (!isFinite(min) || min <= 0) return null;
  if (max !== null && (!isFinite(max) || max <= min)) max = null;
  const w = rest.match(/^([A-Za-zÁÉÍÓÚáéíóúñÑ]+)\.?\s*(.*)$/);
  let modo = 'ud', u = 'ud', exp = false;
  if (w) {
    const k = w[1].toLowerCase();
    if (MN_UG[k]) { modo = 'g'; u = MN_UG[k]; rest = w[2]; exp = true; }
    else if (MN_UU.indexOf(k) >= 0) { modo = 'ud'; rest = w[2]; exp = true; }
    else if (MN_UC.test(k)) { modo = 'casera'; u = k; rest = w[2]; exp = true; }
  }
  rest = rest.replace(/^de\s+/i, '').trim();
  return { cant: { modo, min, max, u }, rest, exp };
}
function mnParseLinea(l) {
  l = String(l || '').trim(); if (!l) return null;
  const notas = [];
  const t = l.replace(/\(([^)]*)\)/g, (m, g) => { if (g.trim()) notas.push(g.trim()); return ' '; }).replace(/\s+/g, ' ').trim();
  let q = mnQty(t), nota = notas.join('; ');
  if (!q && notas.length) { // «Pollo (150 g)»: la cantidad va entre paréntesis
    const q2 = mnQty(notas[0]);
    if (q2 && q2.exp) {
      q = { cant: q2.cant, rest: t };
      const resto = q2.rest.replace(/^[,;:\s]+|[\s,;:]+$/g, '');
      nota = [resto].concat(notas.slice(1)).filter(Boolean).join('; ');
    }
  }
  let n = (q ? q.rest : t).replace(/^[,;:\-–\s]+|[\s,;:]+$/g, '');
  if (!n) n = t || l;
  n = n.charAt(0).toUpperCase() + n.slice(1);
  return { id: mnId('i'), a: null, n, cant: q ? q.cant : { modo: 'libre' }, nota };
}
function mnSplitTop(s, sep) {
  const out = []; let d = 0, cur = '';
  for (const ch of s) {
    if (ch === '(') d++; else if (ch === ')') d = Math.max(0, d - 1);
    if (ch === sep && d === 0) { out.push(cur); cur = ''; } else cur += ch;
  }
  out.push(cur); return out;
}
// Una línea por ingrediente (o ';'). Una línea con varias cantidades separadas por comas («80 g avena, 1 plátano») también se separa.
function mnParseTexto(txt, previos) {
  const piezas = [];
  String(txt || '').split(/\n|;/).forEach(l => {
    const partes = mnSplitTop(l, ',');
    if (partes.length > 1 && partes.every(p => /^\s*([\d¼½¾]|un\s|una\s|medio\s|media\s)/i.test(p))) partes.forEach(p => piezas.push(p)); else piezas.push(l);
  });
  const ant = {}; (previos || []).forEach(i => { ant[mnNorm(i.n)] = i; });
  return piezas.map(mnParseLinea).filter(Boolean).map(i => { const p = ant[mnNorm(i.n)]; if (p) { i.a = p.a || null; i.id = p.id; } return i; });
}
const mnRng = c => { const f = x => ({ 0.25: '¼', 0.5: '½', 0.75: '¾' })[+x] || String(+(+x).toFixed(2)).replace('.', ','); return c.max ? f(c.min) + '-' + f(c.max) : f(c.min); };
const mnQtyTxt = c => (!c || c.modo === 'libre') ? '' : (c.modo === 'ud' ? mnRng(c) : mnRng(c) + ' ' + c.u);
const mnIngTxt = i => { const q = mnQtyTxt(i.cant); return q ? (i.cant.modo === 'ud' ? q + ' ' + i.n : q + ' de ' + i.n) : i.n; }; // lo que lee el cliente
const mnIngEdit = i => { const q = mnQtyTxt(i.cant); return (q ? q + ' ' : '') + i.n + (i.nota ? ' (' + i.nota + ')' : ''); }; // lo que se edita
const mnTextoIng = ing => (ing || []).map(mnIngEdit).join('\n');

// ── Estructura ──
function mnDiasNuevos() { return MN_DIAS.map((n, i) => ({ id: mnId('d'), n, dow: i + 1, ctx: { tipo: '', texto: '', aviso: '' }, comidas: [] })); }
function mnSemanaNueva(nombre) { return { id: mnId('s'), nombre: nombre || 'Semana típica', nota: '', dias: mnDiasNuevos() }; }
function mnContenidoNuevo(nombre) { return { v: 1, titulo: 'Planificación nutricional' + (nombre ? ' — ' + nombre : ''), semanas: [mnSemanaNueva()], recetas: [], platos: [] }; }
const mnSem = () => MN.c.semanas.find(s => s.id === MN.sem) || MN.c.semanas[0];
const mnDia = () => { const s = mnSem(); return s && (s.dias[MN.dia] || s.dias[0]); };
function mnTodasComidas() { const r = []; MN.c.semanas.forEach(s => s.dias.forEach(d => d.comidas.forEach(m => r.push(m)))); return r; }
const mnSrc = m => m.plato ? (MN.c.platos.find(p => p.id === m.plato) || m) : m;
function mnEnt(id) { // quien guarda los ingredientes de ese id: una receta, una comida guardada o una comida suelta
  let r = MN.c.recetas.find(x => x.id === id); if (r) return r;
  r = MN.c.platos.find(x => x.id === id); if (r) return r;
  const m = mnTodasComidas().find(x => x.id === id); return m ? mnSrc(m) : null;
}
function mnLink(n) {
  const x = mnNorm(n); if (!x || !MN) return null; let best = null;
  for (const a of MN.cat) { const y = mnNorm(a.nombre); if (x === y) return a.id; if (x.indexOf(y + ' ') === 0 && (!best || y.length > best.l)) best = { id: a.id, l: y.length }; }
  return best ? best.id : null;
}
function mnRelinkTodo() {
  const todos = [].concat(MN.c.recetas, MN.c.platos, mnTodasComidas());
  todos.forEach(e => (e.ing || []).forEach(i => { if (!i.a || !MN.cat.some(a => a.id == i.a)) i.a = mnLink(i.n); }));
}

// ── Guardado ──
function mnCambio() { if (!MN || MN.general) return; MN.dirty = true; mnMarca(); clearTimeout(_mnT); _mnT = setTimeout(() => mnGuardarYa(), 1200); }
async function mnGuardarYa(oculta) {
  if (!MN || !MN.dirty) return;
  clearTimeout(_mnT);
  const ahora = new Date().toISOString(), c = MN.c, id = MN.row.id;
  let r; try { r = await sb(`menus_cliente?id=eq.${id}`, { method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({ contenido: c, titulo: c.titulo || null, actualizado: ahora }), ...(oculta ? { keepalive: true } : {}) }); } catch (e) { r = { code: 'red' }; }
  if (esErrorSb(r)) { const e = document.getElementById('mnEstado'); if (e) e.textContent = 'No se pudo guardar'; toast('No se pudo guardar el menú. Inténtalo de nuevo.', { tipo: 'error' }); return; }
  if (MN && MN.row.id === id) { MN.dirty = false; MN.row.actualizado = ahora; MN.row.contenido = c; mnMarca(); }
}
function mnFlush() { if (!MN) return; mnSyncTextos(); if (MN.dirty) mnGuardarYa(true); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') mnFlush(); });

async function mnCargarFila(depId) {
  try { const r = await sb(`menus_cliente?deportista_id=eq.${depId}&select=*&limit=1`); if (Array.isArray(r)) return r[0] || null; } catch (e) {}
  return undefined; // la tabla no existe todavía
}

// ── Editor ──
function mnAsegurar() { // deja el contenido con todas las listas
  const c = MN.c; c.v = 1; c.semanas = Array.isArray(c.semanas) && c.semanas.length ? c.semanas : [mnSemanaNueva()];
  c.recetas = c.recetas || []; c.platos = c.platos || [];
  c.semanas.forEach(s => { s.dias = Array.isArray(s.dias) && s.dias.length ? s.dias : mnDiasNuevos(); s.dias.forEach(d => { d.comidas = d.comidas || []; d.ctx = d.ctx || { tipo: '', texto: '', aviso: '' }; }); });
  if (!MN.sem || !c.semanas.some(s => s.id === MN.sem)) MN.sem = c.semanas[0].id;
}
async function mnAbrir(depId) {

  const d = deportistas.find(x => x.id == depId) || {};
  if (!row) {
    const c = mnContenidoNuevo(d.nombre);
    const r = await sb('menus_cliente', { method: 'POST', body: JSON.stringify({ deportista_id: depId, titulo: c.titulo, contenido: c }) });
    if (esErrorSb(r) || !Array.isArray(r) || !r[0]) { toast('No se pudo crear el menú. Inténtalo de nuevo.', { tipo: 'error' }); return; }
    row = r[0];
  }
  let cat = []; try { const r = await sb('alimentos?select=*&order=nombre.asc&limit=2000'); if (Array.isArray(r)) cat = r; } catch (e) {}
  await mnBibCargar();
  const hoy = (new Date().getDay() + 6) % 7;
  MN = { depId, nombre: d.nombre || '', row, c: row.contenido || {}, cat, sem: null, dia: hoy, tab: 'menu', dirty: false, rec: null, perfil: await mnCargarPerfil(depId) };
  mnAsegurar(); mnRelinkTodo(); _mnFila = row;
  show('vmenuc'); mnPintar(); window.scrollTo(0, 0);
}

let _mnIT = {};
function mnAplicarIng(entId, txt) {

function mnBuscaComida(id) { for (const s of MN.c.semanas) for (const d of s.dias) { const i = d.comidas.findIndex(m => m.id === id); if (i >= 0) return { d, i, m: d.comidas[i] }; } return null; }

async function mnCatGuardar() {

function mnRecNutri(id, k, v) { const r = MN.c.recetas.find(x => x.id === id); if (!r) return; const x = parseFloat(String(v).replace(',', '.')); r.nutri = r.nutri || {}; if (isFinite(x) && x >= 0) r.nutri[k] = x; else delete r.nutri[k]; if (!Object.keys(r.nutri).length) r.nutri = null; mnCambio(); }
function mnNuevaReceta() { const r = MN_RECETA_NUEVA(); MN.c.recetas.push(r); MN.rec = r.id; mnCambio(); mnPintar(); const e = document.getElementById('mnRN_' + r.id); if (e) e.focus(); }
function mnSoltarPdfs(ev) { ev.preventDefault(); document.getElementById('mnDrop').classList.remove('over'); mnImportarPdfs(ev.dataTransfer.files); }
async function mnImportarPdfs(files) {
  const pdfs = [...files].filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)); if (!pdfs.length) { toast('Elige archivos PDF.', { tipo: 'aviso' }); return; }
  let ok = 0; const mal = [];
  for (const f of pdfs) {
    const aviso = toast('Leyendo ' + f.name + '…', { ms: 20000 });
    try {
      const r = await mnLeerPdfReceta(f);
      if (!r || !r.nombre || !r.ing.length) { mal.push(f.name); aviso.cerrar(); continue; }
      const rec = { ...MN_RECETA_NUEVA(), ...r }; delete rec.fotoBlob;
      if (r.fotoBlob) {
        const path = `${MN.depId}/menu/${rec.id}-${Date.now()}.jpg`;
        try { const up = await authFetch(`${SURL}/storage/v1/object/${FOTO_BUCKET}/${path.split('/').map(encodeURIComponent).join('/')}`, { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: r.fotoBlob }); if (up.ok) rec.foto = path; } catch (e) {}
      }
      rec.ing.forEach(i => { i.a = mnLink(i.n); });
      const dup = MN.c.recetas.some(x => mnNorm(x.nombre) === mnNorm(rec.nombre));
      MN.c.recetas.push(rec); MN.rec = rec.id; ok++; if (dup) toast('«' + rec.nombre + '» ya existía: se ha añadido otra copia.', { tipo: 'aviso' });
    } catch (e) { mal.push(f.name); }
    aviso.cerrar();
  }
  if (ok) { mnCambio(); MN.tab = 'recetas'; mnPintar(); toast(ok === 1 ? 'Receta importada: revisa los datos' : ok + ' recetas importadas: revisa los datos'); }
  if (mal.length) toast('No he podido leer: ' + mal.join(', ') + '. Solo reconozco los PDF de la plantilla NutriLogos.', { tipo: 'error', ms: 7000 });
}

const MN_CATKW = [
  ['Condimentos y otros', /\btomate frito\b|\bsal\b|pimienta|especia|mostaza|vinagre|salsa|pesto|oregano|comino|pimenton|curcuma|canela|levadura|\bmiel\b|mermelada|azucar|chocolate|cacao|sirope|caldo|ketchup|mayonesa|hierbas/],

  ['Grasas y aceites', /aceite|\baove\b|aguacate|mantequilla|margarina|\bcoco\b/],
  ['Lácteos y vegetales', /yogur|leche|queso|kefir|bebida (vegetal|de )|requeson|\bnata\b|cuajada|skyr|batido/],
  ['Bebidas', /isotonic|\bagua\b|zumo|refresco|\bcafe\b|\bte\b|infusion|cerveza|\bvino\b|energetica/],
  ['Legumbres', /garbanzo|alubia|lenteja|judia seca|edamame|guisante seco|soja texturizada|habas secas|hummus/],
  ['Proteínas', /pollo|pavo|ternera|cerdo|jamon|lomo|atun|salmon|merluza|bacalao|caballa|sardina|lubina|dorada|pescado|gamba|langostino|huevo|\bclara|tofu|tempeh|seitan|proteina|fiambre|conejo|cordero|anchoa|calamar|pulpo|mejillon|sepia|\bcarne|solomillo|filete|hamburguesa|salchicha|bonito/],
  ['Hidratos', /arroz|pasta|macarron|espagueti|fideo|cuscus|quinoa|avena|copos|\bpan\b|tostada|patata|boniato|noquis|tortita|galleta|cereal|harina|\bwrap|tortilla de trigo|cebada|\bmijo|centeno|bulgur|\bmaiz|barrita|granola|muesli|panecillo|bagel|crepe|pizza|lasana/],
  ['Frutas', /manzana|platano|naranja|mandarina|\bpera\b|fresa|frambuesa|arandano|\buva|kiwi|melon|sandia|\bpina\b|mango|limon|\blima\b|fruta|guayaba|pasas|datil|higo|melocoton|albaricoque|cereza|ciruela|papaya|granada|pomelo|nectarina|\bmora/],
  ['Verduras', /tomate|lechuga|pepino|pimiento|zanahoria|cebolla|\bajo\b|espinaca|brocoli|coliflor|calabacin|berenjena|champi|\bseta|judia verde|judias verdes|esparrago|\bapio\b|puerro|\bcol\b|repollo|rucula|canonigo|remolacha|calabaza|alcachofa|acelga|verdura|ensalada|rabano|\bnabo|guisante|perejil|cilantro|albahaca|\bmenta\b|hortaliza|brotes|\bkale|cebollino|jengibre/]
];
function mnCategoria(n) { const t = mnNorm(n); for (const [c, re] of MN_CATKW) if (re.test(t)) return c; return ''; }
function mnEstadoInfer(n, nota) {
  const t = mnNorm((n || '') + ' ' + (nota || ''));
  if (/precocin/.test(t)) return 'precocinado';
  if (/cocid|cocin|\bbote\b|hervid|al vapor|a la plancha|asad|frit/.test(t)) return 'cocinado';
  if (/en seco|\bseco|crudo|cruda|fresc/.test(t)) return 'crudo';
  return '';

    <div class="mn-f" style="margin:14px 0"><label class="mn-l" for="mnImpNom">Nombre de la semana</label><input class="inp" id="mnImpNom" maxlength="40" value="${sudEsc(r.semana.nombre)}"></div>

    <div class="mbtns" style="margin-top:14px"><button type="button" class="btn-cancel" onclick="mnImpCerrar()">Cancelar</button><button type="button" class="btn-ok" onclick="mnImpHacer()">Importar</button></div>`;
  document.getElementById('mMnImp').style.display = 'flex';
}
function mnImpCerrar() { document.getElementById('mMnImp').style.display = 'none'; MNI = null; }
function mnImpHacer() {
  if (!MNI || !MN) return;
  const nom = (document.getElementById('mnImpNom').value || '').trim() || MNI.semana.nombre; MNI.semana.nombre = nom;
  const antS = MN.c.semanas.slice(), antR = MN.c.recetas.slice(), antSem = MN.sem, antDia = MN.dia, vacia = MNI.vacia;
  if (vacia) MN.c.semanas = [];
  MN.c.semanas.push(MNI.semana); MN.c.recetas = MN.c.recetas.concat(MNI.recetas); MN.sem = MNI.semana.id; MN.dia = 0;
  mnRelinkTodo(); mnCambio(); const n = MNI.recetas.length; mnImpCerrar(); mnPintar();
  toast('Importada «' + nom + '»' + (n ? ' con ' + n + ' recetas' : ''), { accion: { texto: 'Deshacer', fn: () => { MN.c.semanas = antS; MN.c.recetas = antR; MN.sem = antSem; MN.dia = antDia; mnCambio(); mnPintar(); } } });
}

// ── Biblioteca ampliable (tabla platos_biblioteca; sin ella solo están los platos de partida, de solo lectura) ──
let MN_BIB_DB = null; // null = sin cargar · false = falta la tabla · lista de filas
let MN_BIBLIOTECA = MN_BIB_SEMILLA.slice();
const mnBibClave = (n, m) => mnNorm(n) + '|' + m;
function mnBibMezcla() { // lo tuyo primero; los platos de partida que no has copiado ni cambiado siguen ahí
  const filas = (MN_BIB_DB || []).map(r => ({ id: r.id, n: r.nombre, m: r.momento, i: r.ingredientes || [], d: r.dias || [], o: r.origen ? [r.origen] : ['Míos'], nt: r.nota || '' }));
  const k = new Set(filas.map(x => mnBibClave(x.n, x.m)));
  MN_BIBLIOTECA = filas.concat(MN_BIB_SEMILLA.filter(p => !k.has(mnBibClave(p.n, p.m))));
}
async function mnBibCargar() {
  try { const r = await sb('platos_biblioteca?select=*&order=nombre.asc&limit=2000'); MN_BIB_DB = Array.isArray(r) ? r : false; } catch (e) { MN_BIB_DB = false; }
  mnBibMezcla();
}
const mnBibRefrescar = async () => { await mnBibCargar(); if (MN && MN.tab === 'biblioteca') mnBibPintar(true); else mnPintar(); };
function mnBibEditar(ix, previo) { // ix = plato de la lista (editar o copiar uno de partida) · null = nuevo · previo = datos de una comida

  document.getElementById('mnBibECuerpo').innerHTML = `<p class="mt" id="mnBibETit">${p && p.id ? 'Editar plato' : p ? 'Copiar a mi biblioteca' : 'Plato nuevo'}</p>
    <div class="mn-g2"><div class="mn-f"><label class="mn-l" for="mnBibEN">Nombre</label><input class="inp" id="mnBibEN" maxlength="160" value="${sudEsc(d.n)}"></div>
      <div class="mn-f"><label class="mn-l" for="mnBibEM">Momento</label><select class="inp" id="mnBibEM" style="width:100%">${MN_TIPOS.filter(t => t[0] !== 'O').map(t => `<option value="${t[0]}"${d.m === t[0] ? ' selected' : ''}>${t[1]}</option>`).join('')}</select></div></div>
    <div class="mn-f" style="margin-top:12px"><label class="mn-l" for="mnBibEI">Ingredientes <span class="hd-opt">(uno por línea)</span></label><textarea class="inp" id="mnBibEI" rows="6" placeholder="80 g avena&#10;1 plátano&#10;250 ml bebida de soja">${sudEsc((d.i || []).join('\n'))}</textarea></div>
    <p class="mn-l" style="margin:14px 0 6px">Tipos de día en los que lo usas</p><div class="mn-checks">${MN_BIB_DIAS.map(t => `<label class="mn-chk2"><input type="checkbox" data-bd="${t[0]}"${(d.d || []).indexOf(t[0]) >= 0 ? ' checked' : ''}> ${t[1]}</label>`).join('')}</div>
    <div class="mn-f" style="margin-top:12px"><label class="mn-l" for="mnBibENt">Nota <span class="hd-opt">(opcional)</span></label><input class="inp" id="mnBibENt" maxlength="300" value="${sudEsc(d.nt || '')}"></div>

  document.getElementById('mMnBibE').style.display = 'flex'; document.getElementById('mnBibEN').focus();
}
function mnBibECerrar() { document.getElementById('mMnBibE').style.display = 'none'; }
async function mnBibEGuardar() {
  const n = document.getElementById('mnBibEN').value.trim(), m = document.getElementById('mnBibEM').value, nt = document.getElementById('mnBibENt').value.trim();

  const e = mnImprEsc, sem = m.semanas.find(s => s.id === o.sem) || m.semanas[0], T = { D: 'Desayuno', A: 'Almuerzo', C: 'Comida', Me: 'Merienda', Ce: 'Cena', O: 'Otra' };
  const f = o.factor && o.factor !== 1 ? o.factor : 1, txt = i => (f !== 1 && i.cant && i.cant.modo !== 'libre') ? mnIngTxt(mnEscala({ n: i.n, cant: i.cant }, f)) : i.t;
  const dias = sem.dias.map(d => { const c = d.ctx || {}; return `<section class="pd"><div class="pd-h"><h2>${e(d.n)}</h2>${c.texto ? `<span class="pd-t">${e(c.texto)}</span>` : ''}</div>${c.aviso ? `<p class="pd-av">${e(c.aviso)}</p>` : ''}${c.suppl ? `<p class="pd-av"><b>Suplementación:</b> ${e(c.suppl)}</p>` : ''}
    ${d.comidas.length ? d.comidas.map(x => `<div class="pd-m"><div class="pd-mt"><b>${T[x.tipo] || 'Comida'}</b>${x.hora ? `<span>${e(x.hora)}</span>` : ''}</div><div class="pd-mc">${x.nombre ? `<div class="pd-n">${e(x.nombre)}${x.libre ? ' <i>(libre)</i>' : ''}</div>` : ''}${(x.ing || []).length ? `<div class="pd-i">${x.ing.map(i => e(txt(i)) + (i.nota ? ` <i>(${e(i.nota)})</i>` : '')).join(' · ')}</div>` : ''}${x.nota ? `<div class="pd-no">${e(x.nota)}</div>` : ''}</div></div>`).join('') : '<p class="pd-av">Sin comidas</p>'}</section>`; }).join('');
  const imp = (m.impresiones || []), obj = (o.objetivo && (m.objetivo || imp.length)) ? `<section class="pd pd-ob">${m.objetivo ? `<p><b>Objetivo:</b> ${e(m.objetivo)}</p>` : ''}${imp.length ? `<p><b>Impresiones:</b> ${imp.map(x => e(x.t)).join(' · ')}</p>` : ''}</section>` : '';
  const compra = o.compra && (sem.compra || []).length ? `<section class="pd-pag"><h2 class="pd-h2">Lista de la compra · ${e(sem.nombre)}</h2><div class="pd-cp">${mnCompraAgrupa(sem.compra).map(g => `<div class="pd-cg"><h3>${e(g.c)}</h3>${g.f.map(x => `<p><span>${e(x.n)}</span><b>${x.libre ? 'al gusto' : e(x.txt)}${x.fmt ? ` <i>${e(x.fmt)}</i>` : ''}</b></p>`).join('')}</div>`).join('')}</div></section>` : '';
  const rec = o.recetas && (m.recetas || []).length ? `<section class="pd-pag"><h2 class="pd-h2">Recetas</h2>${m.recetas.map(r => `<article class="pd pd-r"><h3>${e(r.nombre)}</h3><p class="pd-no">${[r.tiempo, r.raciones, r.dificultad].filter(Boolean).map(e).join(' · ')}</p>${(r.ing || []).length ? `<p class="pd-i"><b>Ingredientes:</b> ${r.ing.map(i => e(i.t)).join(' · ')}</p>` : ''}${(r.pasos || []).length ? `<ol>${r.pasos.map(p => `<li>${e(p)}</li>`).join('')}</ol>` : ''}${r.consejo ? `<p class="pd-no">${e(r.consejo)}</p>` : ''}</article>`).join('')}</section>` : '';
  return `<header class="pd-top"><img src="icon-rounded-192.png" alt=""><div><div class="pd-ti">${e(m.titulo || 'Planificación nutricional')}</div><div class="pd-su">${e(o.cliente || '')}${o.cliente ? ' · ' : ''}${e(sem.nombre)}${sem.nota ? ' · ' + e(sem.nota) : ''}</div></div></header>${obj}${dias}${compra}${rec}<footer class="pd-pie">NutriLogos · ${new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })}</footer>`;
}
function mnImprAbrir() {
  const pub = !!MN.row.publicado;
  document.getElementById('mnImprCuerpo').innerHTML = `<p class="mt" id="mnImprTit">PDF del menú</p>
    <p class="ms">Se abre la ventana de impresión: elige «Guardar como PDF». Sale con texto real y varias páginas si hace falta.</p>
    <div class="mn-g2"><div class="mn-f"><label class="mn-l" for="mnImprO">Qué incluir</label><select class="inp" id="mnImprO" style="width:100%"><option value="b">Borrador (lo que ves ahora)</option>${pub ? '<option value="p">Lo publicado (lo que ve el cliente)</option>' : ''}</select></div>
      <div class="mn-f"><label class="mn-l" for="mnImprS">Semana</label><select class="inp" id="mnImprS" style="width:100%">${MN.c.semanas.map(s => `<option value="${s.id}"${s.id === MN.sem ? ' selected' : ''}>${sudEsc(s.nombre)}</option>`).join('')}</select></div></div>
    <div class="mn-checks" style="margin-top:14px"><label class="mn-chk2"><input type="checkbox" id="mnImprC" checked> Lista de la compra</label><label class="mn-chk2"><input type="checkbox" id="mnImprR"${MN.c.recetas.length ? ' checked' : ' disabled'}> Recetas</label><label class="mn-chk2"><input type="checkbox" id="mnImprOb" checked> Objetivo e impresiones</label></div>
    <div class="mbtns" style="margin-top:16px"><button type="button" class="btn-cancel" onclick="mnImprCerrar()">Cancelar</button><button type="button" class="btn-ok" onclick="mnImprHacer()">Crear PDF</button></div>`;
  document.getElementById('mMnImpr').style.display = 'flex';
}
function mnImprCerrar() { document.getElementById('mMnImpr').style.display = 'none'; }
function mnImprImprimir(html) {
  let b = document.getElementById('mnPrint'); if (!b) { b = document.createElement('div'); b.id = 'mnPrint'; document.body.appendChild(b); }
  b.innerHTML = html; const img = b.querySelector('img'); const ir = () => { window.print(); setTimeout(() => { b.innerHTML = ''; }, 500); };
  if (img && !img.complete) { img.onload = img.onerror = ir; } else ir();
}
function mnImprHacer() {
  const borr = document.getElementById('mnImprO').value === 'b', m = borr ? mnSnapshot() : MN.row.publicado; if (!m) return;
  const o = { sem: document.getElementById('mnImprS').value, compra: document.getElementById('mnImprC').checked, recetas: document.getElementById('mnImprR').checked, objetivo: document.getElementById('mnImprOb').checked, cliente: MN.nombre, factor: 1 };
  mnImprCerrar(); mnImprImprimir(mnImprHtml(m, o));
}
function mnvImprimir() { const s = mnvSem(); mnImprImprimir(mnImprHtml(MENU.menu, { sem: s.id, compra: true, recetas: true, objetivo: true, cliente: '', factor: MNV.f || 1 })); }

// ── Funciones propias de la página de pruebas ──
function mnPrevSet(o) { mnSyncTextos(); MN.prev = o; mnPintar(); }
function mnvPrev(origen) {
  const m = origen === 'borrador' ? mnSnapshot() : MN.row.publicado, box = document.getElementById('menuBody');
  if (!m) { box.innerHTML = vacioHtml('file', 'Todavía no hay menú publicado', 'Pulsa «Publicar» para que el cliente lo vea; hasta entonces puedes mirar el borrador.', null, true); return; }
  MENU = { menu: m, semana_actual: MN.row.semana_actual && m.semanas.some(s => s.id === MN.row.semana_actual) ? MN.row.semana_actual : m.semanas[0].id };
  const s = MENU.menu.semanas.find(x => x.id === MENU.semana_actual); MNV.sem = s.id; MNV.dia = mnvIdxHoy(s); MNV.tab = 'hoy'; MNV.rec = null; MNV.f = 1; try { const g = +localStorage.getItem('mnv_factor'); if (m.ajuste && g >= 0.7 && g <= 1.3) MNV.f = g; } catch (e) {} pintarMenu();
}
async function mnRetirar() {
  const r = await sb(`menus_cliente?id=eq.${MN.row.id}`, { method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({ publicado: null, publicado_en: null }) });
  if (esErrorSb(r)) { toast('No se pudo retirar. Inténtalo de nuevo.', { tipo: 'error' }); return; }
  MN.row.publicado = null; MN.row.publicado_en = null; toast('Menú retirado: el cliente deja de verlo'); mnPintar();
}
// ═══ Mi menú semanal (copia que el profesional publica; el cliente nunca ve el borrador) ═══
let MENU=null; const MNV={sem:null,dia:0,tab:'hoy',rec:null};
const MNV_TIPO={D:['Desayuno','d'],A:['Almuerzo','a'],C:['Comida','c'],Me:['Merienda','me'],Ce:['Cena','ce'],O:['Otra comida','o']};
const MNV_COL={green:'#1D9E75',blue:'#185FA5',amber:'#BA7517',coral:'#993C1D'};
function mnvHoyDow(){ const d=new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Madrid'})).getDay(); return d===0?7:d; }
const mnvSem=()=>MENU.menu.semanas.find(s=>s.id===MNV.sem)||MENU.menu.semanas.find(s=>s.id===MENU.semana_actual)||MENU.menu.semanas[0];
function mnvIdxHoy(s){ const i=s.dias.findIndex(d=>d.dow===mnvHoyDow()); return i>=0?i:0; }
function mnvSet(k,v){ MNV[k]=v; if(k==='sem'){ const s=mnvSem(); MNV.dia=Math.min(MNV.dia,s.dias.length-1); } pintarMenu(); }
function pintarMenu(){
  const m=MENU.menu, s=mnvSem(), tabs=[['hoy','Hoy'],['semana','Semana']];
  if((s.compra||[]).length) tabs.push(['compra','Compra']);
  if((m.recetas||[]).length) tabs.push(['recetas','Recetas']);
  if(m.objetivo||(m.impresiones||[]).length) tabs.push(['plan','Sobre mi plan']);
  if(!tabs.some(t=>t[0]===MNV.tab)) MNV.tab='hoy';
  let h='';
  if(m.semanas.length>1) h+=`<div class="mnv-chips" role="group" aria-label="Semana">${m.semanas.map(x=>`<button type="button" class="mnv-chip${x.id===s.id?' on':''}" onclick="mnvSet('sem','${esc(x.id)}')">${esc(x.nombre)}${x.id===MENU.semana_actual?'<span class="mnv-hoy" aria-label="Esta semana"></span>':''}</button>`).join('')}</div>`;
  if(s.nota) h+=`<p class="mnv-sub">${esc(s.nota)}</p>`;
  if(m.ajuste) h+=mnvFactorHtml();
  h+=`<div class="mnv-tabs" role="tablist" aria-label="Secciones">${tabs.map(t=>`<button type="button" role="tab" class="mnv-tab${MNV.tab===t[0]?' on':''}" aria-selected="${MNV.tab===t[0]}" onclick="mnvSet('tab','${t[0]}')">${t[1]}</button>`).join('')}</div>`;
  h+=MNV.tab==='hoy'?mnvHoy(s):MNV.tab==='semana'?mnvSemana(s):MNV.tab==='compra'?mnvCompra(s):MNV.tab==='recetas'?mnvRecetas():mnvPlan();
  h+=`<div class="mnv-pdf"><button type="button" class="mnv-rb" onclick="mnvImprimir()">Descargar PDF</button></div>`;
  $('menuBody').innerHTML=h; cargarFotos($('menuBody'));
}
function mnvComida(m){
  const t=MNV_TIPO[m.tipo]||MNV_TIPO.O, ing=m.ing||[];
  return `<div class="card mnv-m">
    <div class="mnv-mh"><span class="mnv-b mnv-b-${t[1]}">${t[0]}</span>${m.libre?'<span class="mnv-b mnv-b-l">Libre</span>':''}${m.hora?`<span class="mnv-h">${esc(m.hora)}</span>`:''}</div>
    ${m.nombre?`<div class="mnv-n">${esc(m.nombre)}</div>`:''}
    ${ing.length&&m.libre?'<div class="mnv-ideas">Ideas</div>':''}
    ${ing.length?`<div class="mnv-ing">${ing.map(i=>`<span class="mnv-i">${esc(mnvTxt(i))}${i.nota?` <i>(${esc(i.nota)})</i>`:''}</span>`).join('')}</div>`:''}
    ${!m.libre&&ing.some(i=>(i.sust||[]).length)?`<details class="mnv-alt"><summary>Alternativas permitidas</summary>${ing.filter(i=>(i.sust||[]).length).map(i=>`<p><b>${esc(mnvTxt(i))}</b> → ${i.sust.map(x=>esc(x.t)+(x.max?` <i>(máx. ${x.max} ${x.max===1?'vez':'veces'} por semana)</i>`:'')).join(' · ')}</p>`).join('')}</details>`:''}
    ${m.nota?`<p class="mnv-nota">${esc(m.nota)}</p>`:''}
    ${m.receta&&(MENU.menu.recetas||[]).some(r=>r.id===m.receta)?`<button type="button" class="mnv-rb" onclick="mnvVerReceta('${esc(m.receta)}')">Ver receta</button>`:''}
  </div>`;
}
function mnvHoy(s){
  const hoy=mnvIdxHoy(s), d=s.dias[Math.min(MNV.dia,s.dias.length-1)]||s.dias[0];
  const chips=`<div class="mnv-chips" role="group" aria-label="Día">${s.dias.map((x,i)=>`<button type="button" class="mnv-chip${x===d?' on':''}" onclick="mnvSet('dia',${i})">${esc(x.n)}${i===hoy&&s.id===(MENU.semana_actual||MENU.menu.semanas[0].id)?'<span class="mnv-hoy" aria-label="Hoy"></span>':''}</button>`).join('')}</div>`;
  const c=d.ctx||{}, ctx=((c.texto||c.aviso)?`<div class="mnv-ctx ${esc(c.tipo||'')}">${c.texto?`<b>${esc(c.texto)}</b>`:''}${c.texto&&c.aviso?' — ':''}${esc(c.aviso||'')}</div>`:'')+(c.suppl?`<div class="mnv-ctx mnv-suppl"><b>Suplementación de hoy</b><br>${esc(c.suppl)}</div>`:'');
  const cuerpo=d.comidas.length?d.comidas.map(mnvComida).join(''):vacioC('<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/>','Nada planificado este día','Tu nutricionista no ha añadido comidas a este día.');
  return chips+ctx+cuerpo;
}
// Nombre que se ve en «Semana»: el de la comida; si no lo tiene, el de su receta enlazada o sus primeros ingredientes (nunca solo «Comida»)
function mnvNombre(m){
  if(m.libre) return m.nombre||'Libre';
  if(m.nombre) return m.nombre;
  const rec=(MENU.menu.recetas||[]).find(r=>r.id===m.receta); if(rec&&rec.nombre) return rec.nombre;
  const ing=(m.ing||[]).map(x=>x.n||x.t).filter(Boolean);
  return ing.length?ing.slice(0,3).join(', ')+(ing.length>3?'…':''):'Sin detallar';
}
function mnvSemana(s){
  return s.dias.map((d,i)=>{
    const c=d.ctx||{}, filas=d.comidas.map(m=>{ const t=MNV_TIPO[m.tipo]||MNV_TIPO.O; return `<div class="mnv-sw"><span class="mnv-sw-t"><b>${t[0]}</b>${m.hora?`<small>${esc(m.hora)}</small>`:''}</span><span class="mnv-sw-n">${esc(mnvNombre(m))}</span></div>`; }).join('');
    return `<button type="button" class="mnv-dia" onclick="MNV.dia=${i};mnvSet('tab','hoy')"><div class="mnv-dia-h">${esc(d.n)}<span>${esc(c.texto||'')}</span></div>${filas||'<p>Sin comidas</p>'}</button>`;
  }).join('');
}
function mnvVerReceta(id){ MNV.tab='recetas'; MNV.rec=id; pintarMenu(); const e=$('mnvR_'+id); if(e) e.scrollIntoView({block:'start'}); }
function mnvPlan(){
  const m=MENU.menu, imp=(m.impresiones||[]);
  return (m.objetivo?`<div class="card" style="margin-bottom:12px"><p class="mnv-sh" style="margin-top:0">Objetivo</p><p class="mnv-obj">${esc(m.objetivo)}</p></div>`:'')+
    (imp.length?`<div class="card"><p class="mnv-sh" style="margin-top:0">Impresiones de tu nutricionista</p>${imp.map(x=>`<div class="mnv-imp"><span class="mnv-dot" style="background:${MNV_COL[x.c]||MNV_COL.green}"></span><span>${esc(x.t)}</span></div>`).join('')}</div>`:'');
}

// ═══ Página de pruebas del menú semanal: lista de clientes y arranque ═══
let deportistas = [], _menus = {};
function show(v) { mnFlush && mnFlush(); document.querySelectorAll('.view').forEach(e => e.classList.remove('active')); document.getElementById(v).classList.add('active'); window.scrollTo(0, 0); }
function mostrarSinSesion() {
  const panel = location.origin + location.pathname.replace('planificador-nutricional.html', 'panel-profesional.html');
  document.getElementById('vsin').innerHTML = `<div class="page"><div class="med-box" style="max-width:520px;margin:3rem auto"><p class="sec-title" style="border:none;margin:0 0 6px">Necesitas iniciar sesión</p><p class="med-empty">Esta página usa la misma sesión que el panel. Abre el panel, entra con tu correo y vuelve aquí.</p><div class="med-actions"><a class="btn-add" href="${panel}">Abrir el panel</a></div></div></div>`;
  show('vsin');
}
async function cargarLista() {
  show('vlista'); const el = document.getElementById('lista'); el.innerHTML = skel();
  const [d, m] = await Promise.all([sb('clientes_deportivos?select=id,nombre,deporte,objetivo_impresiones&order=nombre.asc').catch(() => null), sb('menus_cliente?select=deportista_id,publicado_en,actualizado,titulo').catch(() => null)]);
  if (!Array.isArray(d)) { el.innerHTML = '<p class="med-empty">No se pudo cargar la lista de clientes. Comprueba que has entrado en el panel con tu cuenta de profesional.</p>'; return; }
  deportistas = d; _menus = {}; if (Array.isArray(m)) m.forEach(x => { _menus[x.deportista_id] = x; });
  window._sinSql = !Array.isArray(m);
  pintarLista();
}
// ?embed=1 → dentro del panel (sin cabecera propia); ?c=<id> → abre directamente el menú de ese cliente.
(async function arrancar() {
  const q = new URLSearchParams(location.search);
  if (q.get('embed') === '1') document.body.classList.add('embed');
  if (localStorage.getItem('nutrilogos_dark') === '1') document.body.classList.add('dark-mode');
  if (!authLoad()) { mostrarSinSesion(); return; }
  await cargarLista();
  const c = q.get('c'); if (c && deportistas.some(d => d.id == c)) mnAbrir(c);
})();

</script>
