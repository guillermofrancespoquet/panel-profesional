<style>
:root{
  --t900:#04342C;--t800:#085041;--t600:#0F6E56;--t400:#1D9E75;--t100:#9FE1CB;--t50:#E1F5EE;
  --gold:#B8956A;--gold-dk:#7A5A38;--gold-50:#F5EDE0;--beige:#EDE8DE;
  --g900:#1a1a18;--g700:#444441;--g500:#5F5E5A;--g400:#6A6963;--g200:#D3D1C7;--g100:#F1EFE8;
  --bg:#FAFAF8;--sf:#fff;--bd:rgba(0,0,0,.09);--bdm:rgba(0,0,0,.15);
  --red:#B83232;--red-bg:#FEF2F2;
  --f:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--g900);min-height:100vh;font-size:15px;-webkit-font-smoothing:antialiased;line-height:1.6}
.view{display:none}
.view.active{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.inp{width:100%;padding:11px 14px;border:.5px solid var(--bdm);border-radius:10px;font-size:15px;font-family:var(--f);color:var(--g900);outline:none;transition:border-color .15s;background:var(--bg);margin-bottom:10px}
.inp:focus{border-color:var(--t400)}
.page{padding:2rem;max-width:960px;margin:0 auto}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;gap:12px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:3px}
.page-sub{font-size:13px;color:var(--g400)}
.btn-add{display:inline-flex;align-items:center;gap:7px;background:var(--btn);border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:600;padding:10px 18px;cursor:pointer;font-family:var(--f)}
.det-back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--t600);font-weight:500;cursor:pointer;background:none;border:none;font-family:var(--f);margin-bottom:1.5rem}
.sec-title{font-size:13px;font-weight:600;color:var(--g900);margin-bottom:10px;padding-bottom:8px;border-bottom:.5px solid var(--bd)}
.notes-ta{width:100%;min-height:110px;padding:12px 14px;border:.5px solid var(--bdm);border-radius:10px;font-size:14px;font-family:var(--f);color:var(--g900);outline:none;resize:vertical;line-height:1.6;background:var(--bg);transition:border-color .15s}
.notes-ta:focus{border-color:var(--t400)}
.notes-foot{display:flex;align-items:center;gap:10px;margin-top:8px}
.btn-save{padding:9px 18px;background:var(--btn);border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--f)}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.mc{background:var(--sf);border-radius:16px;padding:2rem;width:100%;max-width:400px}
.mt{font-size:18px;font-weight:700;margin-bottom:5px;letter-spacing:-.02em}
.ms{font-size:13px;color:var(--g400);margin-bottom:1.5rem;line-height:1.5}
.mfl{font-size:12px;font-weight:500;color:var(--g500);margin-bottom:6px;display:block}
.btn-cancel{flex:1;padding:11px;background:var(--g100);border:none;border-radius:10px;color:var(--g700);font-size:14px;font-weight:500;cursor:pointer;font-family:var(--f)}
.btn-ok{flex:1;padding:11px;background:var(--btn);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--f)}
.merr{font-size:12px;color:var(--red);margin-top:8px;min-height:16px}
@media(max-width:600px){.page{padding:1.25rem}}
.file-btn{background:var(--g100);border:none;border-radius:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--g500);transition:background .15s}
.file-btn:hover{background:var(--g200)}
.file-btn.del:hover{background:var(--red-bg);color:var(--red)}
.file-btn.on{background:var(--pill-g);color:var(--t800)}
body.dark-mode .file-btn.on{color:var(--t100)}
.med-box{background:var(--sf);border:.5px solid var(--bd);border-radius:12px;padding:1.1rem 1.25rem}
.sup-item-n{font-size:14px;font-weight:700;color:var(--g900)}
.sup-item-d{font-size:13px;color:var(--g700);margin:1px 0 4px}
.med-note{font-size:11px;color:var(--g400);margin-top:8px;line-height:1.5}
.med-empty{font-size:13px;color:var(--g400);line-height:1.6}
.med-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:.5px solid var(--bd)}
.med-empty+.med-actions{margin-top:12px;padding-top:0;border-top:none}
.btn-soft{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--t50);color:var(--t600);border:.5px solid rgba(29,158,117,.28);border-radius:9px;font-size:12.5px;font-weight:600;line-height:1;padding:8px 13px;cursor:pointer;font-family:var(--f);white-space:nowrap;transition:background .15s,border-color .15s,transform .15s}
.btn-soft svg{flex-shrink:0}
.btn-soft:hover{border-color:var(--t400);background:rgba(29,158,117,.14)}
.btn-soft:active{transform:translateY(1px)}
.btn-soft:focus-visible{outline:2px solid var(--t400);outline-offset:2px}
.btn-soft.sm{font-size:11.5px;padding:6px 10px;border-radius:8px}
body.dark-mode .btn-soft{color:var(--t100);border-color:rgba(159,225,203,.22)}
.row-actions{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.row-actions .file-btn{width:28px;height:28px;border-radius:8px}
body.dark-mode{
  --bg:#14181a;--sf:#1f2426;--g900:#f0f0ec;--g700:#cfcec8;--g500:#9c9b95;--g400:#8F8E88;
  --g200:#3a3d3a;--g100:#262a28;--bd:rgba(255,255,255,.08);--bdm:rgba(255,255,255,.16);
  --t50:#193530;--gold-50:#2e2718;--red-bg:#3a1f1f;--red:#F28583;--gold-dk:#D9B88C;--t600:#4FC3A1;--t800:#8FD9BE;
}
body.dark-mode img{opacity:.92}
@media (max-width:860px){html,body{overflow-x:hidden}
.page{padding:1rem;max-width:100%}
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=color]),select,textarea{font-size:16px !important}
.page-header{margin-bottom:1.25rem}
.page-title{font-size:19px}
.mc{padding:1.4rem 1.25rem;max-width:100%}}
.hd-opt{font-weight:400;color:var(--g400)}
@media print{body *{visibility:hidden}
.mbg,.view{display:none !important}
body{background:#fff !important;padding:0 !important;min-height:0 !important}
@page{margin:14mm}}
:root{--pill-n:#E3DFD2;--pill-n-h:#D9D4C4;--pill-n-bd:rgba(70,58,30,.18);--pill-g:#C4E8D6;--pill-g-bd:rgba(15,110,86,.30);--pill-au:#EAD9BD;--pill-au-bd:rgba(122,90,56,.30);--pill-r:#F7D0D0;--pill-r-bd:rgba(192,57,43,.28)}
body.dark-mode{--pill-n:#343a3d;--pill-n-h:#3e4548;--pill-n-bd:rgba(255,255,255,.14);--pill-g:#21493f;--pill-g-bd:rgba(159,225,203,.26);--pill-au:#463c22;--pill-au-bd:rgba(217,184,140,.28);--pill-r:#4e2828;--pill-r-bd:rgba(255,140,140,.24)}
.vacio{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:2.6rem 1.25rem;gap:4px}
.vacio.sm{padding:1.4rem .75rem}
.vacio-ic{width:56px;height:56px;border-radius:50%;background:var(--t50);color:var(--t600);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.vacio.sm .vacio-ic{width:44px;height:44px}
.vacio-t{font-size:15.5px;font-weight:700;color:var(--g900);letter-spacing:-.01em}
.vacio-s{font-size:13px;color:var(--g500);max-width:380px;line-height:1.55}
.vacio .btn-add{margin-top:12px}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:10000;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 24px);pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--t900);color:#fff;font-size:13px;font-weight:500;padding:11px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:toastIn .22s ease;font-family:var(--f);line-height:1.4;transition:opacity .2s,transform .2s}
.toast.error{background:#8F2423}
.toast.aviso{background:#7A5A38}
.toast.out{opacity:0;transform:translateY(6px)}
.toast button{background:none;border:none;color:#9FE1CB;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--f);padding:4px 6px;border-radius:6px;white-space:nowrap}
.toast button:hover{background:rgba(255,255,255,.12)}
body.dark-mode .toast{background:#24302D;border:.5px solid var(--bdm)}
body.dark-mode .toast.error{background:#5C2020}
body.dark-mode .toast.aviso{background:#4A3A28}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}}
.skel{display:block;height:14px;border-radius:7px;margin:9px 0;background:linear-gradient(90deg,var(--g100) 25%,var(--g200) 50%,var(--g100) 75%);background-size:200% 100%;animation:skel 1.3s infinite linear}
.skel.w40{width:40%}
.skel.w60{width:60%}
.skel.w80{width:80%}
@keyframes skel{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}
.toast{animation:none}}
@keyframes ptrSpin{to{transform:rotate(360deg)}}
@media(max-width:860px){html{overscroll-behavior-y:contain}}
.depd-tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--g100);border-radius:12px;scrollbar-width:none}
.depd-tabs::-webkit-scrollbar{display:none}
.depd-tab{flex:1 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border:none;background:none;border-radius:9px;font:600 13px var(--f);color:var(--g500);cursor:pointer;white-space:nowrap;min-height:38px}
.depd-tab:hover{color:var(--g900)}
.depd-tab.on{background:var(--sf);color:var(--t600);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.depd-tab:focus-visible{outline:2px solid var(--t400);outline-offset:1px}
:root{--btn:#17805F;--btn-h:#126B50;--r-btn:10px;--r-field:10px;--r-card:16px;--r-pill:20px;--h-btn:40px;--h-field:42px}
:focus-visible{outline:2px solid #1D9E75;outline-offset:2px}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid #1D9E75;outline-offset:2px}
body.dark-mode :focus-visible{outline-color:#5CC8A6}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media(pointer:coarse){.btn-add,.btn-save,.btn-ok,.btn-cancel,.btn-soft{min-height:44px}
.inp,select.inp{min-height:44px}
.file-btn{min-width:40px;min-height:40px}}
.btn-add,.btn-save,.btn-ok,.btn-cancel{min-height:var(--h-btn)}
.inp{min-height:var(--h-field)}
/* Mi menú semanal */
.mnv-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 -2px;scrollbar-width:none}
.mnv-chips::-webkit-scrollbar{display:none}
.mnv-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:.5px solid var(--bdm);border-radius:20px;background:var(--sf);color:var(--g700);font-size:13.5px;font-weight:600;white-space:nowrap}
.mnv-chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.mnv-hoy{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.mnv-tabs{display:flex;gap:4px;padding:4px;background:var(--g100);border-radius:12px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.mnv-tabs::-webkit-scrollbar{display:none}
.mnv-tab{flex:1 0 auto;padding:9px 14px;border:none;background:none;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--g500);white-space:nowrap}
.mnv-tab.on{background:var(--sf);color:var(--t600);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.mnv-sub{font-size:12.5px;color:var(--g500);margin:-6px 0 12px}
.mnv-ctx{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px;line-height:1.5;background:var(--g100);color:var(--g700);border:.5px solid var(--bd)}
.mnv-ctx.entreno{background:var(--t50);color:var(--t800);border-color:var(--pill-g-bd)}
.mnv-ctx.partido,.mnv-ctx.libre{background:var(--gold-50);color:var(--gold-dk);border-color:var(--pill-au-bd)}
.mnv-ctx b{font-weight:700}
.mnv-m{margin-bottom:10px;padding:14px 16px}
.mnv-mh{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.mnv-b{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--pill-g);color:var(--t900)}
.mnv-b-d,.mnv-b-l{background:var(--pill-au);color:var(--gold-dk)}
.mnv-b-a{background:var(--t50);color:var(--t800)}
.mnv-b-me,.mnv-b-o{background:var(--pill-n);color:var(--g700)}
.mnv-b-ce{background:var(--t800);color:#fff}
.mnv-h{font-size:12px;color:var(--g500)}
.mnv-n{font-size:15.5px;font-weight:700;margin-bottom:6px}
.mnv-ing{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.mnv-i{font-size:13px;background:var(--g100);border:.5px solid var(--bd);border-radius:20px;padding:4px 11px;color:var(--g700);line-height:1.4}
.mnv-i i{font-style:normal;color:var(--g500)}
.mnv-nota{font-size:12.5px;color:var(--g500);line-height:1.5;border-left:2px solid var(--gold);padding-left:9px;margin:8px 0 0}
.mnv-ideas{font-size:11.5px;font-weight:700;color:var(--gold-dk);text-transform:uppercase;letter-spacing:.05em;margin:2px 0 6px}
.mnv-rb{display:inline-flex;margin-top:10px;padding:8px 14px;border-radius:10px;border:.5px solid var(--pill-g-bd);background:var(--t50);color:var(--t800);font-size:13px;font-weight:600}
.mnv-dia{width:100%;text-align:left;background:var(--sf);border:.5px solid var(--bdm);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-family:var(--f);color:var(--g900)}
.mnv-dia-h{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;font-weight:700;margin-bottom:6px}
.mnv-dia-h span{font-size:12px;font-weight:600;color:var(--g500)}
.mnv-dia p{font-size:13px;color:var(--g700);margin:3px 0;line-height:1.45}
.mnv-dia p b{font-weight:700;color:var(--g900)}
.mnv-rec{margin-bottom:10px;padding:0;overflow:hidden}
.mnv-rec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:13px 16px;background:none;border:none;text-align:left;font-family:var(--f);font-size:15px;font-weight:700;color:var(--g900)}
.mnv-rec-h span{font-size:12px;font-weight:600;color:var(--g500)}
.mnv-rec-b{padding:0 16px 16px;border-top:.5px solid var(--bd)}
.mnv-rec-b img{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:12px}
.mnv-sh{font-size:11px;font-weight:700;color:var(--gold-dk);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 6px}
.mnv-pasos{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.mnv-pasos li{display:flex;gap:10px;font-size:13.5px;line-height:1.5;color:var(--g700)}
.mnv-pn{flex:0 0 22px;height:22px;border-radius:50%;background:var(--t50);border:.5px solid var(--pill-g-bd);color:var(--t800);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.mnv-obj{font-size:14.5px;font-weight:600;color:var(--t900);line-height:1.65}
.mnv-imp{display:flex;gap:10px;font-size:13.5px;color:var(--g700);line-height:1.6;padding:9px 0;border-bottom:.5px solid var(--bd)}
.mnv-imp:last-child{border-bottom:none;padding-bottom:0}
.mnv-dot{flex:0 0 8px;height:8px;border-radius:50%;margin-top:8px}
/* ═══ Menú semanal: sistema visual de la página ═══ */
:root{--mn-sh:0 1px 2px rgba(4,52,44,.04),0 4px 16px rgba(4,52,44,.05)}
.lab-top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 28px;background:var(--sf);border-bottom:.5px solid var(--bd)}

.lab-brand{white-space:nowrap}

.mn-btn.dan{color:var(--red)}

<script>

const AUTH_KEY='nl_session';
function authLoad(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch(e){ return null; } }
function authSave(j){ localStorage.setItem(AUTH_KEY,JSON.stringify({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+Math.max((j.expires_in||3600)-60,30)*1000})); }
function authClear(){ try{ localStorage.removeItem(AUTH_KEY); }catch(e){} }
async function authPost(grant,body){
  const r=await fetch(SURL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{'apikey':SKEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.access_token){ const e=new Error(j.error_description||j.msg||'auth'); e.status=r.status; throw e; }
  return j;
}
let _authRefreshing=null;
function authRefresh(){
  if(_authRefreshing) return _authRefreshing;
  const s=authLoad(); if(!s||!s.refresh_token) return Promise.resolve(null);
  _authRefreshing=authPost('refresh_token',{refresh_token:s.refresh_token})
    .then(j=>{ authSave(j); return j.access_token; })
    .catch(e=>{ if(e.status>=400&&e.status<500) authClear(); return null; })   // un fallo de red no cierra la sesión
    .finally(()=>{ _authRefreshing=null; });
  return _authRefreshing;
}
async function authToken(){ const s=authLoad(); if(!s) return null; return Date.now()<s.expires_at ? s.access_token : authRefresh(); }
async function authFetch(url,opts={}){
  const go=async tok=>{ try{ const rr=await fetch(url,{...opts,headers:{'apikey':SKEY,'Authorization':'Bearer '+(tok||SKEY),...(opts.headers||{})}}); conexion(true); return rr; }catch(e){ conexion(false); throw e; } };
  const habiaSesion=!!authLoad();
  const tok=await authToken();
  if(habiaSesion&&!tok&&!authLoad()) sesionCaducada();   // la renovación fue rechazada: la sesión ya no vale
  let r=await go(tok);
  if(r.status===401&&authLoad()){
    const t=await authRefresh();
    if(t) r=await go(t); else sesionCaducada();
  }
  return r;
}
function conexion(ok){ document.body.classList.toggle('sin-conexion',!ok); }
function sesionCaducada(){ authClear(); mostrarSinSesion(); }
async function sb(path,opts={}){
  const r=await authFetch(SURL+'/rest/v1/'+path,{...opts,headers:{'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})}});
  const t=await r.text(); return t?JSON.parse(t):null;
}
function esErrorSb(r){ return !!(r&&typeof r==='object'&&!Array.isArray(r)&&(r.code||r.message||r.hint||r.details)); }
function toast(msg,o={}){
  const box=document.getElementById('toasts'); if(!box) return {cerrar(){}};
  const el=document.createElement('div'); el.className='toast'+(o.tipo?' '+o.tipo:'');
  el.setAttribute('role',o.tipo==='error'?'alert':'status');
  const t=document.createElement('span'); t.textContent=msg; el.appendChild(t);
  let tm=null, cerrado=false;
  const cerrar=()=>{ if(cerrado) return; cerrado=true; clearTimeout(tm); el.classList.add('out'); setTimeout(()=>el.remove(),220); };
  if(o.accion){ const b=document.createElement('button'); b.type='button'; b.textContent=o.accion.texto; b.onclick=()=>{ cerrar(); o.accion.fn(); }; el.appendChild(b); }
  box.appendChild(el);
  while(box.children.length>3) box.firstChild.remove();
  tm=setTimeout(cerrar,o.ms||(o.tipo==='error'?5500:3500));
  return {cerrar};
}
let _pend=null;
function deshacerBorrado(o){
  if(_pend) _pend.ahora();
  o.ocultar();
  let hecho=false, tm=null, aviso=null;
  const ahora=async()=>{
    if(hecho) return; hecho=true; clearTimeout(tm); if(_pend===p) _pend=null; if(aviso) aviso.cerrar();
    let r; try{ r=await o.ejecutar(); }catch(e){ r={code:'red'}; }
    if(esErrorSb(r)){ o.restaurar(); toast('No se pudo eliminar. Se ha restaurado.',{tipo:'error'}); }

  const p={ahora};
  _pend=p;
  tm=setTimeout(ahora,6000);

}

async function oiGuardar(depId) {

  const resolver = m => { const s = mnSrc(m); return { tipo: m.tipo, hora: m.hora || '', nombre: s.nombre || '', nota: s.nota || '', libre: !!m.libre, receta: m.receta || null, ing: ing(s.ing) }; };
  return {
    v: 1, titulo: c.titulo || '', objetivo: oi.objetivo || '', impresiones: (oi.impresiones || []).filter(x => x && x.t),
    semanas: c.semanas.map(s => ({ id: s.id, nombre: s.nombre || 'Semana', nota: s.nota || '', dias: s.dias.map(d2 => ({ n: d2.n, dow: d2.dow || null, ctx: d2.ctx || {}, comidas: d2.comidas.map(resolver) })) })),
    recetas: c.recetas.map(r => ({ id: r.id, nombre: r.nombre || '', tiempo: r.tiempo || '', raciones: r.raciones || '', momento: r.momento || '', objetivo: r.objetivo || '', dificultad: r.dificultad || '', nutri: r.nutri || null, ing: ing(r.ing), pasos: r.pasos || [], consejo: r.consejo || '', nota: r.nota || '', foto: r.foto || null }))
  };
}

    const tiles = nu.kcal || nu.prot || nu.hc || nu.grasa ? `<p class="mnv-sh">Información nutricional</p><div class="mnv-nu">${[['kcal', 'kcal', ''], ['prot', 'proteína', ' g'], ['hc', 'hidratos', ' g'], ['grasa', 'grasa', ' g']].map(x => `<div><b>${nu[x[0]] !== undefined ? Math.round(nu[x[0]]) + x[2] : '—'}</b><span>${x[1]}</span></div>`).join('')}</div><p class="mnv-nu-n">Valores estimados por ración</p>` : '';
    return `<div class="card mnv-rec"><button type="button" class="mnv-rec-h" aria-expanded="${ab}" onclick="MNV.rec=${ab ? 'null' : `'${esc(r.id)}'`};pintarMenu()">${esc(r.nombre || 'Receta')}<span>${[r.tiempo, r.raciones ? r.raciones + ' rac.' : ''].filter(Boolean).map(esc).join(' · ')}</span></button>
      ${ab ? `<div class="mnv-rec-b" id="mnvR_${esc(r.id)}">${r.foto ? `<img data-p="${esc(r.foto)}" alt="">` : ''}${meta ? `<div class="mnv-meta">${meta}</div>` : ''}
        ${(r.ing || []).length ? `<p class="mnv-sh">Ingredientes</p><div class="mnv-ing">${r.ing.map(i => `<span class="mnv-i">${esc(i.t)}${i.nota ? ` <i>(${esc(i.nota)})</i>` : ''}</span>`).join('')}</div>` : ''}
        ${tiles}
        ${(r.pasos || []).length ? `<p class="mnv-sh">Preparación</p><ol class="mnv-pasos">${r.pasos.map((p, i) => `<li><span class="mnv-pn">${i + 1}</span><span>${esc(p)}</span></li>`).join('')}</ol>` : ''}
        ${r.nota ? `<p class="mnv-sh">Nota nutricional</p><p class="mnv-nota" style="margin-top:0">${esc(r.nota)}</p>` : ''}

// ── Lector de recetas en PDF (la plantilla de NutriLogos) ──
// Se lee en el navegador con pdf.js (sin enviar el archivo a ningún servidor): título, momento, objetivo, dificultad, tiempo, raciones,
// ingredientes con cantidad, información nutricional por ración, preparación, nota nutricional y la foto de cabecera.
const MN_PDFJS = { js: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js', worker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js' };
function mnCargarScript(src) { return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('script')); document.head.appendChild(s); }); }
async function mnPdfJs() { if (!window.pdfjsLib) await mnCargarScript(MN_PDFJS.js); window.pdfjsLib.GlobalWorkerOptions.workerSrc = MN_PDFJS.worker; return window.pdfjsLib; }
const mnSinAcentos = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
const MN_ESPACIADO = /^([A-ZÁÉÍÓÚÑ·]{1,3} )+[A-ZÁÉÍÓÚÑ·]{1,3}$/; // «I N G R E D I E N T E S»
// Une los trozos de una misma línea que son un rótulo con letras espaciadas
function mnPdfSegs(items) {
  const its = items.filter(i => i.s.trim()).sort((a, b) => a.y - b.y || a.x - b.x), segs = [];
  for (const i of its) {
    const p = segs[segs.length - 1];
    if (p && p.esp && MN_ESPACIADO.test(i.s) && Math.abs(p.y - i.y) <= 2 && i.x - (p.x + p.w) < 14) { p.s += ' ' + i.s; p.w = i.x + i.w - p.x; continue; }
    segs.push({ ...i, esp: MN_ESPACIADO.test(i.s) });
  }
  return segs;
}
function mnPdfFilas(items, tol) { // agrupa por línea (misma y) y ordena por x
  const filas = []; items.slice().sort((a, b) => a.y - b.y || a.x - b.x).forEach(i => { const f = filas[filas.length - 1]; if (f && Math.abs(f.y - i.y) <= (tol || 3)) f.its.push(i); else filas.push({ y: i.y, its: [i] }); });
  filas.forEach(f => f.its.sort((a, b) => a.x - b.x)); return filas;
}
// items: [{s,x,y,w,h}] con y hacia abajo. Devuelve la receta o null si no es la plantilla.
function mnPdfParse(items) {
  const segs = mnPdfSegs(items), H = {};
  segs.filter(s => s.esp).forEach(s => { const k = mnSinAcentos(s.s.replace(/ /g, '')); if (!H[k]) H[k] = s; });
  const ING = H.INGREDIENTES, PRE = H.PREPARACION; if (!ING || !PRE) return null;
  const INF = H.INFORMACIONNUTRICIONAL, NOTA = H.NOTANUTRICIONAL, PIE = H.NUTRILOGOS;
  const enY = (a, b, f) => items.filter(i => i.s.trim() && i.y > a && i.y < b && (!f || f(i)));
  const r = { nombre: '', tiempo: '', raciones: '', momento: '', objetivo: '', dificultad: '', nutri: null, ing: [], pasos: [], consejo: '', nota: '', foto: null };
  // título: el texto grande de la cabecera
  r.nombre = items.filter(i => i.y < ING.y - 50 && i.h >= 15 && i.s.trim()).sort((a, b) => a.y - b.y || a.x - b.x).map(i => i.s.trim()).join(' ').replace(/\s+/g, ' ');
  // chips de datos: etiqueta espaciada y su valor justo debajo
  const META = { MOMENTO: 'momento', OBJETIVO: 'objetivo', DIFICULTAD: 'dificultad', TIEMPO: 'tiempo', RACIONES: 'raciones' };
  segs.filter(s => s.esp && META[mnSinAcentos(s.s.replace(/ /g, ''))] && s.y < ING.y).forEach(l => {
    const cx = l.x + l.w / 2, cand = items.filter(i => i.y > l.y + 4 && i.y < l.y + 26 && i.s.trim() && !MN_ESPACIADO.test(i.s)).map(i => ({ i, d: Math.abs(i.x + i.w / 2 - cx) })).sort((a, b) => a.d - b.d)[0];
    if (cand && cand.d < 70) r[META[mnSinAcentos(l.s.replace(/ /g, ''))]] = cand.i.s.trim();
  });
  // ingredientes (columna izquierda): nombre a la izquierda y cantidad a la derecha en la misma línea
  const xMax = INF ? INF.x - 8 : 9999;
  mnPdfFilas(enY(ING.y + 4, PRE.y - 4, i => i.x < xMax)).forEach(f => {
    const nombre = f.its[0].s.trim(); let qty = f.its.slice(1).map(i => i.s.trim()).join(' ').trim();
    if (!nombre) return;
    const ing = mnParseLinea(nombre); if (!ing) return;
    if (qty) {
      const q = mnQty(qty);
      if (q) { ing.cant = q.cant; if (q.rest) ing.nota = [ing.nota, q.rest].filter(Boolean).join('; '); }
      else if (mnNorm(ing.n).indexOf(mnNorm(qty)) < 0) ing.nota = [ing.nota, qty].filter(Boolean).join('; ');
      else { ing.n = ing.n.replace(new RegExp('\\s*' + qty.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*$', 'i'), '').trim() || ing.n; ing.nota = [ing.nota, qty].filter(Boolean).join('; '); }
    }
    r.ing.push(ing);
  });
  // información nutricional por ración
  if (INF) {
    const zona = enY(INF.y + 4, PRE.y - 4, i => i.x >= INF.x - 40), nu = {};
    const etq = { kcal: 'kcal', proteina: 'prot', carbohidratos: 'hc', grasa: 'grasa' };
    zona.forEach(l => { const k = etq[mnSinAcentos(l.s).toLowerCase().trim()]; if (!k) return; const cx = l.x + l.w / 2;
      const n = zona.filter(i => i.y < l.y && i.y > l.y - 30 && /^\d+(?:[.,]\d+)?\s*(g|kcal)?$/i.test(i.s.trim())).map(i => ({ i, d: Math.abs(i.x + i.w / 2 - cx) })).sort((a, b) => a.d - b.d)[0];
      if (n && n.d < 50) nu[k] = parseFloat(n.i.s.replace(',', '.')); });
    if (Object.keys(nu).length) r.nutri = nu;
  }
  // preparación: un número y su texto (que puede seguir en líneas siguientes)
  mnPdfFilas(enY(PRE.y + 4, NOTA ? NOTA.y - 4 : (PIE ? PIE.y - 4 : 99999))).forEach(f => {
    const a = f.its[0], resto = f.its.slice(1).map(i => i.s.trim()).join(' ').trim();
    if (/^\d+$/.test(a.s.trim()) && a.x < 70) r.pasos.push(resto); else if (r.pasos.length) r.pasos[r.pasos.length - 1] = (r.pasos[r.pasos.length - 1] + ' ' + f.its.map(i => i.s.trim()).join(' ')).trim();
  });
  const limpia = t => t.replace(/\s+/g, ' ').replace(/\s+([.,;:!?])/g, '$1').trim();
  r.pasos = r.pasos.map(limpia).filter(Boolean);
  // nota nutricional
  if (NOTA) r.nota = limpia(mnPdfFilas(enY(NOTA.y + 4, PIE ? PIE.y - 4 : 99999)).map(f => f.its.map(i => i.s.trim()).join(' ')).join(' '));
  return r;
}
// Lee el PDF entero: texto (con posiciones) y la foto grande de cabecera
async function mnLeerPdfReceta(file) {
  const lib = await mnPdfJs(), pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise, page = await pdf.getPage(1), vp = page.getViewport({ scale: 1 });
  const tc = await page.getTextContent();
  const items = tc.items.filter(i => i.str && i.str.trim()).map(i => ({ s: i.str, x: i.transform[4], y: vp.height - i.transform[5], w: i.width, h: Math.hypot(i.transform[2], i.transform[3]) }));
  const r = mnPdfParse(items); if (!r) return null;
  try { // la foto: la imagen más grande que no sea cuadrada (el logo lo es)
    const ops = await page.getOperatorList(), nombres = [];
    for (let k = 0; k < ops.fnArray.length; k++) if (ops.fnArray[k] === lib.OPS.paintImageXObject) nombres.push(ops.argsArray[k][0]);
    let mejor = null;
    for (const n of nombres) { const o = await new Promise(ok => page.objs.get(n, ok)); if (o && o.bitmap && o.width >= 500 && Math.abs(o.width / o.height - 1) > 0.15 && (!mejor || o.width * o.height > mejor.width * mejor.height)) mejor = o; }
    if (mejor) {
      const k = Math.min(1, 1280 / Math.max(mejor.width, mejor.height)), cv = document.createElement('canvas'); cv.width = Math.round(mejor.width * k); cv.height = Math.round(mejor.height * k);
      cv.getContext('2d').drawImage(mejor.bitmap, 0, 0, cv.width, cv.height);
      r.fotoBlob = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.85));
    }
  } catch (e) {}
  return r;
}

// ── Funciones propias de la página de pruebas ──
function mnPrevSet(o) { mnSyncTextos(); MN.prev = o; mnPintar(); }
function mnvPrev(origen) {
  const m = origen === 'borrador' ? mnSnapshot() : MN.row.publicado, box = document.getElementById('menuBody');
  if (!m) { box.innerHTML = vacioHtml('file', 'Todavía no hay menú publicado', 'Pulsa «Publicar» para que el cliente lo vea; hasta entonces puedes mirar el borrador.', null, true); return; }
  MENU = { menu: m, semana_actual: MN.row.semana_actual && m.semanas.some(s => s.id === MN.row.semana_actual) ? MN.row.semana_actual : m.semanas[0].id };
  const s = MENU.menu.semanas.find(x => x.id === MENU.semana_actual); MNV.sem = s.id; MNV.dia = mnvIdxHoy(s); MNV.tab = 'hoy'; MNV.rec = null; pintarMenu();
}
async function mnRetirar() {
  const r = await sb(`menus_cliente?id=eq.${MN.row.id}`, { method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({ publicado: null, publicado_en: null }) });
  if (esErrorSb(r)) { toast('No se pudo retirar. Inténtalo de nuevo.', { tipo: 'error' }); return; }
  MN.row.publicado = null; MN.row.publicado_en = null; toast('Menú retirado: el cliente deja de verlo'); mnPintar();
}
// ═══ Mi menú semanal (copia que el profesional publica; el cliente nunca ve el borrador) ═══
let MENU=null; const MNV={sem:null,dia:0,tab:'hoy',rec:null};
const MNV_TIPO={D:['Desayuno','d'],A:['Almuerzo','a'],C:['Comida','c'],Me:['Merienda','me'],Ce:['Cena','ce'],O:['Otra comida','o']};
const MNV_COL={green:'#1D9E75',blue:'#185FA5',amber:'#BA7517',coral:'#993C1D'};
function mnvHoyDow(){ const d=new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Madrid'})).getDay(); return d===0?7:d; }
const mnvSem=()=>MENU.menu.semanas.find(s=>s.id===MNV.sem)||MENU.menu.semanas.find(s=>s.id===MENU.semana_actual)||MENU.menu.semanas[0];
function mnvIdxHoy(s){ const i=s.dias.findIndex(d=>d.dow===mnvHoyDow()); return i>=0?i:0; }
function mnvSet(k,v){ MNV[k]=v; if(k==='sem'){ const s=mnvSem(); MNV.dia=Math.min(MNV.dia,s.dias.length-1); } pintarMenu(); }
function pintarMenu(){
  const m=MENU.menu, s=mnvSem(), tabs=[['hoy','Hoy'],['semana','Semana']];
  if((m.recetas||[]).length) tabs.push(['recetas','Recetas']);
  if(m.objetivo||(m.impresiones||[]).length) tabs.push(['plan','Sobre mi plan']);
  if(!tabs.some(t=>t[0]===MNV.tab)) MNV.tab='hoy';
  let h='';
  if(m.semanas.length>1) h+=`<div class="mnv-chips" role="group" aria-label="Semana">${m.semanas.map(x=>`<button type="button" class="mnv-chip${x.id===s.id?' on':''}" onclick="mnvSet('sem','${esc(x.id)}')">${esc(x.nombre)}${x.id===MENU.semana_actual?'<span class="mnv-hoy" aria-label="Esta semana"></span>':''}</button>`).join('')}</div>`;
  if(s.nota) h+=`<p class="mnv-sub">${esc(s.nota)}</p>`;
  h+=`<div class="mnv-tabs" role="tablist" aria-label="Secciones">${tabs.map(t=>`<button type="button" role="tab" class="mnv-tab${MNV.tab===t[0]?' on':''}" aria-selected="${MNV.tab===t[0]}" onclick="mnvSet('tab','${t[0]}')">${t[1]}</button>`).join('')}</div>`;
  h+=MNV.tab==='hoy'?mnvHoy(s):MNV.tab==='semana'?mnvSemana(s):MNV.tab==='recetas'?mnvRecetas():mnvPlan();
  $('menuBody').innerHTML=h; cargarFotos($('menuBody'));
}
function mnvComida(m){
  const t=MNV_TIPO[m.tipo]||MNV_TIPO.O, ing=m.ing||[];
  return `<div class="card mnv-m">
    <div class="mnv-mh"><span class="mnv-b mnv-b-${t[1]}">${t[0]}</span>${m.libre?'<span class="mnv-b mnv-b-l">Libre</span>':''}${m.hora?`<span class="mnv-h">${esc(m.hora)}</span>`:''}</div>
    ${m.nombre?`<div class="mnv-n">${esc(m.nombre)}</div>`:''}
    ${ing.length&&m.libre?'<div class="mnv-ideas">Ideas</div>':''}
    ${ing.length?`<div class="mnv-ing">${ing.map(i=>`<span class="mnv-i">${esc(i.t)}${i.nota?` <i>(${esc(i.nota)})</i>`:''}</span>`).join('')}</div>`:''}
    ${m.nota?`<p class="mnv-nota">${esc(m.nota)}</p>`:''}
    ${m.receta&&(MENU.menu.recetas||[]).some(r=>r.id===m.receta)?`<button type="button" class="mnv-rb" onclick="mnvVerReceta('${esc(m.receta)}')">Ver receta</button>`:''}
  </div>`;
}
function mnvHoy(s){
  const hoy=mnvIdxHoy(s), d=s.dias[Math.min(MNV.dia,s.dias.length-1)]||s.dias[0];
  const chips=`<div class="mnv-chips" role="group" aria-label="Día">${s.dias.map((x,i)=>`<button type="button" class="mnv-chip${x===d?' on':''}" onclick="mnvSet('dia',${i})">${esc(x.n)}${i===hoy&&s.id===(MENU.semana_actual||MENU.menu.semanas[0].id)?'<span class="mnv-hoy" aria-label="Hoy"></span>':''}</button>`).join('')}</div>`;
  const c=d.ctx||{}, ctx=(c.texto||c.aviso)?`<div class="mnv-ctx ${esc(c.tipo||'')}">${c.texto?`<b>${esc(c.texto)}</b>`:''}${c.texto&&c.aviso?' — ':''}${esc(c.aviso||'')}</div>`:'';
  const cuerpo=d.comidas.length?d.comidas.map(mnvComida).join(''):vacioC('<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/>','Nada planificado este día','Tu nutricionista no ha añadido comidas a este día.');
  return chips+ctx+cuerpo;
}
function mnvSemana(s){
  return s.dias.map((d,i)=>{
    const c=d.ctx||{}, filas=d.comidas.map(m=>{ const t=MNV_TIPO[m.tipo]||MNV_TIPO.O; return `<p><b>${t[0]}${m.hora?' · '+esc(m.hora):''}:</b> ${m.libre?'Libre':esc(m.nombre||(m.ing||[]).map(x=>x.n).join(', ')||'—')}</p>`; }).join('');
    return `<button type="button" class="mnv-dia" onclick="MNV.dia=${i};mnvSet('tab','hoy')"><div class="mnv-dia-h">${esc(d.n)}<span>${esc(c.texto||'')}</span></div>${filas||'<p>Sin comidas</p>'}</button>`;
  }).join('');
}
function mnvVerReceta(id){ MNV.tab='recetas'; MNV.rec=id; pintarMenu(); const e=$('mnvR_'+id); if(e) e.scrollIntoView({block:'start'}); }
function mnvPlan(){
  const m=MENU.menu, imp=(m.impresiones||[]);
  return (m.objetivo?`<div class="card" style="margin-bottom:12px"><p class="mnv-sh" style="margin-top:0">Objetivo</p><p class="mnv-obj">${esc(m.objetivo)}</p></div>`:'')+
    (imp.length?`<div class="card"><p class="mnv-sh" style="margin-top:0">Impresiones de tu nutricionista</p>${imp.map(x=>`<div class="mnv-imp"><span class="mnv-dot" style="background:${MNV_COL[x.c]||MNV_COL.green}"></span><span>${esc(x.t)}</span></div>`).join('')}</div>`:'');
}

// ═══ Página de pruebas del menú semanal: lista de clientes y arranque ═══
let deportistas = [], _menus = {};
function show(v) { mnFlush && mnFlush(); document.querySelectorAll('.view').forEach(e => e.classList.remove('active')); document.getElementById(v).classList.add('active'); window.scrollTo(0, 0); }
