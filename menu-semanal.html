// ── Estructura ──
function mnDiasNuevos() { return MN_DIAS.map((n, i) => ({ id: mnId('d'), n, dow: i + 1, ctx: { tipo: '', texto: '', aviso: '' }, comidas: [] })); }
function mnSemanaNueva(nombre) { return { id: mnId('s'), nombre: nombre || 'Semana típica', nota: '', dias: mnDiasNuevos() }; }
function mnContenidoNuevo(nombre) { return { v: 1, titulo: 'Planificación nutricional' + (nombre ? ' — ' + nombre : ''), semanas: [mnSemanaNueva()], recetas: [], platos: [] }; }
const mnSem = () => MN.c.semanas.find(s => s.id === MN.sem) || MN.c.semanas[0];
const mnDia = () => { const s = mnSem(); return s && (s.dias[MN.dia] || s.dias[0]); };
function mnTodasComidas() { const r = []; MN.c.semanas.forEach(s => s.dias.forEach(d => d.comidas.forEach(m => r.push(m)))); return r; }
const mnSrc = m => m.plato ? (MN.c.platos.find(p => p.id === m.plato) || m) : m;
function mnEnt(id) { // quien guarda los ingredientes de ese id: una receta, una comida guardada o una comida suelta
  let r = MN.c.recetas.find(x => x.id === id); if (r) return r;
  r = MN.c.platos.find(x => x.id === id); if (r) return r;
  const m = mnTodasComidas().find(x => x.id === id); return m ? mnSrc(m) : null;
}
function mnLink(n) {
  const x = mnNorm(n); if (!x || !MN) return null; let best = null;
  for (const a of MN.cat) { const y = mnNorm(a.nombre); if (x === y) return a.id; if (x.indexOf(y + ' ') === 0 && (!best || y.length > best.l)) best = { id: a.id, l: y.length }; }
  return best ? best.id : null;
}
function mnRelinkTodo() {
  const todos = [].concat(MN.c.recetas, MN.c.platos, mnTodasComidas());
  todos.forEach(e => (e.ing || []).forEach(i => { if (!i.a || !MN.cat.some(a => a.id == i.a)) i.a = mnLink(i.n); }));
}

// ── Guardado ──
function mnEstadoTxt() {
  const r = MN.row, pub = r.publicado_en;
  const sinPub = pub && new Date(r.actualizado) - new Date(pub) > 1500;
  const partes = [MN.dirty ? 'Sin guardar…' : '✓ Guardado'];
  partes.push(pub ? ('Publicado el ' + mnFecha(pub) + (sinPub || MN.dirty ? ' · hay cambios sin publicar' : '')) : 'Sin publicar: el cliente aún no lo ve');
  return partes.join(' · ');
}
function mnMarca() { const e = document.getElementById('mnEstado'); if (e) e.textContent = mnEstadoTxt(); }
function mnCambio() { if (!MN) return; MN.dirty = true; mnMarca(); clearTimeout(_mnT); _mnT = setTimeout(() => mnGuardarYa(), 1200); }
async function mnGuardarYa(oculta) {
  if (!MN || !MN.dirty) return;
  clearTimeout(_mnT);
  const ahora = new Date().toISOString(), c = MN.c, id = MN.row.id;
  let r; try { r = await sb(`menus_cliente?id=eq.${id}`, { method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({ contenido: c, titulo: c.titulo || null, actualizado: ahora }), ...(oculta ? { keepalive: true } : {}) }); } catch (e) { r = { code: 'red' }; }
  if (esErrorSb(r)) { const e = document.getElementById('mnEstado'); if (e) e.textContent = 'No se pudo guardar'; toast('No se pudo guardar el menú. Inténtalo de nuevo.', { tipo: 'error' }); return; }
  if (MN && MN.row.id === id) { MN.dirty = false; MN.row.actualizado = ahora; MN.row.contenido = c; mnMarca(); }
}
function mnFlush() { if (!MN) return; mnSyncTextos(); if (MN.dirty) mnGuardarYa(true); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') mnFlush(); });

// ── Bloque de la ficha (Plan → Menú semanal) ──
async function mnCargarFila(depId) {
  try { const r = await sb(`menus_cliente?deportista_id=eq.${depId}&select=*&limit=1`); if (Array.isArray(r)) return r[0] || null; } catch (e) {}
  return undefined; // la tabla no existe todavía
}

// ── Editor ──
function mnAsegurar() { // deja el contenido con todas las listas
  const c = MN.c; c.v = 1; c.semanas = Array.isArray(c.semanas) && c.semanas.length ? c.semanas : [mnSemanaNueva()];
  c.recetas = c.recetas || []; c.platos = c.platos || [];
  c.semanas.forEach(s => { s.dias = Array.isArray(s.dias) && s.dias.length ? s.dias : mnDiasNuevos(); s.dias.forEach(d => { d.comidas = d.comidas || []; d.ctx = d.ctx || { tipo: '', texto: '', aviso: '' }; }); });
  if (!MN.sem || !c.semanas.some(s => s.id === MN.sem)) MN.sem = c.semanas[0].id;
}
async function mnAbrir(depId) {
  let row = await mnCargarFila(depId);
  if (row === undefined) { toast('Falta ejecutar supabase_menu_semanal.sql en Supabase.', { tipo: 'error' }); return; }
  const d = deportistas.find(x => x.id == depId) || {};
  if (!row) {
    const c = mnContenidoNuevo(d.nombre);
    const r = await sb('menus_cliente', { method: 'POST', body: JSON.stringify({ deportista_id: depId, titulo: c.titulo, contenido: c }) });
    if (esErrorSb(r) || !Array.isArray(r) || !r[0]) { toast('No se pudo crear el menú. Inténtalo de nuevo.', { tipo: 'error' }); return; }
    row = r[0];
  }
  let cat = []; try { const r = await sb('alimentos?select=*&order=nombre.asc&limit=2000'); if (Array.isArray(r)) cat = r; } catch (e) {}
  const hoy = (new Date().getDay() + 6) % 7;
  MN = { depId, nombre: d.nombre || '', row, c: row.contenido || {}, cat, sem: null, dia: hoy, tab: 'menu', dirty: false, rec: null };
  mnAsegurar(); mnRelinkTodo(); _mnFila = row;
  show('vmenuc'); mnPintar(); window.scrollTo(0, 0);
}
function mnSalir() { mnFlush(); MN = null; show('vlista'); cargarLista(); }
function mnTab(k) { MN.tab = k; mnPintar(); }

}
function mnIngBloque(entId, ing, ph) {

    <textarea class="notes-ta mn-ta" id="mnIng_${entId}" rows="4" placeholder="${sudEsc(ph || '80 g avena\n1 plátano\n200 ml bebida de soja\nTomate, pepino')}" oninput="mnIngInput('${entId}',this.value)">${sudEsc(mnTextoIng(ing))}</textarea>

let _mnIT = {};
function mnAplicarIng(entId, txt) {
  const e = mnEnt(entId); if (!e) return;
  e.ing = mnParseTexto(txt, e.ing); e.ing.forEach(i => { if (!i.a) i.a = mnLink(i.n); });

}
function mnIngInput(entId, txt) { clearTimeout(_mnIT[entId]); _mnIT[entId] = setTimeout(() => { delete _mnIT[entId]; mnAplicarIng(entId, txt); }, 350); }
function mnSyncTextos() { Object.keys(_mnIT).forEach(k => { clearTimeout(_mnIT[k]); delete _mnIT[k]; const t = document.getElementById('mnIng_' + k); if (t) mnAplicarIng(k, t.value); }); }

function mnBuscaComida(id) { for (const s of MN.c.semanas) for (const d of s.dias) { const i = d.comidas.findIndex(m => m.id === id); if (i >= 0) return { d, i, m: d.comidas[i] }; } return null; }
function mnSetM(id, k, v, repintar) { const r = mnBuscaComida(id); if (!r) return; r.m[k] = v; mnCambio(); if (repintar) mnPintar(); }
function mnSetS(id, k, v) { const r = mnBuscaComida(id); if (!r) return; mnSrc(r.m)[k] = v; mnCambio(); }
function mnSemSet(k, v) { mnSem()[k] = v; mnCambio(); if (k === 'nombre') document.querySelectorAll('.mn-chips')[0].querySelectorAll('.mn-chip.on').forEach(b => { b.textContent = v || 'Semana'; }); }
function mnCtxSet(k, v) { mnDia().ctx[k] = v; mnCambio(); }
function mnElegirSemana(id) { MN.sem = id; mnPintar(); }
function mnElegirDia(i) { MN.dia = i; mnPintar(); }
function mnNuevaSemana() { const s = mnSemanaNueva('Semana ' + (MN.c.semanas.length + 1)); MN.c.semanas.push(s); MN.sem = s.id; mnCambio(); mnPintar(); }
function mnClonar(o) { return JSON.parse(JSON.stringify(o)); }
function mnRenovarIds(s) { s.id = mnId('s'); s.dias.forEach(d => { d.id = mnId('d'); d.comidas.forEach(m => { m.id = mnId('m'); (m.ing || []).forEach(i => { i.id = mnId('i'); }); }); }); return s; }
function mnDuplicarSemana() { const o = mnSem(), s = mnRenovarIds(mnClonar(o)); s.nombre = (o.nombre + ' (copia)').slice(0, 40); const ix = MN.c.semanas.indexOf(o); MN.c.semanas.splice(ix + 1, 0, s); MN.sem = s.id; mnCambio(); mnPintar(); toast('Semana duplicada'); }
function mnEliminarSemana() {
  const o = mnSem(), ix = MN.c.semanas.indexOf(o); if (MN.c.semanas.length < 2) return;
  MN.c.semanas.splice(ix, 1); MN.sem = MN.c.semanas[Math.max(0, ix - 1)].id; mnCambio(); mnPintar();
  toast('Semana eliminada', { accion: { texto: 'Deshacer', fn: () => { MN.c.semanas.splice(ix, 0, o); MN.sem = o.id; mnCambio(); mnPintar(); } } });
}
function mnNuevaComida() {
  const d = mnDia(), usados = d.comidas.map(m => m.tipo), tipo = ['D', 'A', 'C', 'Me', 'Ce'].find(t => usados.indexOf(t) < 0) || 'O';

  mnCambio(); mnPintar();
  const u = d.comidas[d.comidas.length - 1]; const e = document.getElementById('mnN_' + u.id); if (e) e.focus();
}
function mnMover(id, dir) { const r = mnBuscaComida(id); if (!r) return; const j = r.i + dir; if (j < 0 || j >= r.d.comidas.length) return; const t = r.d.comidas[j]; r.d.comidas[j] = r.m; r.d.comidas[r.i] = t; mnCambio(); mnPintar(); }
function mnDuplicarComida(id) { const r = mnBuscaComida(id); if (!r) return; const n = mnClonar(r.m); n.id = mnId('m'); (n.ing || []).forEach(i => { i.id = mnId('i'); }); r.d.comidas.splice(r.i + 1, 0, n); mnCambio(); mnPintar(); }
function mnEliminarComida(id) {
  const r = mnBuscaComida(id); if (!r) return; r.d.comidas.splice(r.i, 1); mnCambio(); mnPintar();
  toast('Comida eliminada', { accion: { texto: 'Deshacer', fn: () => { r.d.comidas.splice(r.i, 0, r.m); mnCambio(); mnPintar(); } } });
}
function mnVaciarDia() {
  const d = mnDia(), ant = d.comidas, ctx = d.ctx; d.comidas = []; d.ctx = { tipo: '', texto: '', aviso: '' }; mnCambio(); mnPintar();

}
// Comidas guardadas (reutilizables): se escriben una vez y se usan en varios días; editarlas cambia todos los usos.
function mnGuardarPlato(id) {
  const r = mnBuscaComida(id); if (!r) return; const m = r.m;
  const p = { id: mnId('p'), nombre: m.nombre || '', nota: m.nota || '', ing: mnClonar(m.ing || []) };
  if (!p.nombre) { toast('Ponle nombre al plato para poder reutilizarlo', { tipo: 'aviso' }); const e = document.getElementById('mnN_' + id); if (e) e.focus(); return; }

  _mnCatEd = { id: null, nombre, categoria: '', estado: '', medidas: [], nutri: {}, fuente: 'manual', fuente_ref: '' };
  _mnCatCb = nuevo => { const x = mnNorm(nombre); [].concat(MN.c.recetas, MN.c.platos, mnTodasComidas()).forEach(en => (en.ing || []).forEach(i => { if (mnNorm(i.n) === x) i.a = nuevo.id; })); };
  _mnCatCbCerrar = true; mnCatPintar(); document.getElementById('mMnCat').style.display = 'flex';
}

// ── Publicar ──
function mnSnapshot() {
  const c = MN.c, d = deportistas.find(x => x.id == MN.depId) || {}, oi = d.objetivo_impresiones || {};
  const ing = l => (l || []).map(i => ({ t: mnIngTxt(i), n: i.n, a: i.a || null, cant: i.cant, nota: i.nota || '' }));
  const resolver = m => { const s = mnSrc(m); return { tipo: m.tipo, hora: m.hora || '', nombre: s.nombre || '', nota: s.nota || '', libre: !!m.libre, receta: m.receta || null, ing: ing(s.ing) }; };
  return {
    v: 1, titulo: c.titulo || '', objetivo: oi.objetivo || '', impresiones: (oi.impresiones || []).filter(x => x && x.t),
    semanas: c.semanas.map(s => ({ id: s.id, nombre: s.nombre || 'Semana', nota: s.nota || '', dias: s.dias.map(d2 => ({ n: d2.n, dow: d2.dow || null, ctx: d2.ctx || {}, comidas: d2.comidas.map(resolver) })) })),
    recetas: c.recetas.map(r => ({ id: r.id, nombre: r.nombre || '', tiempo: r.tiempo || '', raciones: r.raciones || '', ing: ing(r.ing), pasos: r.pasos || [], consejo: r.consejo || '', foto: r.foto || null }))
  };
}
async function mnPublicar() {
  if (!MN) return;
  mnSyncTextos();
  if (!mnTodasComidas().length) { toast('Añade al menos una comida antes de publicar.', { tipo: 'aviso' }); return; }
  await mnGuardarYa();
  const ahora = new Date().toISOString(), snap = mnSnapshot();
  const sem = MN.row.semana_actual && MN.c.semanas.some(s => s.id === MN.row.semana_actual) ? MN.row.semana_actual : MN.c.semanas[0].id;
  const r = await sb(`menus_cliente?id=eq.${MN.row.id}`, { method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({ publicado: snap, publicado_en: ahora, actualizado: ahora, semana_actual: sem, titulo: MN.c.titulo || null }) });
  if (esErrorSb(r)) { toast('No se pudo publicar. Inténtalo de nuevo.', { tipo: 'error' }); return; }
  MN.row.publicado = snap; MN.row.publicado_en = ahora; MN.row.actualizado = ahora; MN.row.semana_actual = sem; MN.dirty = false;
  toast('Menú publicado: el cliente ya lo ve'); mnMarca();
  mnPintar();
}

// ── Objetivo e impresiones (ficha → Plan): se copian al menú al publicarlo ──
function objImpHtml(d) {
  const oi = d.objetivo_impresiones || {}, imp = oi.impresiones || [];
  return `<textarea class="notes-ta" id="oiObj" maxlength="1500" style="min-height:90px" placeholder="Objetivo del plan, tal como se lo explicas al cliente…" aria-label="Objetivo">${sudEsc(oi.objetivo || '')}</textarea>
    <p class="mfl" style="margin:12px 0 6px">Impresiones del profesional <span class="hd-opt">(máx. 8)</span></p>
    <div id="oiLista">${imp.map((x, i) => oiFila(x, i)).join('')}</div>
    <div class="notes-foot"><button class="btn-save" onclick="oiGuardar(${d.id})">Guardar</button>${btnSoft('Añadir impresión', 'oiAnadir()', 'plus')}<span class="med-note" style="margin:0">Se publica junto al menú; el cliente lo ve en «Sobre mi plan».</span></div>`;
}
function oiFila(x, i) {
  return `<div class="oi-f"><select class="inp oi-c" aria-label="Color" data-oi="c">${MN_COL.map(o => `<option value="${o[0]}"${(x.c || 'green') === o[0] ? ' selected' : ''}>${o[1]}</option>`).join('')}</select><textarea class="notes-ta oi-t" rows="2" maxlength="600" aria-label="Impresión ${i + 1}" data-oi="t">${sudEsc(x.t || '')}</textarea><button type="button" class="file-btn del" aria-label="Quitar impresión" onclick="this.parentNode.remove()">×</button></div>`;
}
function oiAnadir() { const l = document.getElementById('oiLista'); if (l.children.length >= 8) { toast('Máximo 8 impresiones', { tipo: 'aviso' }); return; } l.insertAdjacentHTML('beforeend', oiFila({ c: 'green', t: '' }, l.children.length)); l.lastElementChild.querySelector('textarea').focus(); }
async function oiGuardar(depId) {
  const objetivo = document.getElementById('oiObj').value.trim().slice(0, 1500);
  const impresiones = [...document.querySelectorAll('#oiLista .oi-f')].map(f => ({ c: f.querySelector('select').value, t: f.querySelector('textarea').value.trim() })).filter(x => x.t).slice(0, 8);
  const val = objetivo || impresiones.length ? { objetivo, impresiones } : null;
  const r = await patchDep(depId, { objetivo_impresiones: val });
  if (esErrorSb(r)) { toast(/objetivo_impresiones|PGRST204|schema cache/i.test(String(r.message || '')) ? 'Falta ejecutar supabase_menu_semanal.sql en Supabase.' : 'No se pudo guardar. Inténtalo de nuevo.', { tipo: 'error' }); return; }
  const d = deportistas.find(x => x.id == depId); if (d) d.objetivo_impresiones = val;
  toast('Objetivo e impresiones guardados' + (MN && MN.row && MN.row.publicado_en ? '. Vuelve a publicar el menú para que el cliente lo vea.' : ''));
}


// ── Funciones propias de la página de pruebas ──
function mnObjetivoHtml() { const d = deportistas.find(x => x.id == MN.depId) || { id: MN.depId }; return `<div class="mn-box"><p class="mn-ayuda" style="margin:0 0 10px">En la app definitiva esto vive en la ficha del cliente (pestaña Plan). Se copia dentro del menú al publicar.</p>${objImpHtml(d)}</div>`; }
function mnClienteHtml() {
  const b = (k, t) => `<button type="button" class="mn-chip${(MN.prev || 'borrador') === k ? ' on' : ''}" onclick="mnPrevSet('${k}')">${t}</button>`;
  return `<div class="mn-box"><div class="mn-chips" style="margin:0 0 8px">${b('borrador', 'Borrador (lo que verá al publicar)')}${b('publicado', 'Publicado (lo que ve ahora)')}</div><p class="mn-ayuda" style="margin:0">Así se ve en el área de clientes. Aquí no hace falta una cuenta de cliente: es la misma vista.</p></div><div class="mnv-frame"><div class="mnv-bar">Área de clientes · Mi menú semanal</div><div id="menuBody"></div></div>`;
}
function mnPrevSet(o) { mnSyncTextos(); MN.prev = o; mnPintar(); }
function mnvPrev(origen) {
  const m = origen === 'borrador' ? mnSnapshot() : MN.row.publicado, box = document.getElementById('menuBody');
  if (!m) { box.innerHTML = vacioHtml('file', 'Todavía no hay menú publicado', 'Pulsa «Publicar» para que el cliente lo vea; hasta entonces puedes mirar el borrador.', null, true); return; }
  MENU = { menu: m, semana_actual: MN.row.semana_actual && m.semanas.some(s => s.id === MN.row.semana_actual) ? MN.row.semana_actual : m.semanas[0].id };
  const s = MENU.menu.semanas.find(x => x.id === MENU.semana_actual); MNV.sem = s.id; MNV.dia = mnvIdxHoy(s); MNV.tab = 'hoy'; MNV.rec = null; pintarMenu();
}
async function mnTocaSemana(semId) {
  const r = await sb(`menus_cliente?id=eq.${MN.row.id}`, { method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({ semana_actual: semId }) });
  if (esErrorSb(r)) { toast('No se pudo cambiar. Inténtalo de nuevo.', { tipo: 'error' }); return; }
  MN.row.semana_actual = semId; toast('Semana actualizada: el cliente ya ve esta semana');
}
async function mnRetirar() {
  const r = await sb(`menus_cliente?id=eq.${MN.row.id}`, { method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({ publicado: null, publicado_en: null }) });
  if (esErrorSb(r)) { toast('No se pudo retirar. Inténtalo de nuevo.', { tipo: 'error' }); return; }
  MN.row.publicado = null; MN.row.publicado_en = null; toast('Menú retirado: el cliente deja de verlo'); mnPintar();
}
// ═══ Mi menú semanal (copia que el profesional publica; el cliente nunca ve el borrador) ═══
let MENU=null; const MNV={sem:null,dia:0,tab:'hoy',rec:null};
const MNV_TIPO={D:['Desayuno','d'],A:['Almuerzo','a'],C:['Comida','c'],Me:['Merienda','me'],Ce:['Cena','ce'],O:['Otra comida','o']};
const MNV_COL={green:'#1D9E75',blue:'#185FA5',amber:'#BA7517',coral:'#993C1D'};
function mnvHoyDow(){ const d=new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Madrid'})).getDay(); return d===0?7:d; }
const mnvSem=()=>MENU.menu.semanas.find(s=>s.id===MNV.sem)||MENU.menu.semanas.find(s=>s.id===MENU.semana_actual)||MENU.menu.semanas[0];
function mnvIdxHoy(s){ const i=s.dias.findIndex(d=>d.dow===mnvHoyDow()); return i>=0?i:0; }
function mnvSet(k,v){ MNV[k]=v; if(k==='sem'){ const s=mnvSem(); MNV.dia=Math.min(MNV.dia,s.dias.length-1); } pintarMenu(); }
function pintarMenu(){
  const m=MENU.menu, s=mnvSem(), tabs=[['hoy','Hoy'],['semana','Semana']];
  if((m.recetas||[]).length) tabs.push(['recetas','Recetas']);
  if(m.objetivo||(m.impresiones||[]).length) tabs.push(['plan','Sobre mi plan']);
  if(!tabs.some(t=>t[0]===MNV.tab)) MNV.tab='hoy';
  let h='';
  if(m.semanas.length>1) h+=`<div class="mnv-chips" role="group" aria-label="Semana">${m.semanas.map(x=>`<button type="button" class="mnv-chip${x.id===s.id?' on':''}" onclick="mnvSet('sem','${esc(x.id)}')">${esc(x.nombre)}${x.id===MENU.semana_actual?'<span class="mnv-hoy" aria-label="Esta semana"></span>':''}</button>`).join('')}</div>`;
  if(s.nota) h+=`<p class="mnv-sub">${esc(s.nota)}</p>`;
  h+=`<div class="mnv-tabs" role="tablist" aria-label="Secciones">${tabs.map(t=>`<button type="button" role="tab" class="mnv-tab${MNV.tab===t[0]?' on':''}" aria-selected="${MNV.tab===t[0]}" onclick="mnvSet('tab','${t[0]}')">${t[1]}</button>`).join('')}</div>`;
  h+=MNV.tab==='hoy'?mnvHoy(s):MNV.tab==='semana'?mnvSemana(s):MNV.tab==='recetas'?mnvRecetas():mnvPlan();
  $('menuBody').innerHTML=h; cargarFotos($('menuBody'));
}
function mnvComida(m){
  const t=MNV_TIPO[m.tipo]||MNV_TIPO.O, ing=m.ing||[];
  return `<div class="card mnv-m">
    <div class="mnv-mh"><span class="mnv-b mnv-b-${t[1]}">${t[0]}</span>${m.libre?'<span class="mnv-b mnv-b-l">Libre</span>':''}${m.hora?`<span class="mnv-h">${esc(m.hora)}</span>`:''}</div>
    ${m.nombre?`<div class="mnv-n">${esc(m.nombre)}</div>`:''}
    ${ing.length&&m.libre?'<div class="mnv-ideas">Ideas</div>':''}
    ${ing.length?`<div class="mnv-ing">${ing.map(i=>`<span class="mnv-i">${esc(i.t)}${i.nota?` <i>(${esc(i.nota)})</i>`:''}</span>`).join('')}</div>`:''}
    ${m.nota?`<p class="mnv-nota">${esc(m.nota)}</p>`:''}
    ${m.receta&&(MENU.menu.recetas||[]).some(r=>r.id===m.receta)?`<button type="button" class="mnv-rb" onclick="mnvVerReceta('${esc(m.receta)}')">Ver receta</button>`:''}
  </div>`;
}
function mnvHoy(s){
  const hoy=mnvIdxHoy(s), d=s.dias[Math.min(MNV.dia,s.dias.length-1)]||s.dias[0];
  const chips=`<div class="mnv-chips" role="group" aria-label="Día">${s.dias.map((x,i)=>`<button type="button" class="mnv-chip${x===d?' on':''}" onclick="mnvSet('dia',${i})">${esc(x.n)}${i===hoy&&s.id===(MENU.semana_actual||MENU.menu.semanas[0].id)?'<span class="mnv-hoy" aria-label="Hoy"></span>':''}</button>`).join('')}</div>`;
  const c=d.ctx||{}, ctx=(c.texto||c.aviso)?`<div class="mnv-ctx ${esc(c.tipo||'')}">${c.texto?`<b>${esc(c.texto)}</b>`:''}${c.texto&&c.aviso?' — ':''}${esc(c.aviso||'')}</div>`:'';
  const cuerpo=d.comidas.length?d.comidas.map(mnvComida).join(''):vacioC('<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/>','Nada planificado este día','Tu nutricionista no ha añadido comidas a este día.');
  return chips+ctx+cuerpo;
}
function mnvSemana(s){
  return s.dias.map((d,i)=>{
    const c=d.ctx||{}, filas=d.comidas.map(m=>{ const t=MNV_TIPO[m.tipo]||MNV_TIPO.O; return `<p><b>${t[0]}${m.hora?' · '+esc(m.hora):''}:</b> ${m.libre?'Libre':esc(m.nombre||(m.ing||[]).map(x=>x.n).join(', ')||'—')}</p>`; }).join('');
    return `<button type="button" class="mnv-dia" onclick="MNV.dia=${i};mnvSet('tab','hoy')"><div class="mnv-dia-h">${esc(d.n)}<span>${esc(c.texto||'')}</span></div>${filas||'<p>Sin comidas</p>'}</button>`;
  }).join('');
}
function mnvRecetas(){
  return (MENU.menu.recetas||[]).map(r=>{
    const ab=MNV.rec===r.id;
    return `<div class="card mnv-rec"><button type="button" class="mnv-rec-h" aria-expanded="${ab}" onclick="MNV.rec=${ab?'null':`'${esc(r.id)}'`};pintarMenu()">${esc(r.nombre||'Receta')}<span>${[r.tiempo,r.raciones?r.raciones+' rac.':''].filter(Boolean).map(esc).join(' · ')}</span></button>
      ${ab?`<div class="mnv-rec-b" id="mnvR_${esc(r.id)}">${r.foto?`<img data-p="${esc(r.foto)}" alt="">`:''}
        ${(r.ing||[]).length?`<p class="mnv-sh">Ingredientes</p><div class="mnv-ing">${r.ing.map(i=>`<span class="mnv-i">${esc(i.t)}${i.nota?` <i>(${esc(i.nota)})</i>`:''}</span>`).join('')}</div>`:''}
        ${(r.pasos||[]).length?`<p class="mnv-sh">Preparación</p><ol class="mnv-pasos">${r.pasos.map((p,i)=>`<li><span class="mnv-pn">${i+1}</span><span>${esc(p)}</span></li>`).join('')}</ol>`:''}
        ${r.consejo?`<p class="mnv-nota" style="margin-top:12px">${esc(r.consejo)}</p>`:''}</div>`:''}</div>`;
  }).join('');
}
function mnvVerReceta(id){ MNV.tab='recetas'; MNV.rec=id; pintarMenu(); const e=$('mnvR_'+id); if(e) e.scrollIntoView({block:'start'}); }
function mnvPlan(){
  const m=MENU.menu, imp=(m.impresiones||[]);
  return (m.objetivo?`<div class="card" style="margin-bottom:12px"><p class="mnv-sh" style="margin-top:0">Objetivo</p><p class="mnv-obj">${esc(m.objetivo)}</p></div>`:'')+
    (imp.length?`<div class="card"><p class="mnv-sh" style="margin-top:0">Impresiones de tu nutricionista</p>${imp.map(x=>`<div class="mnv-imp"><span class="mnv-dot" style="background:${MNV_COL[x.c]||MNV_COL.green}"></span><span>${esc(x.t)}</span></div>`).join('')}</div>`:'');
}

// ═══ Página de pruebas del menú semanal: lista de clientes y arranque ═══
let deportistas = [], _menus = {};
function show(v) { mnFlush && mnFlush(); document.querySelectorAll('.view').forEach(e => e.classList.remove('active')); document.getElementById(v).classList.add('active'); window.scrollTo(0, 0); }
function mostrarSinSesion() {
  const panel = location.origin + location.pathname.replace('menu-semanal.html', 'panel-profesional.html');
  document.getElementById('vsin').innerHTML = `<div class="page"><div class="med-box" style="max-width:520px;margin:3rem auto"><p class="sec-title" style="border:none;margin:0 0 6px">Necesitas iniciar sesión</p><p class="med-empty">Esta página usa la misma sesión que el panel. Abre el panel, entra con tu correo y vuelve aquí.</p><div class="med-actions"><a class="btn-add" href="${panel}">Abrir el panel</a></div></div></div>`;
  show('vsin');
}
async function cargarLista() {
  show('vlista'); const el = document.getElementById('lista'); el.innerHTML = skel();
  const [d, m] = await Promise.all([sb('clientes_deportivos?select=id,nombre,deporte,objetivo_impresiones&order=nombre.asc').catch(() => null), sb('menus_cliente?select=deportista_id,publicado_en,actualizado,titulo').catch(() => null)]);
  if (!Array.isArray(d)) { el.innerHTML = '<p class="med-empty">No se pudo cargar la lista de clientes. Comprueba que has entrado en el panel con tu cuenta de profesional.</p>'; return; }
  deportistas = d; _menus = {}; if (Array.isArray(m)) m.forEach(x => { _menus[x.deportista_id] = x; });
  window._sinSql = !Array.isArray(m);
  pintarLista();
}
function pintarLista() {
  const q = mnNorm(document.getElementById('listaQ').value), el = document.getElementById('lista');
  const aviso = window._sinSql ? '<p class="mn-ayuda" style="margin:0 0 10px;color:var(--red)">Falta ejecutar <b>supabase_menu_semanal.sql</b> en Supabase: sin él no se puede guardar ni publicar.</p>' : '';
  const rows = deportistas.filter(x => !q || mnNorm(x.nombre).indexOf(q) >= 0).map(x => {
    const m = _menus[x.id], pub = m && m.publicado_en, sinPub = pub && new Date(m.actualizado) - new Date(pub) > 1500;
    const est = !m ? 'Sin menú' : !pub ? 'Borrador' : sinPub ? 'Publicado · cambios sin publicar' : 'Publicado';
    return `<button type="button" class="lab-fila" onclick="mnAbrir(${x.id})"><span><span class="sup-item-n">${sudEsc(x.nombre)}</span><span class="sup-item-d">${sudEsc(x.deporte || 'Modalidad sin especificar')}</span></span><span class="lab-est${pub ? ' pub' : ''}">${est}</span></button>`;
  }).join('');
  el.innerHTML = aviso + (rows || '<p class="med-empty">Ningún cliente con ese nombre.</p>');
}
(async function arrancar() {
  if (localStorage.getItem('nutrilogos_dark') === '1') document.body.classList.add('dark-mode');
  if (!authLoad()) { mostrarSinSesion(); return; }
  cargarLista();
})();

</script>
