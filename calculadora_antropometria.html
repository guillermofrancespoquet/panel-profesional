// Prepara un canvas para dibujar a mayor resolución física (más nítido en pantallas de alta
// densidad) sin cambiar nada del código de dibujo: los ejes/paddings/fuentes siguen usando las
// mismas coordenadas "lógicas" de siempre (el ancho/alto declarados en el HTML). Es un escalado
// fijo (no depende de devicePixelRatio ni de getBoundingClientRect en tiempo de ejecución), así
// que no se recalcula ni se desajusta al redibujar o cambiar de vista.
function beginHiResCanvas(cv, scale){
  scale = scale || 2;
  const logicalW = cv.width, logicalH = cv.height;
  cv.dataset.logicalW = logicalW;
  cv.dataset.logicalH = logicalH;
  cv.width = logicalW * scale;
  cv.height = logicalH * scale;
  const ctx = cv.getContext("2d");
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  return { ctx, W: logicalW, H: logicalH };
}
// Traduce las coordenadas de un evento de ratón/touch sobre un canvas (que puede estar escalado
// por CSS respecto a su resolución interna) a coordenadas en "píxeles lógicos" del propio dibujo.
function canvasPointFromEvent(cv, e){
  const rect = cv.getBoundingClientRect();
  const logicalW = cv.dataset.logicalW ? parseFloat(cv.dataset.logicalW) : cv.width;
  const logicalH = cv.dataset.logicalH ? parseFloat(cv.dataset.logicalH) : cv.height;
  const scaleX = logicalW / rect.width;
  const scaleY = logicalH / rect.height;
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY, clientX: e.clientX, clientY: e.clientY };
}
// Activa el tooltip hover en un canvas dado un conjunto de "regiones sensibles" (hitRegions),
// cada una con {test(mx,my) → bool, html}. Se usa un solo listener por canvas (se sobreescribe
// en cada redibujado, sin acumular).
function wireChartHover(cv, hitRegions){
  cv.onmousemove = (e)=>{
    const p = canvasPointFromEvent(cv, e);
    let hit = null;
    for(const r of hitRegions){ if(r.test(p.x,p.y)){ hit = r; break; } }
    if(hit) showChartTooltip(p.clientX, p.clientY, hit.html);
    else hideChartTooltip();
  };
  cv.onmouseleave = hideChartTooltip;
}
function niceTicks(min, max, targetCount){
  if(min===max){ min-=1; max+=1; }
  const range = max-min;
  const rawStep = range/(targetCount||5);
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep/mag;
  let step;
  if(norm<1.5) step=1*mag; else if(norm<3) step=2*mag; else if(norm<7) step=5*mag; else step=10*mag;
  const niceMin = Math.floor(min/step)*step;
  const niceMax = Math.ceil(max/step)*step;
  const ticks = [];
  for(let v=niceMin; v<=niceMax+step/1000; v+=step) ticks.push(Math.round(v*1000)/1000);
  return ticks;
}
function drawLegend(ctx, x, y, items){
  ctx.font="9.5px Arial"; ctx.textAlign="left"; ctx.textBaseline="middle";
  let cx = x;
  items.forEach(([label,color,dashed])=>{
    ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=2;
    ctx.setLineDash(dashed?[3,2]:[]);
    ctx.beginPath(); ctx.moveTo(cx,y); ctx.lineTo(cx+14,y); ctx.stroke();
    ctx.setLineDash([]);
    if(!dashed){ ctx.beginPath(); ctx.arc(cx+7,y,2.5,0,2*Math.PI); ctx.fill(); }
    ctx.fillStyle="#3a352c";
    ctx.fillText(label, cx+19, y+1);
    cx += 19 + ctx.measureText(label).width + 16;
  });
  ctx.textBaseline="alphabetic";
}

/* --- Somatocarta (canvas) --- */
function drawSomatochart(canvasId, points){
  const cv = document.getElementById(canvasId);
  if(!cv) return;
  const { ctx, W, H } = beginHiResCanvas(cv, 2);
  const padL = 34, padR = 20, padT = 44, padB = 40;
  ctx.clearRect(0,0,W,H);
  // Rango típico de la somatocarta: X e Y entre -9 y 9
  const range = 9;
  const toPx = (x,y)=>{
    const px = padL + ( (x+range) / (range*2) ) * (W-padL-padR);
    const py = (H-padB) - ( (y+range) / (range*2) ) * (H-padT-padB);
    return [px,py];
  };
  // cuadrícula con marcas numéricas
  ctx.strokeStyle = "#e2dccb"; ctx.lineWidth=1;
  ctx.fillStyle="#9a9284"; ctx.font="9px Arial";
  for(let g=-9; g<=9; g+=3){
    let [x1] = toPx(g,-range); let [x2] = toPx(g,range);
    ctx.beginPath(); ctx.moveTo(x1,padT); ctx.lineTo(x2,H-padB); ctx.stroke();
    let [,y3] = toPx(-range,g); let [,y4] = toPx(range,g);
    ctx.beginPath(); ctx.moveTo(padL,y3); ctx.lineTo(W-padR,y4); ctx.stroke();
    // marcas numéricas en los ejes centrales
    ctx.textAlign="center"; ctx.fillText(String(g), x1, H-padB+12);
    ctx.textAlign="right"; ctx.fillText(String(g), padL-4, y3+3);
  }
  // ejes centrales (x=0, y=0) resaltados
  ctx.strokeStyle = "#c9c2b0"; ctx.lineWidth=1.2;
  let [xz1] = toPx(0,-range), [xz2] = toPx(0,range);
  ctx.beginPath(); ctx.moveTo(xz1,padT); ctx.lineTo(xz2,H-padB); ctx.stroke();
  let [,yz1] = toPx(-range,0), [,yz2] = toPx(range,0);
  ctx.beginPath(); ctx.moveTo(padL,yz1); ctx.lineTo(W-padR,yz2); ctx.stroke();
  // marco
  ctx.strokeStyle = "#0F6E56"; ctx.lineWidth=1.4;
  ctx.strokeRect(padL,padT,W-padL-padR,H-padT-padB);

  // etiquetas de los tres polos del somatotipo
  ctx.fillStyle="#3a352c"; ctx.font="bold 11px Arial";
  ctx.textAlign="left";   ctx.fillText("Endomorfia", padL, H-padB+26);
  ctx.textAlign="right";  ctx.fillText("Ectomorfia", W-padR, H-padB+26);
  ctx.textAlign="center"; ctx.fillText("Mesomorfia", (padL+W-padR)/2, padT-28);

  // leyenda (actual vs anterior) si hay más de un punto
  if(points.length>1){
    drawLegend(ctx, padL, padT-12, [["Valoración actual","#0F6E56",false],["Valoración anterior","#B8956A",true]]);
  }

  // línea entre puntos (evolución)
  if(points.length>1){
    ctx.strokeStyle = "#B8956A"; ctx.lineWidth=2; ctx.setLineDash([4,3]);
    ctx.beginPath();
    points.slice().reverse().forEach((p,i)=>{
      const [x,y] = toPx(p.x,p.y);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke(); ctx.setLineDash([]);
  }
  const hitRegions = [];
  points.forEach(p=>{
    const [x,y] = toPx(p.x,p.y);
    ctx.beginPath(); ctx.arc(x,y, p.current?7:5, 0, 2*Math.PI);
    ctx.fillStyle = p.current ? "#0F6E56" : "#B8956A";
    ctx.fill();
    ctx.strokeStyle="#fff"; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle = "#26312f"; ctx.font="10px Arial"; ctx.textAlign="left";
    ctx.fillText(p.label, x+9, y-9);
    const r = (p.current?7:5) + 6;
    hitRegions.push({ test:(mx,my)=> Math.hypot(mx-x,my-y)<=r,
      html:`<strong>${esc(p.label)}</strong>${p.current?" (actual)":" (anterior)"}<br>Endo ${fmt(p.endo,1)} — Meso ${fmt(p.meso,1)} — Ecto ${fmt(p.ecto,1)}` });
  });
  wireChartHover(cv, hitRegions);
}

/* --- Gráfico de evolución (canvas) --- */
function drawEvoChart(canvasId, client, uptoId){
  const cv = document.getElementById(canvasId);
  if(!cv) return;
  const { ctx, W, H } = beginHiResCanvas(cv, 2);
  const padL = 36, padR = 42, padT = 34, padB = 34;
  ctx.clearRect(0,0,W,H);
  const vals = client.valoraciones.slice().sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  const series = vals.map(v=>{
    const valores = valoresDesdeValoracion(v, client);
    const edad = edadDecimal(v.fecha, client.fechaNacimiento);
    const R = calcularResultados(valores, client, edad);
    return { fecha:v.fecha, peso: valores.peso, grasa: R?R.pctGrasaPrimaria:null };
  }).filter(s=>s.peso!==null);
  if(series.length<2){
    ctx.fillStyle="#6b6b6b"; ctx.font="13px Arial"; ctx.textAlign="center";
    ctx.fillText("Se necesitan al menos 2 valoraciones para ver la evolución.", W/2, H/2);
    return;
  }
  const pesos = series.map(s=>s.peso);
  const grasas = series.map(s=>s.grasa).filter(g=>g!==null&&!isNaN(g));
  const hasGrasa = grasas.length===series.length;
  const pTicks = niceTicks(Math.min(...pesos), Math.max(...pesos), 5);
  const gTicks = hasGrasa ? niceTicks(Math.min(...grasas), Math.max(...grasas), 5) : null;
  const minP=pTicks[0], maxP=pTicks[pTicks.length-1];
  const minG = gTicks?gTicks[0]:0, maxG = gTicks?gTicks[gTicks.length-1]:100;
  const pDec = pTicks.some(t=>Math.abs(t-Math.round(t))>1e-9) ? 1 : 0;
  const gDec = gTicks && gTicks.some(t=>Math.abs(t-Math.round(t))>1e-9) ? 1 : 0;

  const plotW = W-padL-padR, plotH = H-padT-padB;
  const xStep = series.length>1 ? plotW/(series.length-1) : 0;
  const xAt = i => padL + i*xStep;
  const yAtP = v => (H-padB) - ((v-minP)/(maxP-minP))*plotH;
  const yAtG = v => (H-padB) - ((v-minG)/(maxG-minG))*plotH;

  // Gridlines horizontales (según el eje del peso, a la izquierda)
  ctx.font="9px Arial";
  pTicks.forEach(t=>{
    const y=yAtP(t);
    ctx.strokeStyle="#ece6d8"; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillStyle="#0F6E56"; ctx.textAlign="right"; ctx.fillText(fmt(t,pDec), padL-6, y+3);
  });
  if(hasGrasa){
    gTicks.forEach(t=>{
      const y=yAtG(t);
      ctx.fillStyle="#B8956A"; ctx.textAlign="left"; ctx.fillText(fmt(t,gDec), W-padR+6, y+3);
    });
  }
  ctx.strokeStyle="#c9c2ab"; ctx.beginPath();
  ctx.moveTo(padL,padT); ctx.lineTo(padL,H-padB); ctx.lineTo(W-padR,H-padB);
  if(hasGrasa) ctx.moveTo(W-padR,padT), ctx.lineTo(W-padR,H-padB);
  ctx.stroke();

  // Título de ejes
  ctx.save(); ctx.translate(11,(padT+H-padB)/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign="center"; ctx.fillStyle="#0F6E56"; ctx.font="9px Arial"; ctx.fillText("Peso (kg)",0,0); ctx.restore();
  if(hasGrasa){
    ctx.save(); ctx.translate(W-9,(padT+H-padB)/2); ctx.rotate(Math.PI/2);
    ctx.textAlign="center"; ctx.fillStyle="#B8956A"; ctx.font="9px Arial"; ctx.fillText("% Masa grasa",0,0); ctx.restore();
  }

  // Línea de peso
  ctx.strokeStyle="#0F6E56"; ctx.lineWidth=2; ctx.beginPath();
  series.forEach((s,i)=>{ const x=xAt(i), y=yAtP(s.peso); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();
  series.forEach((s,i)=>{
    const x=xAt(i), y=yAtP(s.peso);
    ctx.beginPath(); ctx.arc(x,y,3.5,0,2*Math.PI); ctx.fillStyle="#0F6E56"; ctx.fill();
    ctx.lineWidth=1.2; ctx.strokeStyle="#faf6ef"; ctx.stroke();
  });
  // Línea de % grasa
  if(hasGrasa){
    ctx.strokeStyle="#B8956A"; ctx.lineWidth=2; ctx.beginPath();
    series.forEach((s,i)=>{ const x=xAt(i), y=yAtG(s.grasa); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.stroke();
    series.forEach((s,i)=>{
      const x=xAt(i), y=yAtG(s.grasa);
      ctx.beginPath(); ctx.arc(x,y,3.5,0,2*Math.PI); ctx.fillStyle="#B8956A"; ctx.fill();
      ctx.lineWidth=1.2; ctx.strokeStyle="#faf6ef"; ctx.stroke();
    });
  }
  ctx.fillStyle="#6b6b6b"; ctx.font="9px Arial"; ctx.textAlign="center";
  series.forEach((s,i)=>{ ctx.fillText(fmtDate(s.fecha), xAt(i), H-padB+14); });

  drawLegend(ctx, padL, 12, hasGrasa
    ? [["Peso (kg)","#0F6E56",false],["% Masa grasa","#B8956A",false]]
    : [["Peso (kg)","#0F6E56",false]]);
}

/* --- Gráfico de evolución genérico: 1-2 métricas en un único eje Y ---
   Cada métrica es {key, label, color, get:(R,valores)=>número|null}. Solo se
   usan las valoraciones donde TODAS las métricas pedidas están disponibles,
   para que las líneas queden alineadas en el mismo eje X. */
function drawEvoMetricChart(canvasId, client, metrics){
  const cv = document.getElementById(canvasId);
  if(!cv) return;
  const { ctx, W, H } = beginHiResCanvas(cv, 2);
  const padL = 36, padR = 16, padT = 34, padB = 34;
  ctx.clearRect(0,0,W,H);

  const vals = client.valoraciones.slice().sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  const rows = vals.map(v=>{
    const valores = valoresDesdeValoracion(v, client);
    const edad = edadDecimal(v.fecha, client.fechaNacimiento);
    const R = calcularResultados(valores, client, edad);
    const point = { fecha: v.fecha };
    metrics.forEach(m=>{ point[m.key] = R ? m.get(R, valores) : null; });
    return point;
  });
  const series = rows.filter(r => metrics.every(m => r[m.key]!==null && r[m.key]!==undefined && !isNaN(r[m.key])));
  if(series.length<2){
    ctx.fillStyle="#6b6b6b"; ctx.font="13px Arial"; ctx.textAlign="center";
    ctx.fillText("Se necesitan al menos 2 valoraciones con estos datos para ver la evolución.", W/2, H/2);
    return;
  }
  const allVals = metrics.flatMap(m=>series.map(s=>s[m.key]));
  const ticks = niceTicks(Math.min(...allVals), Math.max(...allVals), 5);
  const minV = ticks[0], maxV = ticks[ticks.length-1];
  const dec = ticks.some(t=>Math.abs(t-Math.round(t))>1e-9) ? 1 : 0;

  const plotW = W-padL-padR, plotH = H-padT-padB;
  const xStep = series.length>1 ? plotW/(series.length-1) : 0;
  const xAt = i => padL + i*xStep;
  const yAt = v => (H-padB) - ((v-minV)/(maxV-minV))*plotH;

  ctx.font="9px Arial";
  ticks.forEach(t=>{
    const y=yAt(t);
    ctx.strokeStyle="#ece6d8"; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillStyle="#6b6b6b"; ctx.textAlign="right"; ctx.fillText(fmt(t,dec), padL-6, y+3);
  });
  ctx.strokeStyle="#c9c2ab"; ctx.beginPath();
  ctx.moveTo(padL,padT); ctx.lineTo(padL,H-padB); ctx.lineTo(W-padR,H-padB); ctx.stroke();

  metrics.forEach(m=>{
    ctx.strokeStyle=m.color; ctx.lineWidth=2; ctx.beginPath();
    series.forEach((s,i)=>{ const x=xAt(i), y=yAt(s[m.key]); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.stroke();
    series.forEach((s,i)=>{
      const x=xAt(i), y=yAt(s[m.key]);
      ctx.beginPath(); ctx.arc(x,y,3.5,0,2*Math.PI); ctx.fillStyle=m.color; ctx.fill();
      ctx.lineWidth=1.2; ctx.strokeStyle="#faf6ef"; ctx.stroke();
    });
  });

  ctx.fillStyle="#6b6b6b"; ctx.font="9px Arial"; ctx.textAlign="center";
  series.forEach((s,i)=>{ ctx.fillText(fmtDate(s.fecha), xAt(i), H-padB+14); });

  drawLegend(ctx, padL, 12, metrics.map(m=>[m.label, m.color, false]));
}

/* --- Perfil de pliegues cutáneos (canvas, barras) --- */
function drawFoldsChart(canvasId, valores, prevValores){
  const cv = document.getElementById(canvasId);
  if(!cv) return;
  const { ctx, W, H } = beginHiResCanvas(cv, 2);
  const pad = 40, padR = 16;
  ctx.clearRect(0,0,W,H);

  const curr = FOLD_KEYS.map(k=>valores["pl_"+k]);
  const prevv = prevValores ? FOLD_KEYS.map(k=>prevValores["pl_"+k]) : null;
  const hasPrev = prevv && prevv.every(v=>v!==null && v!==undefined && !isNaN(v));
  const allVals = curr.concat(hasPrev?prevv:[]).filter(v=>v!==null && v!==undefined && !isNaN(v));
  if(allVals.length===0){
    ctx.fillStyle="#6b6b6b"; ctx.font="13px Arial"; ctx.textAlign="center";
    ctx.fillText("Sin datos de pliegues para esta valoración.", W/2, H/2);
    wireChartHover(cv, []);
    return;
  }
  const maxV = Math.max(...allVals) * 1.15;
  const n = FOLD_KEYS.length;
  const groupW = (W-pad-padR)/n;
  const barW = hasPrev ? groupW*0.32 : groupW*0.46;
  const yAt = v => (H-pad) - (v/maxV)*(H-pad-24);

  ctx.strokeStyle="#e2dccb"; ctx.beginPath(); ctx.moveTo(pad,H-pad); ctx.lineTo(W-padR,H-pad); ctx.stroke();

  const hitRegions = [];
  FOLD_KEYS.forEach((k,i)=>{
    const gx = pad + i*groupW;
    const v = curr[i];
    const label = FOLD_LABELS_SHORT[k];
    if(hasPrev){
      const pv = prevv[i];
      const x1 = gx + groupW*0.12;
      ctx.fillStyle="#c9c2ab";
      ctx.fillRect(x1, yAt(pv), barW, (H-pad)-yAt(pv));
      const x2 = x1 + barW + 4;
      ctx.fillStyle="#0F6E56";
      ctx.fillRect(x2, yAt(v), barW, (H-pad)-yAt(v));
      ctx.fillStyle="#26312f"; ctx.font="10px Arial"; ctx.textAlign="center";
      ctx.fillText(fmt(v,1), x2+barW/2, yAt(v)-4);
      hitRegions.push({ test:(mx,my)=> mx>=x1-2 && mx<=x1+barW+2 && my>=yAt(pv) && my<=H-pad, html:`<strong>${esc(label)}</strong> (anterior)<br>${fmt(pv,1)} mm` });
      hitRegions.push({ test:(mx,my)=> mx>=x2-2 && mx<=x2+barW+2 && my>=yAt(v) && my<=H-pad, html:`<strong>${esc(label)}</strong> (actual)<br>${fmt(v,1)} mm` });
    } else {
      const x1 = gx + groupW/2 - barW/2;
      ctx.fillStyle="#B8956A";
      ctx.fillRect(x1, yAt(v), barW, (H-pad)-yAt(v));
      ctx.fillStyle="#26312f"; ctx.font="10px Arial"; ctx.textAlign="center";
      ctx.fillText(fmt(v,1), x1+barW/2, yAt(v)-4);
      hitRegions.push({ test:(mx,my)=> mx>=x1-2 && mx<=x1+barW+2 && my>=yAt(v) && my<=H-pad, html:`<strong>${esc(label)}</strong><br>${fmt(v,1)} mm` });
    }
    ctx.fillStyle="#6b6b6b"; ctx.font="9px Arial"; ctx.textAlign="center";
    ctx.fillText(FOLD_LABELS_SHORT[k], gx+groupW/2, H-pad+14);
  });

  ctx.textAlign="left"; ctx.font="10px Arial";
  if(hasPrev){
    ctx.fillStyle="#0F6E56"; ctx.fillText("■ Actual", pad, 16);
    ctx.fillStyle="#c9c2ab"; ctx.fillText("■ Anterior", pad+65, 16);
  } else {
    ctx.fillStyle="#B8956A"; ctx.fillText("■ Pliegues (mm)", pad, 16);
  }
  wireChartHover(cv, hitRegions);
}

/* --- Perfil de pliegues cutáneos (canvas, líneas vs. referencia ISAK) --- */
function drawFoldsLineChart(canvasId, valores, prevValores){
  const cv = document.getElementById(canvasId);
  if(!cv) return;
  const { ctx, W, H } = beginHiResCanvas(cv, 2);
  const padL = 30, padR = 14, padT = 34, padB = 34;
  ctx.clearRect(0,0,W,H);

  const curr = FOLD_KEYS.map(k=>valores["pl_"+k]);
  const prevv = prevValores ? FOLD_KEYS.map(k=>prevValores["pl_"+k]) : null;
  const hasPrev = prevv && prevv.every(v=>v!==null && v!==undefined && !isNaN(v));
  const ref = FOLD_KEYS.map(k=>PLIEGUES_OBJETIVO_ISAK[k]);
  const hasCurr = curr.every(v=>v!==null && v!==undefined && !isNaN(v));
  if(!hasCurr){
    ctx.fillStyle="#6b6b6b"; ctx.font="13px Arial"; ctx.textAlign="center";
    ctx.fillText("Sin datos de pliegues para esta valoración.", W/2, H/2);
    wireChartHover(cv, []);
    return;
  }
  const allVals = curr.concat(hasPrev?prevv:[]).concat(ref).concat([0]);
  const ticks = niceTicks(Math.min(...allVals), Math.max(...allVals), 5);
  const minV = ticks[0], maxV = ticks[ticks.length-1];
  const tDec = ticks.some(t=>Math.abs(t-Math.round(t))>1e-9) ? 1 : 0;
  const n = FOLD_KEYS.length;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const xStep = plotW/(n-1);
  const xAt = i => padL + i*xStep;
  const yAt = v => (H-padB) - ((v-minV)/(maxV-minV))*plotH;

  // Gridlines horizontales + etiquetas del eje Y
  ctx.font="9px Arial"; ctx.textAlign="right";
  ticks.forEach(t=>{
    const y = yAt(t);
    ctx.strokeStyle="#ece6d8"; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillStyle="#9a9488"; ctx.fillText(fmt(t,tDec), padL-6, y+3);
  });
  ctx.strokeStyle="#c9c2ab"; ctx.beginPath();
  ctx.moveTo(padL,padT); ctx.lineTo(padL,H-padB); ctx.lineTo(W-padR,H-padB); ctx.stroke();

  // Título del eje Y
  ctx.save(); ctx.translate(9,(padT+H-padB)/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign="center"; ctx.fillStyle="#6b6b6b"; ctx.font="9px Arial"; ctx.fillText("mm",0,0); ctx.restore();

  const plotLine = (series, color, dashed) => {
    ctx.strokeStyle=color; ctx.lineWidth=2;
    ctx.setLineDash(dashed?[4,3]:[]);
    ctx.beginPath();
    series.forEach((v,i)=>{ const x=xAt(i), y=yAt(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.stroke();
    ctx.setLineDash([]);
    if(!dashed){
      series.forEach((v,i)=>{
        const x=xAt(i), y=yAt(v);
        ctx.beginPath(); ctx.arc(x,y,3,0,2*Math.PI); ctx.fillStyle=color; ctx.fill();
        ctx.lineWidth=1.2; ctx.strokeStyle="#faf6ef"; ctx.stroke();
      });
    }
  };

  plotLine(ref, "#a99a72", true);
  if(hasPrev) plotLine(prevv, "#B8956A", false);
  plotLine(curr, "#0F6E56", false);

  ctx.fillStyle="#6b6b6b"; ctx.font="9px Arial"; ctx.textAlign="center";
  FOLD_KEYS.forEach((k,i)=>{ ctx.fillText(FOLD_LABELS_SHORT[k], xAt(i), H-padB+14); });

  drawLegend(ctx, padL, 12, hasPrev
    ? [["Actual","#0F6E56",false],["Anterior","#B8956A",false],["Referencia ISAK","#a99a72",true]]
    : [["Actual","#0F6E56",false],["Referencia ISAK","#a99a72",true]]);

  const hitRegions = [];
  const R_HIT = 12;
  FOLD_KEYS.forEach((k,i)=>{
    const label = FOLD_LABELS_SHORT[k];
    const x = xAt(i);
    hitRegions.push({ test:(mx,my)=>{ const y=yAt(curr[i]); return Math.hypot(mx-x,my-y)<=R_HIT; }, html:`<strong>${esc(label)}</strong> (actual)<br>${fmt(curr[i],1)} mm` });
    if(hasPrev) hitRegions.push({ test:(mx,my)=>{ const y=yAt(prevv[i]); return Math.hypot(mx-x,my-y)<=R_HIT; }, html:`<strong>${esc(label)}</strong> (anterior)<br>${fmt(prevv[i],1)} mm` });
    hitRegions.push({ test:(mx,my)=>{ const y=yAt(ref[i]); return Math.hypot(mx-x,my-y)<=R_HIT; }, html:`<strong>${esc(label)}</strong> (referencia ISAK)<br>${fmt(ref[i],1)} mm` });
  });
  wireChartHover(cv, hitRegions);
}

/* --- Gráfico de tarta: composición corporal (tetracompartimental), para el informe --- */
function drawCompPieChart(canvasId, title, slices){
  // slices: [{label, value, color}] — se asume que suman ~100
  const cv = document.getElementById(canvasId);
  if(!cv) return;
  const { ctx, W, H } = beginHiResCanvas(cv, 2);
  ctx.clearRect(0,0,W,H);

  const padTop = 26;    // alto reservado para el título
  const padSide = 16;   // margen lateral
  const legendRows = 2, legendRowH = 16;
  const padBottom = 14 + legendRows*legendRowH + 6; // alto reservado para la leyenda (2 filas, centrada)

  ctx.fillStyle="#3a352c"; ctx.font="bold 11px Arial"; ctx.textAlign="center";
  ctx.fillText(title, W/2, 17);

  // tarta: centrada en el espacio que queda entre el título y la leyenda
  const plotH = H - padTop - padBottom;
  const cx = W/2, cy = padTop + plotH/2;
  const r = Math.max(10, Math.min((W - padSide*2)/2, plotH/2) - 4);

  const total = slices.reduce((s,x)=>s+(x.value||0),0) || 1;
  let angle = -Math.PI/2;
  slices.forEach(sl=>{
    const frac = (sl.value||0)/total;
    const a2 = angle + frac*2*Math.PI;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,angle,a2); ctx.closePath();
    ctx.fillStyle = sl.color; ctx.fill();
    ctx.lineWidth=1.4; ctx.strokeStyle="#fff"; ctx.stroke();
    // etiqueta con el valor, si la porción es suficientemente grande
    if(frac>0.045){
      const mid = angle + (a2-angle)/2;
      const lx = cx + Math.cos(mid)*r*0.65, ly = cy + Math.sin(mid)*r*0.65;
      ctx.fillStyle="#fff"; ctx.font="bold 10px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(fmt(sl.value,1), lx, ly);
      ctx.textBaseline="alphabetic";
    }
    angle = a2;
  });

  // Leyenda: 2 columnas x 2 filas, cada fila centrada horizontalmente como bloque
  // (así nunca se corta ni se sale del canvas, sea cual sea el ancho de las etiquetas).
  ctx.font="9.5px Arial";
  const swatchW = 9, gapSwatchText = 5, gapItems = 18;
  const itemsWithWidth = slices.map(sl=>({ ...sl, textW: ctx.measureText(sl.label).width }));
  const perRow = 2;
  const legendTop = H - padBottom + 10;
  for(let row=0; row*perRow < itemsWithWidth.length; row++){
    const rowItems = itemsWithWidth.slice(row*perRow, row*perRow+perRow);
    const rowWidth = rowItems.reduce((s,it,i)=> s + swatchW + gapSwatchText + it.textW + (i<rowItems.length-1?gapItems:0), 0);
    let lx = (W - rowWidth)/2;
    const ly = legendTop + row*legendRowH;
    rowItems.forEach(it=>{
      ctx.fillStyle = it.color; ctx.fillRect(lx, ly-7, swatchW, swatchW);
      ctx.fillStyle = "#3a352c"; ctx.textAlign="left"; ctx.textBaseline="middle";
      ctx.fillText(it.label, lx+swatchW+gapSwatchText, ly-2);
      lx += swatchW + gapSwatchText + it.textW + gapItems;
    });
  }
  ctx.textBaseline="alphabetic";
}

function wireInforme(){
  const clientSel = document.getElementById("reportClientSelect");
  const valSel = document.getElementById("reportValSelect");
  if(!clientSel) return;
  function refreshValSelect(){
    const c = getClient(clientSel.value);
    const opts = c.valoraciones.slice().sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))
      .map(v=>`<option value="${v.id}">${fmtDate(v.fecha)}</option>`).join("");
    valSel.innerHTML = opts;
  }
  clientSel.addEventListener("change", ()=>{ CURRENT_CLIENT_ID = clientSel.value; refreshValSelect(); });
  document.getElementById("btnGenerarInforme").addEventListener("click", ()=>{
    const c = getClient(clientSel.value);
    const v = c.valoraciones.find(vv=>vv.id==valSel.value);
    if(!v){ toast("Selecciona una valoración"); return; }
    const html = buildReportHtml(c,v);
    document.getElementById("reportPreviewWrap").innerHTML = html;
    drawReportCharts(c, v);
  });
  document.getElementById("btnImprimir").addEventListener("click", ()=>{
    if(!document.getElementById("reportPreviewWrap").innerHTML.trim()){
      toast("Genera primero la vista previa"); return;
    }
    // El navegador imprime el título de la página en la cabecera: que sea el del informe, no el de la app.
    const c = getClient(clientSel.value), t0 = document.title;
    document.title = "Informe antropometría" + (c ? " - " + (c.nombre||"") + " " + (c.apellidos||"") : "");
    window.addEventListener("afterprint", ()=>{ document.title = t0; }, {once:true});
    window.print();
  });
  document.getElementById("btnCompartirInforme").addEventListener("click", compartirInforme);
  if(INFORME_PRESEL){
    valSel.value = INFORME_PRESEL; INFORME_PRESEL = null;
    document.getElementById("btnGenerarInforme").click();
  }
}

// ── Compartir el informe con el cliente ──
// Genera un PDF real (A4, una imagen por página del informe en pantalla: la vista previa es 1:1 con el PDF), lo sube al bucket
// privado `deportistas-docs` y lo añade a `archivos` del deportista con `visible_cliente: true`, para que lo vea en su área de clientes.
// Compartir otra vez la misma valoración sustituye al PDF anterior. Las librerías se cargan solo al pulsar el botón.
function cargarScript(url){
  return new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src=url; s.onload=ok; s.onerror=()=>ko(new Error("No se pudo cargar "+url)); document.head.appendChild(s); });
}
async function cargarLibsPdf(){
  if(!window.html2canvas) await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  if(!(window.jspdf && window.jspdf.jsPDF)) await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
}
async function informeComoPdf(){
  const paginas = [...document.querySelectorAll("#reportPreviewWrap .rep-page")];
  if(!paginas.length) throw new Error("sin vista previa");
  await cargarLibsPdf();
  const pdf = new window.jspdf.jsPDF({unit:"mm", format:"a4", compress:true});
  for(let i=0;i<paginas.length;i++){
    // windowWidth grande: así no se aplican los estilos de pantalla estrecha y la página sale como en el PDF impreso.
    const cv = await window.html2canvas(paginas[i], {scale:2, backgroundColor:"#ffffff", useCORS:true, logging:false, windowWidth:1200});
    if(i>0) pdf.addPage("a4","portrait");
    pdf.addImage(cv.toDataURL("image/jpeg",0.92), "JPEG", 0, 0, 210, Math.min(297, 210*cv.height/cv.width), undefined, "FAST");
  }
  return pdf.output("blob");
}
async function compartirInforme(){
  const btn = document.getElementById("btnCompartirInforme"), msg = document.getElementById("compInformeMsg");
  const c = getClient(document.getElementById("reportClientSelect").value);
  const v = c && c.valoraciones.find(vv=>vv.id==document.getElementById("reportValSelect").value);
  if(!v){ toast("Selecciona una valoración"); return; }
  if(!document.getElementById("reportPreviewWrap").innerHTML.trim()){ toast("Genera primero la vista previa"); return; }
  const ruta = p=>p.split("/").map(encodeURIComponent).join("/");
  const txt0 = btn.innerHTML; btn.disabled = true;
  try{
    msg.textContent = "Generando el PDF…";
    const blob = await informeComoPdf();
    const path = `${c.id}/${Date.now()}_informe_antropometria_${v.fecha}.pdf`;
    msg.textContent = "Subiendo…";
    const up = await authFetch(`${SURL}/storage/v1/object/deportistas-docs/${ruta(path)}`, {method:"POST", headers:{"Content-Type":"application/pdf"}, body:blob});
    if(!up.ok) throw new Error("subida "+up.status);
    // Se lee la lista de archivos justo antes de escribir (el panel pudo cambiarla) y se sustituye el informe anterior de esta valoración.
    const fila = await sb(`clientes_deportivos?id=eq.${c.id}&select=archivos`);
    const previos = (fila && fila[0] && Array.isArray(fila[0].archivos)) ? fila[0].archivos : [];
    const viejos = previos.filter(a=>a && a.tipo==="informe_antropometria" && a.valoracion_id==v.id);
    const archivos = previos.filter(a=>!viejos.includes(a));
    const ahora = new Date().toISOString();
    archivos.push({nombre:`Informe antropometría ${v.fecha}.pdf`, path, fecha:ahora, visible_cliente:true, tipo:"informe_antropometria", valoracion_id:v.id});
    await sb(`clientes_deportivos?id=eq.${c.id}`, {method:"PATCH", headers:{"Prefer":"return=minimal"}, body:JSON.stringify({archivos, ultima_actividad:ahora})});
    viejos.forEach(a=>{ if(a.path) authFetch(`${SURL}/storage/v1/object/deportistas-docs/${ruta(a.path)}`, {method:"DELETE"}).catch(()=>{}); });
    msg.textContent = `Informe del ${fmtDate(v.fecha)} compartido: ya aparece en los archivos de ${c.nombre} y en su área de clientes.`;
    toast("Informe compartido con el cliente");
  }catch(e){
    console.warn("compartirInforme", e);
    msg.textContent = "No se pudo compartir el informe. Comprueba la conexión y vuelve a intentarlo.";
    toast("No se pudo compartir el informe");
  }finally{ btn.disabled = false; btn.innerHTML = txt0; }
}

// Dibuja los gráficos canvas del informe (pliegues, tartas de composición, PHANTOM, somatocarta)
// una vez que el HTML del informe ya está insertado en el DOM (reportPreviewWrap).
function drawReportCharts(c, v){
  const valores = valoresDesdeValoracion(v, c);
  const edad = edadDecimal(v.fecha, c.fechaNacimiento);
  const R = calcularResultados(valores, c, edad);
  if(!R) return;
  const prev = lastValoracion(c, v.id);
  const prevValores = prev ? valoresDesdeValoracion(prev, c) : null;
  const prevEdad = prev ? edadDecimal(prev.fecha, c.fechaNacimiento) : null;
  const prevR = prevValores ? calcularResultados(prevValores, c, prevEdad) : null;

  drawFoldsLineChart("repFoldsChart", valores, prevValores);

  const PIE_COLORS = { tejidoAdiposo:"#0F6E56", masaMuscular:"#B8956A", masaOsea:"#1D9E75", masaResidual:"#a99a72" };
  const pieSlices = (RR)=>[
    { label:"Tejido adiposo", value:RR.pctTejidoAdiposo, color:PIE_COLORS.tejidoAdiposo },
    { label:"Masa muscular",  value:RR.pctMasaMuscular,  color:PIE_COLORS.masaMuscular },
    { label:"Masa ósea",      value:RR.pctMasaOsea,      color:PIE_COLORS.masaOsea },
    { label:"Masa residual",  value:RR.pctMasaResidual,  color:PIE_COLORS.masaResidual }
  ];
  drawCompPieChart("repPieCurrent", "Composición corporal actual", pieSlices(R));
  if(prevR) drawCompPieChart("repPiePrevious", "Composición corporal previa", pieSlices(prevR));
}

/* ============================================================
   EXPORTAR VALORACIONES A CSV (análisis, no reimportable)
   Una fila por valoración de cada cliente, con las medidas tomadas y los
   resultados calculados más consultados. Semicolon como separador y coma
   decimal (formato Excel español), igual que el resto de la interfaz.
   ============================================================ */
function csvEscape(v){
  if(v===null || v===undefined) return "";
  const s = String(v);
  return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvNum(n, dec){
  if(n===null || n===undefined || isNaN(n)) return "";
  return Number(n).toLocaleString('es-ES',{minimumFractionDigits:dec===undefined?2:dec,maximumFractionDigits:dec===undefined?2:dec});
}
function buildValoracionesCsv(){
  const headerCols = [
    "Cliente","Apellidos","Sexo","Deporte","Posición",
    "Fecha valoración","Edad",
    "Peso (kg)","Talla (cm)","Talla sentado (cm)","Envergadura (cm)",
    ...FOLD_KEYS.map(k=>"PL "+FOLD_LABELS[k]+" (mm)"),
    ...PERIM_KEYS.map(k=>"PR "+PERIM_LABELS[k]+" (cm)"),
    ...DIAM_KEYS.map(k=>"D "+DIAM_LABELS[k]+" (cm)"),
    "Σ6 pliegues (mm)","Σ8 pliegues (mm)",
    "IMC","Clasificación IMC",
    "% Masa grasa ("+"modelo primario)","% Tejido adiposo","% Masa muscular","% Masa ósea","% Masa residual",
    "Ratio cintura/cadera","Riesgo CV","Índice córmico","Clasificación índice córmico",
    "Endomorfia","Mesomorfia","Ectomorfia"
  ];
  const rows = [headerCols.map(csvEscape).join(";")];
  let anyRow = false;

  STATE.clients.slice().sort((a,b)=>(a.nombre+a.apellidos).localeCompare(b.nombre+b.apellidos)).forEach(c=>{
    c.valoraciones.slice().sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).forEach(v=>{
      anyRow = true;
      const valores = valoresDesdeValoracion(v, c);
      const edad = edadDecimal(v.fecha, c.fechaNacimiento);
      const R = calcularResultados(valores, c, edad);
      const row = [
        c.nombre, c.apellidos||"", c.sexo||"", c.deporte||"", c.posicion||"",
        fmtDate(v.fecha), csvNum(edad,2),
        csvNum(valores.peso,1), csvNum(valores.talla,1), csvNum(valores.tallaSentado,1), csvNum(valores.envergadura,1),
        ...FOLD_KEYS.map(k=>csvNum(valores["pl_"+k],1)),
        ...PERIM_KEYS.map(k=>csvNum(valores["pr_"+k],1)),
        ...DIAM_KEYS.map(k=>csvNum(valores["d_"+k],2)),
        csvNum(R&&R.sum6,1), csvNum(R&&R.sum8,1),
        csvNum(R&&R.imc,1), (R&&R.imcClasif)||"",
        csvNum(R&&R.pctGrasaPrimaria,1), csvNum(R&&R.pctTejidoAdiposo,1), csvNum(R&&R.pctMasaMuscular,1), csvNum(R&&R.pctMasaOsea,1), csvNum(R&&R.pctMasaResidual,1),
        csvNum(R&&R.whr,2), (R&&R.whrRisk)||"", csvNum(R&&R.indiceCormico,2), (R&&R.indiceCormicoClasif)||"",
        csvNum(R&&R.endomorfia,1), csvNum(R&&R.mesomorfia,1), csvNum(R&&R.ectomorfia,1)
      ];
      rows.push(row.map(csvEscape).join(";"));
    });
  });
  return anyRow ? rows.join("\r\n") : null;
}

/* ============================================================
   VISTA: AJUSTES (ETM + copia de seguridad)

function viewAjustes(){
  const etm = STATE.settings.etm || {};
  const rows = ALL_COMPARE_KEYS.map(k=>`
    <tr><td>${ALL_COMPARE_LABELS[k]}</td>
    <td><input type="number" step="0.01" data-etm="${k}" value="${etm[k]!==undefined?etm[k]:""}" style="max-width:100px;"></td></tr>
  `).join("");
  return `
  <h2>Ajustes</h2>
  <p class="lead">Estos valores se guardan en este navegador y se aplican a todas las comparaciones.</p>

  <div class="card">
    <h3 style="margin-top:0;">Referencias</h3>
    <p class="small-note" style="margin-top:0;">Explicaciones y criterios que usamos para interpretar los resultados. Esta sección se irá ampliando con más contenido.</p>

    <div class="section-title" style="margin-top:0;">Puntuaciones Z (vs. población de referencia)</div>
    <p style="font-size:13px;line-height:1.5;">
      Un Z-score indica a cuántas desviaciones estándar está el valor del cliente respecto a la media de la
      población de referencia. Un Z de 0 significa "exactamente en la media"; el signo indica la dirección
      (positivo = por encima, negativo = por debajo) y la magnitud, cuánto se aleja.
    </p>
    <table class="tbl-ref" style="margin-top:8px;">
      <thead><tr><th>Rango de |Z|</th><th>Interpretación</th><th>% aprox. de la población en ese rango</th></tr></thead>
      <tbody>
        <tr><td>&lt; 1</td><td>Dentro de lo esperado</td><td>~68%</td></tr>
        <tr><td>1 – 2</td><td>Moderadamente por encima / por debajo</td><td>~27% (acumulado hasta ~95%)</td></tr>
        <tr><td>≥ 2</td><td>Marcadamente por encima / por debajo — valor atípico</td><td>&lt;5%</td></tr>
      </tbody>
    </table>
    <p class="small-note" style="margin-top:10px;">
      <strong>Cómo leer Peso graso y Peso muscular juntos:</strong> un Z de Peso graso muy negativo junto con un
      Z de Peso muscular normal o positivo suele indicar un perfil magro y musculado (patrón deseable en
      rendimiento). El mismo Z de Peso graso muy negativo junto con un Z de Peso muscular también bajo puede
      apuntar a una restricción calórica excesiva o falta de reservas, y merece revisarse.
    </p>

    <div class="section-title" style="margin-top:22px;">Referencias antropométricas para futbolistas masculinos</div>
    <p class="small-note" style="margin-top:0;">
      Protocolo recomendado: Σ8 pliegues ISAK como variable principal; Durnin &amp; Womersley (1974) como
      estimación complementaria del % de grasa.
    </p>

    <p style="font-size:13px;font-weight:700;margin:14px 0 4px 0;">1. Σ8 pliegues — futbolistas de élite por posición (Serie A italiana)</p>
    <p class="small-note" style="margin-top:0;">Σ8 = bíceps + tríceps + subescapular + suprailiaco + supraespinal + abdominal + muslo frontal + pantorrilla.</p>
    <table style="margin-top:6px;">
      <thead><tr><th>Posición</th><th>P15 (mm)</th><th>P50 (mm)</th><th>P85 (mm)</th></tr></thead>
      <tbody>
        <tr><td>Porteros</td><td>39,9</td><td>59,0</td><td>69,9</td></tr>
        <tr><td>Defensas</td><td>41,8</td><td>49,0</td><td>57,7</td></tr>
        <tr><td>Centrocampistas</td><td>44,7</td><td>54,6</td><td>62,8</td></tr>
        <tr><td>Delanteros</td><td>43,2</td><td>51,0</td><td>66,8</td></tr>
      </tbody>
    </table>
    <p class="small-note" style="margin-top:8px;">
      Los percentiles son descriptivos de una población de futbolistas de Serie A italiana. P15 no representa un
      mínimo saludable y P85 no representa un máximo saludable. No deben interpretarse como categorías de
      rendimiento ni como rangos clínicos.
    </p>

    <p style="font-size:13px;font-weight:700;margin:16px 0 4px 0;">2. Σ8 — referencia descriptiva de futbolistas de élite españoles</p>
    <table class="tbl-pct" style="margin-top:6px;">
      <thead><tr><th>Percentil</th><th>P5</th><th>P10</th><th>P20</th><th>P30</th><th>P40</th></tr></thead>
      <tbody>
        <tr><td>Σ8 (mm)</td><td>40,7</td><td>44,1</td><td>47,7</td><td>49,2</td><td>51,6</td></tr>
      </tbody>
      <thead><tr><th>Percentil</th><th>P50</th><th>P60</th><th>P70</th><th>P80</th><th>P90</th></tr></thead>
      <tbody>
        <tr><td>Σ8 (mm)</td><td>56,2</td><td>58,0</td><td>60,1</td><td>64,9</td><td>80,3</td></tr>
      </tbody>
    </table>
    <p class="small-note" style="margin-top:8px;">
      Esta tabla procede de una población española de fútbol de élite y debe utilizarse como referencia
      contextual; las poblaciones y protocolos no son idénticos a los del estudio italiano.
    </p>

    <p style="font-size:13px;font-weight:700;margin:16px 0 4px 0;">3. Σ6 — referencia en futbolistas profesionales</p>
    <p class="small-note" style="margin-top:0;">Σ6 utilizado en el metaanálisis: tríceps + subescapular + supraespinal + abdominal + muslo anterior + pantorrilla.</p>
    <table class="tbl-ref" style="margin-top:6px;">
      <thead><tr><th>Variable</th><th>Media (mm)</th><th>Uso recomendado</th></tr></thead>
      <tbody>
        <tr><td>Σ6</td><td>52,18</td><td>Referencia descriptiva; no equivale a un valor óptimo</td></tr>
        <tr><td>Σ8</td><td>59,93</td><td>Referencia descriptiva; no equivale a un valor óptimo</td></tr>
      </tbody>
    </table>

    <p style="font-size:13px;font-weight:700;margin:16px 0 4px 0;">4. Durnin &amp; Womersley (1974) — complemento</p>
    <p class="small-note" style="margin-top:0;">
      Pliegues: bíceps + tríceps + subescapular + suprailiaco (Σ4). Estima densidad corporal y, a partir de
      ella, % de grasa mediante una ecuación predictiva. Durnin &amp; Womersley no establecieron un rango óptimo
      de % de grasa específico para futbolistas: el resultado debe presentarse como un
      <em>% de grasa estimado mediante Durnin &amp; Womersley (1974)</em>, no como un estándar deportivo.
    </p>

    <p style="font-size:13px;font-weight:700;margin:16px 0 4px 0;">5. Cómo utilizar estas referencias en una academia</p>
    <table class="tbl-ref" style="margin-top:6px;">
      <thead><tr><th>Variable</th><th>Prioridad</th><th>Aplicación</th></tr></thead>
      <tbody>
        <tr><td>Σ8 ISAK (mm)</td><td>Principal</td><td>Seguimiento de adiposidad subcutánea y comparación con referencias de futbolistas.</td></tr>
        <tr><td>Σ6 ISAK (mm)</td><td>Secundaria</td><td>Seguimiento práctico cuando se utiliza un protocolo de seis pliegues.</td></tr>
        <tr><td>% grasa Durnin &amp; Womersley</td><td>Complementaria</td><td>Estimación de % grasa; siempre identificar la ecuación utilizada.</td></tr>
        <tr><td>Cambio individual</td><td>Muy importante</td><td>Comparar al jugador consigo mismo a lo largo de la temporada.</td></tr>
      </tbody>
    </table>

    <p class="small-note" style="margin-top:12px;">
      <strong>Fuentes:</strong> Petri et al. (2024). ISAK-Based Anthropometric Standards for Elite Male and Female
      Soccer Players. Applied Sciences. · Mujika et al. / metaanálisis de composición corporal en futbolistas
      profesionales (Σ6 y Σ8). · Durnin &amp; Womersley (1974). Body fat assessed from total body density and its
      estimation from skinfold thickness: measurements on 481 men and women aged from 16 to 72 years.
    </p>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Datos del profesional (aparecen en el informe)</h3>
    <div class="grid cols2">
      <div class="field"><label>Nombre del valorador/a</label><input id="s_valorador" value="${esc(STATE.settings.valorador||"")}"></div>
      <div class="field"><label>Email de contacto</label><input id="s_email" value="${esc(STATE.settings.email||"")}"></div>
    </div>
    <button class="btn camel sm" id="btnSaveSettings"><span class="ic">${ic("save")}</span> Guardar</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Error Técnico de Medida (ETM) por variable</h3>
    <p class="small-note">El ETM es tu propio margen de error como medidor/a (se obtiene repitiendo medidas). Si lo rellenas, los informes mostrarán el intervalo de confianza de cada cambio. Es opcional: si lo dejas en blanco, solo se mostrará la diferencia.</p>
    <table><thead><tr><th>Variable</th><th>ETM</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="btnbar"><button class="btn camel sm" id="btnSaveEtm"><span class="ic">${ic("save")}</span> Guardar ETM</button></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Copia de seguridad</h3>
    <p class="small-note">Todos los datos viven solo en este navegador. Exporta una copia periódicamente para no perder nada (cambio de ordenador, borrado de caché, etc.).</p>
    <div class="footer-import-export">
      <button class="btn ghost" id="btnExport"><span class="ic">⬇️</span> Exportar copia de seguridad (.json)</button>
      <label class="btn ghost" style="cursor:pointer;"><span class="ic">${ic("upload")}</span> Importar copia
        <input type="file" id="btnImport" accept=".json" style="display:none;">
      </label>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Exportar datos para análisis (CSV)</h3>
    <p class="small-note">Una fila por valoración, con todos los clientes juntos: medidas, sumatorios, % de composición corporal, somatotipo, etc. Para abrir en Excel/Sheets y analizar varios clientes a la vez (no sustituye a la copia de seguridad — este CSV no se puede reimportar).</p>
    <button class="btn ghost" id="btnExportCsv"><span class="ic">${ic("chart")}</span> Exportar valoraciones (.csv)</button>
  </div>
  `;
}

function wireAjustes(){
  const btnSaveS = document.getElementById("btnSaveSettings");
  if(btnSaveS) btnSaveS.addEventListener("click", ()=>{
    STATE.settings.valorador = document.getElementById("s_valorador").value.trim();
    STATE.settings.email = document.getElementById("s_email").value.trim();
    saveSettingsLocal(); toast("Datos guardados (solo en este dispositivo)");
  });
  const btnSaveE = document.getElementById("btnSaveEtm");
  if(btnSaveE) btnSaveE.addEventListener("click", ()=>{
    document.querySelectorAll("[data-etm]").forEach(inp=>{
      const val = inp.value.trim();
      if(val==="") delete STATE.settings.etm[inp.dataset.etm];
      else STATE.settings.etm[inp.dataset.etm] = parseFloat(val);
    });
    saveSettingsLocal(); toast("ETM guardados (solo en este dispositivo)");
  });
  const btnExport = document.getElementById("btnExport");
  if(btnExport) btnExport.addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify(STATE,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "antropometria_copia_seguridad_"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("Copia de seguridad descargada");
  });
  const btnExportCsv = document.getElementById("btnExportCsv");
  if(btnExportCsv) btnExportCsv.addEventListener("click", ()=>{
    const csv = buildValoracionesCsv();
    if(!csv){ toast("No hay valoraciones que exportar todavía"); return; }
    // BOM UTF-8 para que Excel detecte bien la codificación (tildes, Σ, etc.)
    const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "antropometria_valoraciones_"+new Date().toISOString().slice(0,10)+".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("CSV descargado");
  });
  const btnImport = document.getElementById("btnImport");
  if(btnImport) btnImport.addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!data.clients) throw new Error("Formato no válido");
        openModal(`
          <h3>Copia de seguridad antigua</h3>
          <p style="font-size:13.5px;color:var(--ink);line-height:1.5;">
            Este archivo es del formato antiguo (local, sin Supabase). Ahora los datos viven en la
            base de datos compartida con el Panel Profesional, así que ya no se pueden restaurar
            automáticamente con este botón — hacerlo solo lo cargaría en memoria y se perdería
            al recargar la página. Si necesitas recuperar estos ${data.clients.length} cliente(s),
            introdúcelos a mano (o pide ayuda para migrarlos directamente en Supabase).
          </p>
          <div class="btnbar"><button class="btn ghost" id="btnCerrarImportAntiguo">Entendido</button></div>
        `);
        document.getElementById("btnCerrarImportAntiguo").addEventListener("click", closeModal);
      }catch(err){
        toast("Archivo no válido");
      }
    };
    reader.readAsText(file);
  });
}

/* ============================================================
   DISPATCHER DE EVENTOS POR VISTA
   ============================================================ */
function wireView(v){
  // Enlace "← Volver a <cliente>" de las pantallas que cuelgan de un cliente
  document.querySelectorAll("[data-back]").forEach(b=>b.addEventListener("click", ()=>goView("clientes")));
  if(v==="clientes") wireClientes();
  else if(v==="valoracion") wireValoracion();
  else if(v==="resultados") wireResultados();
  else if(v==="informe") wireInforme();
  else if(v==="ajustes") wireAjustes();
}

/* Modo claro/oscuro — misma clave de localStorage que Panel Profesional,
   así la preferencia se comparte entre ambas apps. */
(function(){
  function label(){ var l=document.getElementById("darkModeLabel"); if(l) l.textContent = document.body.classList.contains("dark-mode") ? "Modo claro" : "Modo oscuro"; }
  try{ if(localStorage.getItem("nutrilogos_dark")==="1") document.body.classList.add("dark-mode"); }catch(e){}
  label();
  var b=document.getElementById("darkModeBtn");
  if(b) b.addEventListener("click", function(){
    var d=document.body.classList.toggle("dark-mode");
    try{ localStorage.setItem("nutrilogos_dark", d?"1":"0"); }catch(e){}
    label();
  });
})();
