<title>Antropometría &amp; Somatocarta — NutriLogos</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>
<meta name="theme-color" content="#04342C">
<style>
/* ============================================================
   Estilo unificado con Panel Profesional (misma paleta, tipografía,
   radios, botones y modo claro/oscuro). Solo apariencia: la lógica
   de la calculadora no depende de nada de esto.
   ============================================================ */
:root{
  --t900:#04342C;--t800:#085041;--t600:#0F6E56;--t400:#1D9E75;--t100:#9FE1CB;--t50:#E1F5EE;
  --gold:#B8956A;--gold-dk:#7A5A38;--gold-50:#F5EDE0;--beige:#EDE8DE;
  --g900:#1a1a18;--g700:#444441;--g500:#5F5E5A;--g400:#6A6963;--g200:#D3D1C7;--g100:#F1EFE8;
  --bg:#FAFAF8;--sf:#fff;--bd:rgba(0,0,0,.09);--bdm:rgba(0,0,0,.15);
  --red:#B83232;--red-bg:#FEF2F2;
  --f:'Inter',system-ui,sans-serif;
  --shadow:0 2px 10px rgba(0,0,0,.04);
}
/* Modo oscuro: mismos valores que el panel */
body.dark-mode{
  --bg:#14181a;--sf:#1f2426;--g900:#f0f0ec;--g700:#cfcec8;--g500:#9c9b95;--g400:#8F8E88;
  --g200:#3a3d3a;--g100:#262a28;--bd:rgba(255,255,255,.08);--bdm:rgba(255,255,255,.16);
  --t50:#193530;--gold-50:#2e2718;--red-bg:#3a1f1f;--red:#F28583;--gold-dk:#D9B88C;--t600:#4FC3A1;--t800:#8FD9BE;
}
/* Alias con los nombres antiguos (los usa el JS en estilos inline). Se declaran
   también en .rep-page para que el informe conserve siempre su aspecto claro. */
body,.rep-page{
  --petroleo:var(--g900);--petroleo-d:var(--g900);--petroleo-l:var(--t600);
  --camel:var(--gold);--camel-l:var(--gold);--crema:var(--bg);--crema-d:var(--g100);
  --ink:var(--g900);--muted:var(--g500);--ok:var(--t400);--warn:var(--red);--line:var(--bd);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--f);
  background:var(--bg);
  color:var(--g900);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.app{display:flex;min-height:100vh;}
.sidebar{
  width:248px;flex:0 0 248px;background:var(--t900);color:#fff;
  padding:1.5rem 0;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:0;height:100vh;align-self:flex-start;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:16px;padding:0 1.25rem 1.25rem;margin-bottom:.5rem;border-bottom:.5px solid rgba(255,255,255,.08);}
.brand img{width:52px;height:52px;border-radius:22%;flex:0 0 52px;object-fit:cover;box-shadow:0 2px 10px rgba(0,0,0,.25);}
.brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.2;color:#fff;}
.brand .sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:2px;line-height:1.2;}
.navbtn{
  background:transparent;border:none;color:rgba(255,255,255,.62);text-align:left;font-family:var(--f);
  padding:10px 12px;margin:0 .75rem;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:500;
  display:flex;align-items:center;gap:11px;transition:background .15s,color .15s;position:relative;
}
.navbtn svg{flex-shrink:0;opacity:.9;}
.navbtn .ic{font-size:15px;width:18px;text-align:center;flex:0 0 18px;}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff;}
.navbtn.active{background:rgba(255,255,255,.1);color:#fff;}
.navbtn.active::before{content:'';position:absolute;left:-.75rem;top:8px;bottom:8px;width:3px;background:var(--gold);border-radius:0 3px 3px 0;}
.navsep{height:0;border-top:.5px solid rgba(255,255,255,.08);margin:10px 1.25rem;}
.sidebar .foot{margin-top:auto;padding:.75rem .75rem 0;border-top:.5px solid rgba(255,255,255,.08);font-size:10.5px;color:rgba(255,255,255,.4);line-height:1.55;}
.sb-toggle{
  width:100%;display:flex;align-items:center;gap:11px;background:transparent;border:none;border-radius:10px;
  color:rgba(217,184,140,.85);font-size:13.5px;font-weight:500;padding:10px 12px;cursor:pointer;font-family:var(--f);
  text-align:left;transition:background .15s,color .15s;
}
.sb-toggle:hover{background:rgba(184,149,106,.14);color:var(--gold);}
.sb-toggle svg{flex-shrink:0;opacity:.9;}
.main{flex:1;min-width:0;padding:2rem;overflow-x:auto;}
.view{display:none;}
.view.active{display:block;}
h2{margin:0 0 3px 0;font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--g900);}
h3{font-size:15px;font-weight:600;color:var(--g900);margin:22px 0 10px 0;border-bottom:.5px solid var(--bd);padding-bottom:6px;}
p.lead{color:var(--g400);margin:0 0 18px 0;font-size:13px;}
.card{background:var(--sf);border:.5px solid var(--bd);border-radius:16px;padding:1.25rem 1.4rem;box-shadow:var(--shadow);margin-bottom:16px;}
.grid{display:grid;gap:14px;}
.grid.cols2{grid-template-columns:1fr 1fr;}
.grid.cols3{grid-template-columns:1fr 1fr 1fr;}
.grid.cols4{grid-template-columns:repeat(4,1fr);}
label{display:block;font-size:11px;color:var(--g400);margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{
  width:100%;padding:10px 13px;border:.5px solid var(--bdm);border-radius:10px;font-size:14px;
  background:var(--bg);color:var(--g900);font-family:var(--f);outline:none;transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--t400);}
input.field-warn{border-color:var(--red);background:var(--red-bg);}
input.field-warn:focus{border-color:var(--red);}
.field{margin-bottom:10px;}
.btn{
  background:var(--btn);color:#fff;border:none;padding:10px 18px;border-radius:10px;min-height:40px;
  cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;
  font-family:var(--f);transition:opacity .15s,background .15s,color .15s;
  line-height:1.2;white-space:nowrap;
}
.btn:hover{opacity:.88;}
.btn .ic,.tolbadge .ic,.empty .ic{font-size:14px;line-height:1;display:inline-flex;align-items:center;vertical-align:-2px;}
.btn .ic svg,.measure-block-head .mi svg{display:block;}
.btn.camel{background:var(--btn);color:#fff;}
.btn.ghost{background:var(--g100);color:var(--g700);font-weight:500;}
.btn.ghost:hover{opacity:1;background:var(--g200);}
.btn.danger{background:var(--red-bg);color:var(--red);font-weight:500;}
.btn.danger:hover{opacity:.85;}
.btn.sm{padding:7px 14px;font-size:12px;}
.btn.icon-only{padding:8px 10px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
input[type=file]{width:100%;font-family:var(--f);font-size:13px;color:var(--g500);}
input[type=file]::file-selector-button{margin-right:12px;padding:9px 16px;min-height:40px;border:none;border-radius:10px;background:var(--g100);color:var(--g700);font-family:var(--f);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s}
input[type=file]::file-selector-button:hover{background:var(--g200)}
.btnbar{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px 9px;text-align:left;border-bottom:.5px solid var(--bd);}
th{color:var(--g400);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;}
tr:hover td{background:var(--bg);}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.pill.ok{background:var(--t50);color:var(--t600);}
.pill.warn{background:var(--red-bg);color:var(--red);}
.pill.neutral{background:var(--g100);color:var(--g400);}
.clientrow{cursor:pointer;}
.clientrow .chev{display:inline-block;width:16px;color:var(--g400);font-size:11px;}
.clientrow .cl-av{display:none;}
button,a,[role=button],select,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.clientrow.open td{background:var(--t50);border-bottom-color:transparent;}
.detailrow:hover td{background:transparent;}
.detailrow>td{padding:0 0 10px;border-bottom:.5px solid var(--bd);}
.client-detail{margin:0;padding:16px 18px;background:var(--bg);border:.5px solid var(--bd);border-radius:12px;}
.client-detail table{background:var(--sf);border-radius:10px;}
.client-head{display:flex;justify-content:space-between;align-items:flex-start;gap:22px;flex-wrap:wrap;margin-bottom:6px;}
.client-head-info{flex:1;min-width:220px;}
.client-head-name{margin:0 0 8px 0 !important;border:none !important;padding:0 !important;}
.client-head-info .small-note{margin-top:4px;line-height:1.6;}
.empty{color:var(--g400);font-style:italic;padding:20px 0;text-align:center;}
.measure-block{margin-bottom:18px;}
.measure-block-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.measure-block-head .mi{width:30px;height:30px;border-radius:9px;background:var(--t50);color:var(--t600);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 30px;}
.measure-block-head h3{margin:0;border:none;padding:0;font-size:14px;}
.unit-tag{display:inline-block;font-size:10px;font-weight:600;line-height:1.5;padding:2px 9px;border-radius:20px;vertical-align:middle;white-space:nowrap}
.measure-block-head .unit-tag{font-size:10px;font-weight:600;color:var(--t600);background:var(--t50);padding:2px 9px;border-radius:20px;margin-left:2px;}
.measure-rows{border:.5px solid var(--bd);border-radius:12px;overflow:hidden;}
.measure-row{
  display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--sf);
  border-bottom:.5px solid var(--bd);
}
.measure-row:last-child{border-bottom:none;}
.measure-row:nth-child(even){background:var(--bg);}
.measure-row .mr-label{flex:0 0 148px;font-size:12.5px;font-weight:600;color:var(--g900);}
.measure-row .mr-inputs{display:flex;gap:6px;flex:1;}
.measure-row .mr-inputs input{padding:7px 8px;font-size:12.5px;text-align:center;}
.measure-row .mr-inputs input::placeholder{font-size:11px;color:var(--g400);}
.tolbadge{
  font-size:10px;padding:4px 10px;border-radius:20px;white-space:nowrap;flex:0 0 auto;
  font-weight:600;display:inline-flex;align-items:center;gap:4px;min-width:92px;justify-content:center;
}
.tolbadge.ok{background:var(--t50);color:var(--t600);}
.tolbadge.bad{background:var(--red-bg);color:var(--red);}
.tolbadge.pending{background:var(--g100);color:var(--g400);}
.tolbadge.single{background:var(--gold-50);color:var(--gold-dk);}
.basic-rows{border:.5px solid var(--bd);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:repeat(4,1fr);}
.basic-cell{padding:12px 14px;background:var(--sf);border-right:.5px solid var(--bd);}
.basic-cell:last-child{border-right:none;}
.basic-cell label{margin-bottom:6px;}
.section-title{font-weight:600;color:var(--g900);font-size:13.5px;margin:16px 0 8px;}
.compare-box{background:var(--gold-50);border:.5px dashed var(--gold);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;color:var(--gold-dk);}
.kpi{background:var(--bg);border:.5px solid var(--bd);border-radius:12px;padding:12px 14px;text-align:center;}
.kpi .val{font-size:22px;font-weight:700;letter-spacing:-.03em;color:var(--g900);}
.kpi .lbl{font-size:11px;color:var(--g400);text-transform:uppercase;letter-spacing:.06em;}
.chart-tooltip{position:fixed;display:none;background:var(--t900);color:#fff;font-size:11.5px;padding:6px 10px;border-radius:8px;pointer-events:none;z-index:1000;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap;line-height:1.4;}
.diffpos{color:var(--red);font-weight:700;}
.diffneg{color:var(--t400);font-weight:700;}
.diffzero{color:var(--g400);}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:7px 14px;border-radius:20px;background:var(--g100);color:var(--g700);font-size:12.5px;font-weight:500;cursor:pointer;border:1px solid transparent;}
.tab.active{background:var(--btn);color:#fff;}
.subtabs{display:none;}
.subtabs.active{display:block;}
select#clientSelect, select#reportClientSelect{max-width:340px;}
.searchbar{display:flex;gap:8px;margin-bottom:14px;}
.searchbar input{flex:1;}
.small-note{font-size:11.5px;color:var(--g400);margin-top:4px;}
.badge-count{background:var(--t50);color:var(--t600);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:4px;}
canvas{max-width:100%;display:block;margin:0 auto;}
canvas.chart-wide{width:100%;height:auto;}
canvas.chart-square{width:100%;max-width:400px;height:auto;}
/* Los gráficos se dibujan con colores pensados para fondo claro: en modo oscuro
   se apoyan en una base clara para que se lean igual de bien. */
body.dark-mode canvas{background:#fff;border-radius:10px;}
.toast{
  position:fixed;bottom:20px;right:20px;background:var(--t900);color:#fff;padding:12px 18px;
  border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13px;opacity:0;transform:translateY(10px);
  transition:.25s;pointer-events:none;z-index:999;
}
.toast.show{opacity:1;transform:translateY(0);}
.report-actions{display:flex;gap:10px;margin-bottom:18px;}
/* Tamaño de página real para impresión/PDF: sin esto el navegador añade sus propios
   márgenes por defecto encima del padding de .rep-page, y el resultado impreso no
   coincide con lo que se ve en la vista previa. */
@page{size:A4;margin:0;}
@media print{
  .sidebar,.no-print{display:none !important;}
  html,body{margin:0 !important;padding:0 !important;background:#fff !important;}
  .main,html.embed .main{padding:0 !important;}
  .app{display:block !important;min-height:0 !important;}
  body *{visibility:hidden;}
  #reportPreviewWrap, #reportPreviewWrap *{visibility:visible;}
  #reportPreviewWrap{position:absolute;left:0;top:0;width:100%;}
  .rep-page{box-shadow:none !important;margin:0 !important;border-radius:0 !important;
    width:210mm !important;max-width:none !important;min-height:296mm !important;height:296mm !important;
    padding:14mm 14mm 10mm !important;overflow:hidden !important;box-sizing:border-box !important;}
  .rep-foot{left:14mm !important;right:14mm !important;}
  .rep-page-break{page-break-before:always;break-before:page;}
  .rep-sec{page-break-inside:avoid;break-inside:avoid;margin-bottom:10px;}
  .rep-table{page-break-inside:avoid;break-inside:avoid;}
  .rep-table td,.rep-table th{padding:3px 6px;}
  #repPieCurrent,#repPiePrevious{max-width:230px;width:100%;margin:0 auto;display:block;}
}
/* Informe: SIEMPRE claro (también con modo oscuro activo) porque es lo que se imprime.
   Misma medida en pantalla y en impresión (210x297mm, padding 14mm) para que la vista
   previa sea 1:1 el PDF final — width fijo (no max-width) más min-height de página
   completa, así se ve exactamente dónde corta cada hoja antes de imprimir. */
.rep-page{
  --bg:#FAFAF8;--sf:#fff;--g900:#1a1a18;--g700:#444441;--g500:#5F5E5A;--g400:#6A6963;--g200:#D3D1C7;--g100:#F1EFE8;
  --bd:rgba(0,0,0,.09);--bdm:rgba(0,0,0,.15);--t50:#E1F5EE;--gold-50:#F5EDE0;--red-bg:#FEF2F2;
  background:#fff;color:var(--g900);font-family:var(--f);font-size:14px;line-height:1.45;
  padding:14mm 14mm 10mm;width:210mm;min-height:297mm;margin:0 auto 20px auto;box-shadow:var(--shadow);border-radius:6px;
  position:relative;
}
.rep-page th,.rep-page td{color:var(--g900);}
.rep-page tr:hover td{background:transparent;}
.rep-table-kv td{font-size:11.5px;}
.rep-table-kv td:nth-child(odd){color:var(--g500);white-space:nowrap;}
.rep-table-kv td:nth-child(even){font-weight:700;color:var(--g900);}
.rep-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--t900);padding-bottom:10px;margin-bottom:14px;}
.rep-header .rep-title{display:flex;align-items:center;gap:11px;}
.rep-header .rep-title img{width:38px;height:38px;border-radius:22%;flex:0 0 38px;}
.rep-header h1{font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--t900);margin:0;}
.rep-header .meta{text-align:right;font-size:11.5px;color:var(--g500);}
.rep-header-cont{padding-bottom:7px;margin-bottom:12px;}
.rep-header-cont .rep-title img{width:22px;height:22px;flex:0 0 22px;}
.rep-header-cont .meta{font-size:10.5px;}
.rep-sec{margin-bottom:16px;}
.rep-sec h4{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--t900);display:inline-block;padding:3px 10px;border-radius:5px;margin:0 0 8px 0;}
.rep-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.rep-kpi{border:.5px solid var(--bdm);border-radius:8px;padding:8px;text-align:center;}
.rep-kpi .v{font-size:16px;font-weight:700;color:var(--t900);}
.rep-kpi .l{font-size:9.5px;color:var(--g500);text-transform:uppercase;}
.rep-table{width:100%;border-collapse:collapse;font-size:11px;}
.rep-table th,.rep-table td{border:.5px solid var(--bdm);padding:4px 6px;}
.rep-table th{background:var(--g100);color:var(--g500);}
/* El pie va fijo al borde inferior de la hoja A4, en la zona del padding inferior (10 mm), no a
   continuación del contenido: así no queda a mitad de hoja ni salta a una página nueva. */
.rep-foot{position:absolute;left:14mm;right:14mm;bottom:3mm;margin:0;padding-top:4px;font-size:9.5px;line-height:1.3;color:var(--g500);text-align:center;border-top:.5px solid var(--bdm);}
.footer-import-export{display:flex;gap:8px;}
.modal-bg{position:fixed;top:var(--vvt,0px);bottom:var(--vvb,0px);left:0;right:0;background:rgba(4,52,44,.5);display:none;align-items:center;justify-content:center;z-index:900;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);}
.modal-bg.show{display:flex;}
.modal{background:var(--sf);color:var(--g900);border-radius:20px;padding:1.75rem;max-width:420px;width:90%;max-height:min(88vh,calc(100dvh - var(--vvt,0px) - var(--vvb,0px) - 1.5rem - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal.wide{max-width:640px;}
.modal.ficha{max-width:640px;padding:0;display:flex;flex-direction:column;overflow:hidden;}
.fi-scroll{overflow-y:auto;overscroll-behavior:contain;padding:1.5rem 1.75rem .5rem;flex:1 1 auto;min-height:0;}
.fi-head{display:flex;align-items:center;gap:14px;margin-bottom:1.1rem;}
.fi-av{flex:none;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--t600),var(--btn));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;letter-spacing:.02em;box-shadow:0 4px 14px rgba(15,110,86,.28);}
.fi-av svg{width:24px;height:24px;}
.fi-head h3{margin:0;font-size:19px;letter-spacing:-.02em;border:none;padding:0;}
.fi-head p{margin:2px 0 0;font-size:12.5px;color:var(--g400);line-height:1.4;}
.fi-sec{background:var(--bg);border:.5px solid var(--bd);border-radius:16px;padding:1rem 1.1rem .4rem;margin-bottom:12px;}
.fi-sec-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--t600);margin:0 0 .8rem;}
.fi-sec-h svg{width:15px;height:15px;}
.fi-sec .field label{display:block;font-size:12px;font-weight:600;color:var(--g700);margin-bottom:5px;text-transform:none;letter-spacing:0;}
.fi-sec .field label .opt{font-weight:400;color:var(--g400);}
.fi-sec input:not([type=hidden]),.fi-sec select,.fi-sec textarea{

   RESPONSIVE (móvil / pantallas estrechas)

   ============================================================ */
@media screen and (max-width:900px){

  .sidebar{
    position:sticky;top:0;z-index:100;height:auto;width:100%;flex:0 0 auto;
    flex-direction:row;flex-wrap:nowrap;align-items:center;

    scrollbar-width:none;

  .brand{width:auto;flex:0 0 auto;margin:0 6px 0 0;padding:0 10px 0 0;border-bottom:none;border-right:.5px solid rgba(255,255,255,.12);gap:9px;}

  .brand h1{font-size:14px;}
  .brand .sub{display:none;}
  .navsep{display:none;}
  .sidebar .foot{width:auto;flex:0 0 auto;margin:0;padding:0;border-top:none;}
  .navbtn{flex:0 0 auto;margin:0;padding:8px 11px;font-size:12.5px;white-space:nowrap;}
  .navbtn.active::before{display:none;}
  .sb-toggle{width:auto;padding:8px 11px;font-size:12.5px;}
  .sb-toggle span{display:none;}
  .main{padding:16px 14px;}

  h2{font-size:18px;}
  .card{padding:14px 14px;}

  .grid.cols2,.grid.cols3,.grid.cols4{grid-template-columns:1fr;}
  .basic-rows{grid-template-columns:1fr;}
  .basic-cell{border-right:none;border-bottom:.5px solid var(--bd);}
  .basic-cell:last-child{border-bottom:none;}

  .measure-row{flex-wrap:wrap;gap:6px 10px;}
  .measure-row .mr-label{flex:0 0 100%;}
  .measure-row .mr-inputs{flex:1 1 auto;min-width:0;}
  .measure-row .tolbadge{flex:0 0 auto;margin-left:auto;}

  .searchbar{flex-wrap:wrap;}
  .searchbar input{flex:1 1 100%;}
  .searchbar .btn{flex:1 1 auto;}

  .btnbar{flex-direction:column;align-items:stretch;}
  .btnbar .btn{width:100%;justify-content:center;white-space:normal;}
  .report-actions{flex-wrap:wrap;}
  .report-actions .btn{flex:1 1 auto;justify-content:center;white-space:normal;}
  .footer-import-export{flex-direction:column;}
  .footer-import-export .btn{width:100%;justify-content:center;white-space:normal;}

  .card{overflow-x:auto;}
  table:not(.rep-table){width:auto;min-width:100%;}
  table:not(.rep-table) th,table:not(.rep-table) td{white-space:nowrap;}
  table{font-size:12px;}
  table.tbl-ref th,table.tbl-ref td{white-space:normal;vertical-align:top}
  th,td{padding:6px;}

  .rep-grid{grid-template-columns:1fr !important;}
  .rep-page{padding:8mm 8mm 12mm;max-width:100%;overflow-x:auto;}
  .rep-foot{left:8mm;right:8mm;}
  .rep-table-kv{min-width:420px;}
  .rep-header{flex-direction:column;gap:8px;}
  .rep-header .meta{text-align:left;}

  /* Lista de clientes: cada fila pasa a tarjeta (antes se cortaban columnas y los botones) */
  #clientTable,#clientTable tbody{display:block;width:100%;min-width:0;}
  #clientTable thead{display:none;}
  #clientTable tr.clientrow{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding:12px 2px;border-bottom:.5px solid var(--bd);}
  /* iOS hace zoom al enfocar campos con letra menor de 16 px */
  input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],input[type=search],select,textarea{font-size:16px !important;}
  #clientTable tr.clientrow:hover td{background:transparent;}
  #clientTable td{display:block;padding:0;border:none;white-space:normal !important;font-size:13px;}
  #clientTable td:nth-child(1){grid-column:1/-1;font-size:15px;}
  #clientTable td:nth-child(2){grid-column:1/-1;color:var(--g500);}
  #clientTable td:nth-child(3){display:none;}
  #clientTable td:nth-child(4){grid-column:1;}
  #clientTable td:nth-child(5){grid-column:2;text-align:right;color:var(--g500);}
  #clientTable td:nth-child(6){grid-column:1/-1;margin-top:8px;}

  #clientTable td:nth-child(6) .btn{justify-content:center;}

  .fi-foot{padding-left:1rem;padding-right:1rem;}
  .fi-foot .btn{flex:1;}

  /* Lista de clientes: tarjetas separadas (antes solo una línea fina entre filas) */
  #clientTable tbody{display:flex;flex-direction:column;gap:10px;}
  #clientTable tr.clientrow{position:relative;padding:14px 14px 14px 18px;background:var(--sf);border:.5px solid rgba(0,0,0,.14);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(4,52,44,.06),0 6px 18px rgba(4,52,44,.10);}
  #clientTable tr.clientrow::before{content:none;}
  body.dark-mode #clientTable tr.clientrow{border-color:rgba(255,255,255,.14);box-shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.35);}
  #clientTable tr.clientrow.open{background:var(--t50);border-color:var(--t400);}
  #clientTable tr.clientrow:active{transform:scale(.985);transition:transform .08s ease-out;}
  #clientTable td:nth-child(1){display:flex;align-items:center;gap:10px;}
  #clientTable td:nth-child(1) .chev{display:none;}
  #clientTable td:nth-child(1) .cl-av{display:inline-flex;align-items:center;justify-content:center;flex:none;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--t600),var(--btn));color:#fff;font-size:15px;font-weight:700;letter-spacing:.02em;box-shadow:0 4px 12px rgba(15,110,86,.26);}
  #clientTable td:nth-child(1) strong{font-size:16px;letter-spacing:-.01em;}
  #clientTable tr.clientrow{gap:10px 10px;}
  /* Deporte como píldora y dos recuadros con los datos (en vez de la barra verde lateral) */
  #clientTable td:nth-child(2){grid-column:1/-1;margin-top:-2px;}
  #clientTable td:nth-child(2):not(:empty){display:inline-block;justify-self:start;font-size:11px;font-weight:600;color:var(--gold-dk,#8A6A3F);background:var(--pill-au,#F3EADB);box-shadow:inset 0 0 0 .5px var(--pill-au-bd,rgba(184,149,106,.4));padding:3px 11px;border-radius:20px;line-height:1.4;}
  #clientTable td:nth-child(4),#clientTable td:nth-child(5){background:var(--g100);border-radius:12px;padding:9px 12px;font-size:15px;font-weight:700;color:var(--g900);text-align:left;}
  #clientTable td:nth-child(4)::before,#clientTable td:nth-child(5)::before{display:block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--g400);margin-bottom:2px;}
  #clientTable td:nth-child(4)::before{content:"Valoraciones";}
  #clientTable td:nth-child(5)::before{content:"Última";}
  #clientTable td:nth-child(4) .small-note{display:none;}
  #clientTable tr.clientrow.open td:nth-child(4),#clientTable tr.clientrow.open td:nth-child(5){background:var(--sf);}
  #clientTable td:nth-child(6) .btn-group{grid-template-columns:1.35fr 1fr 44px;}
  #clientTable td:nth-child(6) .btn-group .btn.danger{padding-left:0;padding-right:0;}
  #clientTable tr.clientrow.open td{background:transparent;}
  #clientTable tr.detailrow{display:block;margin:-4px 0 4px;}
  #clientTable tr.detailrow>td{display:block;padding:0;border:none;}
  .client-detail{padding:12px;}
  .client-head{flex-direction:column;align-items:stretch;gap:10px;}
  .client-head .btn-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .field[style*="max-width:220px"]{max-width:none !important;}
  .client-head .btn-group .btn{justify-content:center;white-space:nowrap;padding-left:8px;padding-right:8px;gap:5px;}
  /* Historial de valoraciones: cada valoración es una tarjeta con fecha, 4 datos rotulados y acciones */
  .client-detail{overflow-x:visible;}
  #clientTable table.hist-table{min-width:0;width:100%;background:transparent;}
  #clientTable table.hist-table thead{display:none;}
  #clientTable table.hist-table,#clientTable table.hist-table tbody{display:block;gap:0;}
  #clientTable table.hist-table tbody tr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px;padding:12px;margin-bottom:10px;background:var(--sf);border:1px solid rgba(0,0,0,.20);border-radius:10px;}
  body.dark-mode #clientTable table.hist-table tbody tr{border-color:rgba(255,255,255,.2);}
  #clientTable table.hist-table td{display:block;grid-column:auto;text-align:left;margin:0;padding:0;border:none;white-space:normal !important;font-size:13px;font-weight:600;color:var(--g900);}
  #clientTable table.hist-table td.h-fecha{grid-column:1/-1;font-size:14px;padding-bottom:8px;border-bottom:.5px solid var(--bd);color:var(--t600);}
  #clientTable table.hist-table td[data-l]::before{content:attr(data-l);display:block;font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--g400);margin-bottom:2px;}
  #clientTable table.hist-table td.no-print{grid-column:1/-1;padding-top:8px;border-top:.5px solid var(--bd);}
  #clientTable table.hist-table td.no-print .btn-group{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  #clientTable table.hist-table td.no-print .btn{justify-content:center;white-space:normal;}
  #clientTable table.hist-table td.no-print .btn.danger{grid-column:1/-1;}
}

/* Modo incrustado (?embed=1, dentro del Panel Profesional): sin cabecera ni menú lateral; el menú pasa a
   pestañas horizontales arriba y el modo oscuro lo decide el panel. */

html.embed .app{flex-direction:column;min-height:0;}
html.embed .sidebar{position:static;height:auto;width:auto;flex:0 0 auto;align-self:flex-start;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px;padding:4px;margin:20px 2rem 0;background:var(--g100);border-radius:12px;overflow:visible;}

html.embed .newtab{display:inline-flex;font-size:12px;text-decoration:none;color:var(--g400);margin-left:6px;}
html.embed .main{padding:1.25rem 2rem 2rem;}
@media screen and (max-width:900px){
  /* La tira de pestañas se queda fija arriba al desplazarse (como las de la ficha del panel) */
  html.embed .sidebar{position:sticky;top:0;z-index:60;margin:0;max-width:100%;width:100%;border-radius:0;padding:8px 14px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;background:var(--g100);border-bottom:.5px solid var(--bd);box-shadow:0 4px 14px rgba(4,52,44,.08);}

  html.embed .navbtn{flex:0 0 auto;padding:8px 12px;}

}

:root{--pill-n:#E3DFD2;--pill-n-h:#D9D4C4;--pill-n-bd:rgba(70,58,30,.18);--pill-g:#C4E8D6;--pill-g-bd:rgba(15,110,86,.30);--pill-au:#EAD9BD;--pill-au-bd:rgba(122,90,56,.30);--pill-r:#F7D0D0;--pill-r-bd:rgba(192,57,43,.28)}

.pill.ok,.tolbadge.ok,.unit-tag,.badge-count{background:var(--pill-g);color:var(--t800,#085041);box-shadow:inset 0 0 0 .5px var(--pill-g-bd)}

.pill.neutral,.tolbadge.pending{background:var(--pill-n);color:var(--g700);box-shadow:inset 0 0 0 .5px var(--pill-n-bd)}

<script>
// Ventanas y teclado (iPhone / iPad): dentro del panel, este documento recibe del panel la franja realmente visible (--vvt / --vvb); ver «VENTANAS Y TECLADO» en panel-profesional.html.
window.addEventListener('message', e => {
  if(e.origin !== location.origin || e.source !== window.parent || !e.data || !('nlvv' in e.data)) return;
  const r = document.documentElement.style, v = e.data.nlvv;
  if(v){ r.setProperty('--vvt', v.top + 'px'); r.setProperty('--vvb', v.bottom + 'px'); } else { r.removeProperty('--vvt'); r.removeProperty('--vvb'); }
});
(function(){   // suelta (fuera del panel): la misma medición sobre su propio visualViewport
  const v = window.visualViewport; if(!v || window.top !== window) return;
  const aplicar = () => { const alto = innerHeight, tecl = (alto - v.height) > 80 || v.offsetTop > 1, r = document.documentElement.style;

/* Sesión de Supabase Auth: la misma que usa el Panel Profesional (clave `nl_session` de localStorage, mismo origen),
   así dentro del panel no pide login. Solo en su propia URL y sin sesión muestra el formulario de acceso. */
const AUTH_KEY = 'nl_session';
function authLoad(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch(e){ return null; } }
function authSave(j){ localStorage.setItem(AUTH_KEY, JSON.stringify({access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Date.now()+Math.max((j.expires_in||3600)-60,30)*1000})); }
function authClear(){ try{ localStorage.removeItem(AUTH_KEY); }catch(e){} }
async function authPost(grant, body){
  const r = await fetch(SURL+'/auth/v1/token?grant_type='+grant, {method:'POST', headers:{'apikey':SKEY,'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok || !j.access_token){ const e = new Error(j.error_description||j.msg||'auth'); e.status = r.status; throw e; }
  return j;
}
async function authLogin(email, password){ authSave(await authPost('password', {email, password})); }
let _authRefreshing = null;
function authRefresh(){
  if(_authRefreshing) return _authRefreshing;
  const s = authLoad(); if(!s || !s.refresh_token) return Promise.resolve(null);
  _authRefreshing = authPost('refresh_token', {refresh_token:s.refresh_token})
    .then(j=>{ authSave(j); return j.access_token; })
    .catch(e=>{ if(e.status>=400 && e.status<500) authClear(); return null; })
    .finally(()=>{ _authRefreshing = null; });
  return _authRefreshing;
}
async function authToken(){ const s = authLoad(); if(!s) return null; return Date.now()<s.expires_at ? s.access_token : authRefresh(); }
async function authFetch(url, opts={}){
  const go = async tok => fetch(url, {...opts, headers:{'apikey':SKEY,'Authorization':'Bearer '+(tok||SKEY),...(opts.headers||{})}});
  const habiaSesion = !!authLoad();
  const tok = await authToken();
  if(habiaSesion && !tok && !authLoad()){ location.reload(); return new Response('[]', {status:401}); }   // renovación rechazada: al recargar pide el acceso
  let r = await go(tok);
  if(r.status===401 && authLoad()){
    const t = await authRefresh();
    if(t) r = await go(t); else location.reload();   // sesión caducada: al recargar pide el acceso
  }
  return r;
}
async function sb(path, opts={}){
  const r = await authFetch(SURL+'/rest/v1/'+path, {...opts, headers:{'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})}});
  const t = await r.text();
  if(!r.ok) throw new Error('Supabase '+r.status+': '+t);
  return t ? JSON.parse(t) : null;
}
// Formulario de acceso (solo si no hay sesión). Se resuelve al entrar correctamente.
function pedirLogin(root){
  return new Promise(resolve=>{
    root.innerHTML = `<div class="card" style="max-width:380px;margin:8vh auto 0">
      <h2 style="margin-bottom:6px">Acceso profesional</h2>
      <p class="small-note" style="margin-bottom:14px">Entra con tu correo y tu contraseña para ver las valoraciones.</p>
      <label for="lgEmail">Correo</label>
      <input type="email" id="lgEmail" autocomplete="username" autocapitalize="off" spellcheck="false" style="width:100%;margin-bottom:10px">
      <label for="lgPass">Contraseña</label>
      <input type="password" id="lgPass" autocomplete="current-password" style="width:100%;margin-bottom:12px">
      <button class="btn camel" id="lgBtn" style="width:100%;justify-content:center">Entrar</button>
      <p class="small-note" id="lgErr" style="color:var(--red);min-height:18px;margin-top:8px"></p>
    </div>`;
    const go = async ()=>{
      const em = document.getElementById("lgEmail").value.trim(), pw = document.getElementById("lgPass").value;
      const err = document.getElementById("lgErr");
      if(!em || !pw){ err.textContent = "Introduce tu correo y tu contraseña"; return; }
      err.textContent = "Entrando…";
      try{ await authLogin(em, pw); resolve(); }
      catch(e){ err.textContent = (e.status>=400 && e.status<500) ? "Correo o contraseña incorrectos" : "No se pudo conectar. Inténtalo de nuevo."; }
    };
    document.getElementById("lgBtn").addEventListener("click", go);
    document.getElementById("lgPass").addEventListener("keydown", e=>{ if(e.key==="Enter") go(); });
  });
}

/* ============================================================
   REFERENCIAS ANTROPOMÉTRICAS PARA FUTBOLISTAS (percentiles Σ8)
   Mismas fuentes que la sección "Referencias" de Ajustes (Petri et al.
   2024; metaanálisis Σ6/Σ8 en futbolistas profesionales). Cada tabla es
   una lista de puntos [percentil, Σ8 en mm] ordenados de menor a mayor,
   usados para interpolar linealmente el percentil aproximado de un
   cliente. Son descriptivos, no rangos "óptimos" — así se etiqueta
   siempre en la interfaz.
   ============================================================ */
const SIGMA8_ESPANA_PERCENTILES = [
  [5,40.7],[10,44.1],[20,47.7],[30,49.2],[40,51.6],[50,56.2],[60,58.0],[70,60.1],[80,64.9],[90,80.3]
];
const SIGMA8_POSICION_PERCENTILES = {
  "Porteros":        [[15,39.9],[50,59.0],[85,69.9]],
  "Defensas":         [[15,41.8],[50,49.0],[85,57.7]],
  "Centrocampistas":  [[15,44.7],[50,54.6],[85,62.8]],
  "Delanteros":       [[15,43.2],[50,51.0],[85,66.8]]
};

// Clasifica un texto libre de "posición/prueba" en una de las 4 categorías de
// las tablas de fútbol anteriores, o null si no se reconoce ninguna.
function classifyFootballPosition(text){
  if(!text) return null;
  const t = text.toString().toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,""); // quita acentos
  if(/porter|guardamet/.test(t)) return "Porteros";
  if(/later|central|defens|carriler|libero/.test(t)) return "Defensas";
  if(/medi|centrocamp|pivote|interior|mediocentro/.test(t)) return "Centrocampistas";
  if(/delanter|extremo|ariete|punta|9\b/.test(t)) return "Delanteros";
  return null;
}

// true si el deporte del cliente es fútbol (para decidir si mostrar la
// comparación con las tablas de futbolistas)
function isFootballSport(deporte){
  if(!deporte) return false;
  const t = deporte.toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  return /futbol|soccer/.test(t);
}

// Interpola el percentil aproximado de "value" dentro de una lista de puntos
// [percentil, valor] ordenada ascendente. Fuera de rango, devuelve el
// percentil extremo marcado como aproximado (dir "below"/"above").
function estimatePercentile(value, points){
  if(value===null || value===undefined || isNaN(value)) return null;
  const first = points[0], last = points[points.length-1];
  if(value<=first[1]) return { pct:first[0], dir: value<first[1]?"below":"eq" };
  if(value>=last[1]) return { pct:last[0], dir: value>last[1]?"above":"eq" };
  for(let i=0;i<points.length-1;i++){
    const [p1,v1]=points[i], [p2,v2]=points[i+1];
    if(value>=v1 && value<=v2){
      const t = (value-v1)/(v2-v1);
      return { pct: p1 + t*(p2-p1), dir:"between" };
    }
  }
  return null;
}
function formatPercentileResult(res){
  if(!res) return "—";
  if(res.dir==="below") return "< P"+fmt(res.pct,0);
  if(res.dir==="above") return "> P"+fmt(res.pct,0);
  return "≈ P"+fmt(res.pct,0);
}

// Tarjeta de "Resultados" que compara el Σ8 del cliente con las tablas de
// referencia de futbolistas (solo se muestra si el cliente juega al fútbol
// y tiene los 8 pliegues completos). Ver también la sección "Referencias"
// de Ajustes, de donde salen estas mismas tablas.
function footballCompareCardHtml(client, R){
  if(!isFootballSport(client.deporte)) return "";
  if(R.sum8===null || R.sum8===undefined || isNaN(R.sum8)) return "";
  const posKey = classifyFootballPosition(client.posicion);
  const espana = estimatePercentile(R.sum8, SIGMA8_ESPANA_PERCENTILES);
  const posicion = posKey ? estimatePercentile(R.sum8, SIGMA8_POSICION_PERCENTILES[posKey]) : null;
  return `
  <div class="card">
    <h3 style="margin-top:0;">Comparación con futbolistas (Σ8 ISAK)</h3>
    <div class="grid ${posicion?"cols2":""}">
      <div class="kpi"><div class="val">${formatPercentileResult(espana)}</div><div class="lbl">vs. élite española (todas las posiciones)</div></div>
      ${posicion ? `<div class="kpi"><div class="val">${formatPercentileResult(posicion)}</div><div class="lbl">vs. ${posKey.toLowerCase()} (Serie A italiana)</div></div>` : ""}
    </div>
    <p class="small-note" style="margin-top:10px;">
      Σ8 de este cliente: <strong>${fmt(R.sum8,1)} mm</strong>. Percentiles descriptivos, estimados por interpolación
      sobre las tablas de referencia de Ajustes → Referencias. No representan un mínimo ni un máximo saludable,
      solo dónde se sitúa dentro de esas poblaciones de futbolistas.
      ${!posKey ? ` No se ha podido identificar la posición ("${esc(client.posicion||"sin especificar")}") para comparar contra su categoría — usa Porteros/Defensas/Centrocampistas/Delanteros o palabras que las contengan (p.ej. "lateral", "mediocentro", "extremo").` : ""}
    </p>
  </div>`;
}

   ============================================================ */

// Procesa una medida triple (1, 2, 3ª opcional) según protocolo ISAK:
// solo 1ª medida -> se usa tal cual (medición única, sin control de tolerancia)
// sin 3ª medida -> media armónica de las dos primeras
// con 3ª medida -> mediana de las tres
// tolerancia: 1% para medidas básicas/perímetros/diámetros, 5% para pliegues
function computeTriple(m1, m2, m3, tolerancePct){
  m1 = parseFloat(m1);
  m2 = (m2===undefined||m2===null||m2==="") ? NaN : parseFloat(m2);
  m3 = (m3===undefined||m3===null||m3==="")?null:parseFloat(m3);
  if(isNaN(m1)) return {value:null, pctDiff:null, outOfTolerance:false, valid:false, singleMeasure:false};
  if(isNaN(m2)){
    // Medición única: no hay con qué comparar, se usa directamente sin aviso de tolerancia.
    return {value:m1, pctDiff:0, outOfTolerance:false, valid:true, singleMeasure:true};
  }
  const pctDiff = (m2-m1)/harmean(m1,m2);
  let value;
  if(m3===null || isNaN(m3)){
    value = harmean(m1,m2);
  } else {
    const arr = [m1,m2,m3].sort((a,b)=>a-b);
    value = arr[1];
  }
  const outOfTolerance = Math.abs(pctDiff) > tolerancePct;
  return {value, pctDiff, outOfTolerance, valid:true, singleMeasure:false};
}

function edadDecimal(fechaValoracion, fechaNacimiento){
  if(!fechaValoracion || !fechaNacimiento) return null;
  const d1 = new Date(fechaValoracion), d2 = new Date(fechaNacimiento);
  if(isNaN(d1)||isNaN(d2)) return null;
  return Math.abs(d1-d2)/(1000*60*60*24*365);
}

function calcularResultados(valores, personal, edad){
  const R = {};
  const peso = valores.peso, talla = valores.talla, tallaSentado = valores.tallaSentado, envergadura = valores.envergadura;
  const sexo = (personal.sexo||"").toLowerCase().startsWith("h") ? "Hombre" : "Mujer";
  const raza = personal.raza || "";

  const pl = {}; FOLD_KEYS.forEach(k=>pl[k]=valores["pl_"+k]);
  const pr = {}; PERIM_KEYS.forEach(k=>pr[k]=valores["pr_"+k]);
  const d  = {}; DIAM_KEYS.forEach(k=>d[k]=valores["d_"+k]);

  if([peso,talla,tallaSentado,envergadura].some(v=>v===null||v===undefined||isNaN(v))) return null;
  if(Object.values(pl).some(v=>v===null||v===undefined||isNaN(v))) return null;
  if(Object.values(pr).some(v=>v===null||v===undefined||isNaN(v))) return null;
  if(Object.values(d).some(v=>v===null||v===undefined||isNaN(v))) return null;

  // Perímetros corregidos (para composición corporal)
  const brazoCorr   = pr.brazoRelajado - (Math.PI * pl.triceps / 10);
  const piernaCorr   = pr.pierna       - (Math.PI * pl.pierna   / 10);
  const musloCorr    = pr.muslo        - (Math.PI * pl.muslo    / 10);
  // Perímetros corregidos (para somatotipo, sin PI)
  const brazoCorrSom  = pr.brazoContraido - (pl.triceps/10);
  const piernaCorrSom = pr.pierna         - (pl.pierna/10);

  R.brazoCorr = brazoCorr; R.piernaCorr = piernaCorr; R.musloCorr = musloCorr;
  R.brazoCorrSom = brazoCorrSom; R.piernaCorrSom = piernaCorrSom;

  // Sumatorios de pliegues
  const sum6 = pl.triceps+pl.subescapular+pl.supraespinal+pl.abdominal+pl.muslo+pl.pierna;
  const sum8 = FOLD_KEYS.reduce((s,k)=>s+pl[k],0);
  R.sum6 = sum6; R.sum8 = sum8;

  // Somatotipo (Carter-Heath)
  // La endomorfia usa solo 3 pliegues (tríceps + subescapular + supraespinal), no los 6 del
  // sumatorio "sum6" de arriba (ese sum6 es para % grasa Yuhász/Ross-Kerr, no para el somatotipo).
  const sum3Endo = pl.triceps + pl.subescapular + pl.supraespinal;
  const nEndo = sum3Endo * (170.18/talla);
  const endomorfia = -0.7182 + 0.1451*nEndo - 0.00068*Math.pow(nEndo,2) + 0.0000014*Math.pow(nEndo,3);
  const mesomorfia = 0.858*d.humero + 0.601*d.femur + 0.188*brazoCorrSom + 0.161*piernaCorrSom - 0.131*talla + 4.5;
  const indicePonderalSom = talla / Math.cbrt(peso);
  let ectomorfia;
  if(indicePonderalSom >= 40.75) ectomorfia = 0.732*indicePonderalSom - 28.58;
  else if(indicePonderalSom >= 38.28) ectomorfia = 0.463*indicePonderalSom - 17.63;
  else ectomorfia = 0.1;
  R.endomorfia=endomorfia; R.mesomorfia=mesomorfia; R.ectomorfia=ectomorfia; R.indicePonderalSom=indicePonderalSom;
  R.somX = ectomorfia - endomorfia;
  R.somY = 2*mesomorfia - (endomorfia+ectomorfia);

  // Composición corporal (modelo tetracompartimental)
  const pctMasaGrasa = sexo==="Hombre" ? (3.64 + sum6*0.097) : (4.56 + sum6*0.143);
  const nRossKerr = (sum6*(170.18/talla) - 116.41) / 34.79;
  const pesoGrasoRossKerr = ((nRossKerr*5.85)+25.6) / Math.pow(170.18/talla, 3);
  const pctTejidoAdiposo = pesoGrasoRossKerr/peso*100;
  const razaFactor = raza==="Caucásica" ? 0 : (raza==="Negra" ? 1.1 : -2);
  const pesoMuscularLee = talla/100 * (0.00744*Math.pow(brazoCorr,2) + 0.00088*Math.pow(musloCorr,2) + 0.00441*Math.pow(piernaCorr,2))
                           + 2.4*(sexo==="Hombre"?1:0) - 0.048*(edad||0) + razaFactor + 7.8;
  const pesoOseoRocha = 3.02 * Math.pow( (talla/100)*(talla/100)*(d.biestiloideo/100)*(d.femur/100)*400, 0.712 );
  const pesoResidual = peso - (pesoGrasoRossKerr + pesoMuscularLee + pesoOseoRocha);
  const pctMasaMuscular = pesoMuscularLee*100/peso;
  const pctMasaOsea = pesoOseoRocha*100/peso;
  const pctMasaResidual = pesoResidual*100/peso;
  const pesoGrasoYuhasz = pctMasaGrasa/100*peso;
  const indiceMuscOseo = pesoMuscularLee/pesoOseoRocha;
  const areaMuscBrazo = Math.pow(brazoCorr,2)/(4*Math.PI);
  const areaMuscMuslo = Math.pow(musloCorr,2)/(4*Math.PI);
  const areaMuscPierna = Math.pow(piernaCorr,2)/(4*Math.PI);

  Object.assign(R, {
    pctMasaGrasa, pesoGrasoRossKerr, pctTejidoAdiposo, pesoMuscularLee, pesoOseoRocha, pesoResidual,
    pctMasaMuscular, pctMasaOsea, pctMasaResidual, pesoGrasoYuhasz, indiceMuscOseo,
    areaMuscBrazo, areaMuscMuslo, areaMuscPierna
  });

  // % Grasa — modelos alternativos, como valor de referencia adicional (no sustituyen a Yuhasz/Ross-Kerr,
  // que son los usados en el modelo tetracompartimental del informe)
  // Durnin & Womersley (1974): 4 pliegues (bíceps+tríceps+subescapular+suprailíaco), con densidad
  // corporal ajustada por edad y sexo, convertida a %grasa con la ecuación de Siri.
  let pctGrasaDW = null, pesoGrasoDW = null;
  if(edad!==null && edad!==undefined){
    const sum4DW = pl.biceps + pl.triceps + pl.subescapular + pl.crestaIliaca;
    const dwTableH = [ {max:16.999,c:1.1533,m:0.0643}, {max:19,c:1.1620,m:0.0630}, {max:29,c:1.1631,m:0.0632},
      {max:39,c:1.1422,m:0.0544}, {max:49,c:1.1620,m:0.0700}, {max:Infinity,c:1.1715,m:0.0779} ];
    const dwTableM = [ {max:16.999,c:1.1369,m:0.0598}, {max:19,c:1.1549,m:0.0678}, {max:29,c:1.1599,m:0.0717},
      {max:39,c:1.1423,m:0.0632}, {max:49,c:1.1333,m:0.0612}, {max:Infinity,c:1.1339,m:0.0645} ];
    const row = (sexo==="Hombre"?dwTableH:dwTableM).find(r=>edad<=r.max);
    const densDW = row.c - row.m*Math.log10(sum4DW);
    pctGrasaDW = (495/densDW) - 450;
    pesoGrasoDW = pctGrasaDW/100*peso;
  }
  Object.assign(R, { pctGrasaDW, pesoGrasoDW });

  // Modelo de %grasa "principal" a mostrar en el informe: Durnin & Womersley (1974) cuando hay
  // edad disponible (mejor validado, ajustado por edad, muestra amplia y diversa); si no hay edad
  // registrada, se recurre a Yuhász/Ross-Kerr (no requiere edad) como alternativa.
  const grasaModeloPrimario = pctGrasaDW!==null ? "Durnin & Womersley (1974)" : "Yuhász / Ross-Kerr";
  const pctGrasaPrimaria = pctGrasaDW!==null ? pctGrasaDW : pctMasaGrasa;
  const pesoGrasoPrimario = pctGrasaDW!==null ? pesoGrasoDW : pesoGrasoYuhasz;
  Object.assign(R, { grasaModeloPrimario, pctGrasaPrimaria, pesoGrasoPrimario });

  // Índices generales
  const imc = peso/Math.pow(talla/100,2);
  const whr = pr.cintura/pr.cadera;
  let whrRisk;
  if(sexo==="Hombre") whrRisk = whr>1 ? "Riesgo cardiovascular alto" : (whr<0.9 ? "Riesgo cardiovascular bajo" : "Riesgo cardiovascular moderado");
  else whrRisk = whr>0.85 ? "Riesgo cardiovascular alto" : (whr<0.8 ? "Riesgo cardiovascular bajo" : "Riesgo cardiovascular moderado");
  const envergaduraRelativa = envergadura/talla;
  const indiceCormico = tallaSentado/talla;
  // Estimación de maduración (Mirwald): "phv" es el offset de madurez — cuántos años antes (si es
  // negativo) o después (si es positivo) de su pico de velocidad de crecimiento (PHV) está la persona
  // AHORA MISMO. La "edad estimada de pico máximo de crecimiento" que se muestra en el informe es
  // edad actual − ese offset (edadEstimadaPHV), no el offset en sí.
  let phv = null, edadEstimadaPHV = null;
  if(edad!==null){
    if(sexo==="Hombre"){
      phv = -9.236 + 0.0002708*(talla-tallaSentado)*tallaSentado - 0.001663*edad*(talla-tallaSentado)
            + 0.007276*edad*tallaSentado + 0.02292*(peso*100)/talla;
    } else {
      phv = -9.376 + 0.0001882*(talla-tallaSentado)*tallaSentado + 0.0022*edad*(talla-tallaSentado)
            + 0.005841*edad*tallaSentado - 0.002658*edad*peso + 0.07693*(peso*100)/talla;
    }
    edadEstimadaPHV = edad - phv;
  }
  const imcClasif = imcClasificacion(imc);
  const indiceCormicoClasif = indiceCormicoClasificacion(indiceCormico, sexo);
  Object.assign(R, { imc, imcClasif, whr, whrRisk, envergaduraRelativa, indiceCormico, indiceCormicoClasif, phv, edadEstimadaPHV });

  // Puntuaciones Z (vs. población de referencia, corregidas por talla)
  const zVals = { peso, tallaSentado, envergadura };
  FOLD_KEYS.forEach(k=>zVals["pl_"+k]=pl[k]);
  PERIM_KEYS.forEach(k=>zVals["pr_"+k]=pr[k]);
  DIAM_KEYS.forEach(k=>zVals["d_"+k]=d[k]);
  zVals.pr_brazoCorr = brazoCorr; zVals.pr_piernaCorr = piernaCorr;
  zVals.pesoGraso = pesoGrasoYuhasz; zVals.pesoMuscular = pesoMuscularLee;
  zVals.pesoOseo = pesoOseoRocha; zVals.pesoResidual = pesoResidual;

  const zScores = {};
  Object.keys(Z_REF).forEach(k=>{
    const ref = Z_REF[k];
    const val = zVals[k];
    if(val===undefined || val===null || isNaN(val)) { zScores[k]=null; return; }
    zScores[k] = ((val*Math.pow(170.18/talla, ref.exp)) - ref.N) / ref.O;
  });
  R.zScores = zScores;

  return R;
}

// Resuelve los diámetros óseos "fijos" del cliente (medidos una sola vez).
// Si el cliente no tiene diámetros guardados todavía, cae en los que pudiera tener
// esa valoración concreta (compatibilidad con valoraciones guardadas antes de este cambio).
function resolveDiametros(client, valoracionFallback){
  if(client && client.diametrosOseos){
    const dm = client.diametrosOseos;
    const allSet = DIAM_KEYS.every(k=> dm[k] && dm[k].m1!==undefined && dm[k].m1!=="" && dm[k].m1!==null);
    if(allSet){
      const out = {};
      DIAM_KEYS.forEach(k=>{
        const t = dm[k];
        const r = computeTriple(t.m1, t.m2, t.m3, 0.01);
        out[k] = r.valid ? r.value : null;
      });
      return out;
    }
  }
  if(valoracionFallback && valoracionFallback.medidas){
    const out = {}; let any=false;
    DIAM_KEYS.forEach(k=>{
      const val = valoracionFallback.medidas["d_"+k];
      out[k] = (val!==undefined && val!==null) ? val : null;
      if(out[k]!==null) any = true;
    });
    if(any) return out;
  }
  return null;
}

// Resuelve talla / talla sentado / envergadura del cliente (medidas estructurales que,
// como los diámetros óseos, se miden una vez y se reutilizan en todas sus valoraciones).
// Si el cliente todavía no las tiene guardadas, cae en las de esa valoración concreta
// (compatibilidad con valoraciones guardadas antes de este cambio).
function resolveMedidasFijas(client, valoracionFallback){
  if(client && FIXED_KEYS.every(k=> client[k]!==undefined && client[k]!==null && client[k]!=="")){
    const out = {};
    FIXED_KEYS.forEach(k=> out[k] = parseFloat(client[k]));
    return out;
  }
  if(valoracionFallback && valoracionFallback.medidas){
    const out = {}; let any=false;
    FIXED_KEYS.forEach(k=>{
      const val = valoracionFallback.medidas[k];
      out[k] = (val!==undefined && val!==null) ? val : null;
      if(out[k]!==null) any = true;
    });
    if(any) return out;
  }
  return null;
}

// Construye el objeto "valores" (medidas resueltas, planas) a partir del borrador de entrada
function valoresDesdeValoracion(valoracion, client){
  const v = {};
  BASIC_KEYS.forEach(k=> v[k] = valoracion.medidas[k] && valoracion.medidas[k].value!==undefined ? valoracion.medidas[k].value : valoracion.medidas[k]);
  const fijas = resolveMedidasFijas(client, valoracion);
  FIXED_KEYS.forEach(k=> v[k] = fijas ? fijas[k] : null);
  FOLD_KEYS.forEach(k=> v["pl_"+k] = valoracion.medidas["pl_"+k]);
  PERIM_KEYS.forEach(k=> v["pr_"+k] = valoracion.medidas["pr_"+k]);
  const diam = resolveDiametros(client, valoracion);
  DIAM_KEYS.forEach(k=> v["d_"+k] = diam ? diam[k] : null);
  return v;
}

// Resumen que se guarda con cada valoración (columna resumen de antropometria_valoraciones) para que
// el Panel Profesional muestre peso y % de grasa sin duplicar aquí las fórmulas. El % de grasa es el
// "primario" del informe: Durnin & Womersley si hay edad, Yuhász / Ross-Kerr si no. Si faltan datos
// del perfil (talla, diámetros...) no hay resultados y pct_grasa queda en null.
function resumenValoracion(client, valoracion){
  const valores = valoresDesdeValoracion(valoracion, client);
  const peso = (valores.peso===undefined || valores.peso===null || isNaN(valores.peso)) ? null : valores.peso;
  const R = calcularResultados(valores, client, edadDecimal(valoracion.fecha, client.fechaNacimiento));
  const ok = R && R.pctGrasaPrimaria!==null && R.pctGrasaPrimaria!==undefined && !isNaN(R.pctGrasaPrimaria);
  const r2 = n => Math.round(n*100)/100;
  return {
    peso,
    pct_grasa: ok ? r2(R.pctGrasaPrimaria) : null,
    masa_grasa_kg: ok && !isNaN(R.pesoGrasoPrimario) ? r2(R.pesoGrasoPrimario) : null,
    modelo: ok ? R.grasaModeloPrimario : null,
    // Sumatorios de pliegues y masa muscular (Lee 2000) para la ficha del panel
    sum6: R && Number.isFinite(R.sum6) ? r2(R.sum6) : null,
    sum8: R && Number.isFinite(R.sum8) ? r2(R.sum8) : null,
    masa_muscular_kg: R && Number.isFinite(R.pesoMuscularLee) ? r2(R.pesoMuscularLee) : null
  };
}
// Recalcula el resumen de todas las valoraciones y guarda solo las que cambian (valoraciones antiguas
// sin resumen, o perfiles editados después). Si la columna aún no existe en Supabase no hace nada.
async function sincronizarResumenes(){
  const todas = STATE.clients.reduce((acc,c)=>acc.concat(c.valoraciones.map(v=>({c,v}))), []);
  if(!todas.length) return;
  if(SYNC_RESUMEN_DISPONIBLE===false) return;
  for(const {c,v} of todas){
    let nuevo;
    try{ nuevo = resumenValoracion(c, v); }catch(e){ continue; }
    if(JSON.stringify(nuevo)===JSON.stringify(v.resumen)) continue;
    try{
      await sb(`antropometria_valoraciones?id=eq.${v.id}`, {method:'PATCH', headers:{'Prefer':'return=minimal'}, body:JSON.stringify({resumen:nuevo})});
      v.resumen = nuevo;
    }catch(e){
      console.warn("No se pudo guardar el resumen (¿falta la columna resumen en Supabase?)", e);
      SYNC_RESUMEN_DISPONIBLE = false; return;
    }
  }
}
let SYNC_RESUMEN_DISPONIBLE = null, _syncResumenTimer = null;
function programarSyncResumenes(){
  clearTimeout(_syncResumenTimer);
  _syncResumenTimer = setTimeout(()=>{ sincronizarResumenes().catch(e=>console.warn(e)); }, 1500);
}

// Compara dos conjuntos de "valores" base (actual vs anterior/objetivo) aplicando ETM si existe
function compararValores(actual, referencia, etmSettings){
  const out = {};
  ALL_COMPARE_KEYS.forEach(k=>{
    const a = actual[k], r = referencia ? referencia[k] : null;
    if(a===undefined||a===null||isNaN(a) || r===undefined||r===null||isNaN(r)){
      out[k] = {diff:null, ci95:null, ci68:null};
      return;
    }
    const diff = a - r;
    const etm = etmSettings && etmSettings[k] ? parseFloat(etmSettings[k]) : null;
    let ci95=null, ci68=null;
    if(etm){
      ci95 = [diff - 1.96*(etm/Math.sqrt(2)), diff + 1.96*(etm/Math.sqrt(2))];
      ci68 = [diff - (etm/Math.sqrt(2)), diff + (etm/Math.sqrt(2))];
    }
    out[k] = {diff, ci95, ci68};
  });
  return out;
}

function wireClientes(){
  const search = document.getElementById("searchClient");
  // Filtra las filas de cliente; la ficha desplegada sigue a su fila (se oculta o muestra con ella).
  const filtrar = ()=>{
    const q = (search.value||"").toLowerCase();
    CLIENT_SEARCH = search.value||"";
    document.querySelectorAll("#clientTable tbody tr.clientrow").forEach(tr=>{
      const visible = tr.textContent.toLowerCase().includes(q);
      tr.style.display = visible ? "" : "none";
      const next = tr.nextElementSibling;
      if(next && next.classList.contains("detailrow")) next.style.display = visible ? "" : "none";
    });
  };
  if(search){ search.addEventListener("input", filtrar); if(search.value) filtrar(); }
  const btnNew = document.getElementById("btnNewClient");
  if(btnNew) btnNew.addEventListener("click", ()=>openClientForm(null));
  const btnImport = document.getElementById("btnImportClient");
  if(btnImport) btnImport.addEventListener("click", ()=>openImportClientModal());
  // Abrir/cerrar la ficha del cliente en su sitio (solo uno abierto a la vez)
  const alternarCliente = id=>{
    CURRENT_CLIENT_ID = (CURRENT_CLIENT_ID==id) ? null : id;
    renderView("clientes");
    const fila = document.querySelector("#clientTable tr.clientrow.open");
    if(fila) fila.scrollIntoView({block:"start", behavior:"smooth"});
  };
  document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click", e=>{ e.stopPropagation(); alternarCliente(b.dataset.open); }));

/* ============================================================
   VISTA: NUEVA VALORACIÓN (entrada de datos)
   ============================================================ */
let RESULT_VALORACION_ID = null; // valoración que se está viendo en "Resultados"
let LAST_PDF_RAW_TEXT = ""; // último texto extraído de un PDF importado (para revisión manual)
let PENDING_CLIENT_IMPORT = null; // {values, fecha, rawText} de un PDF pendiente de aplicar a un cliente recién creado

/* ============================================================
   IMPORTAR VALORACIÓN DESDE PDF (beta)
   Lee un PDF (p.ej. exportado desde el Excel antiguo) enteramente en
   el navegador, sin conexión a internet, usando pdf.js embebido.
   Los valores encontrados se precargan en el formulario, pero SIEMPRE
   deben revisarse antes de guardar: el reconocimiento es orientativo.
   ============================================================ */
// pdf.js se carga solo la primera vez que se importa un PDF (antes iba embebido y pesaba 1,3 MB en cada apertura).
const PDFJS_CDN = {
  lib: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",
  worker: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"
};
function cargarPdfJs(){
  if(window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions && window.pdfjsLib.GlobalWorkerOptions.workerSrc) return Promise.resolve();
  return new Promise((ok,ko)=>{
    const fin = ()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_CDN.worker; ok(); };
    if(window.pdfjsLib) return fin();
    const sc = document.createElement("script"); sc.src = PDFJS_CDN.lib; sc.onload = fin;
    sc.onerror = ()=>ko(new Error("No se pudo cargar el lector de PDF. Comprueba tu conexión."));
    document.head.appendChild(sc);
  });
}

async function extractPdfText(arrayBuffer){
  await cargarPdfJs();
  // verbosity:0 silencia avisos internos de pdf.js (p.ej. "Setting up fake
  // worker" o avisos de fuentes TrueType) que son normales y no afectan a la
  // extracción de texto, para no alarmar innecesariamente en la consola.
  const pdf = await pdfjsLib.getDocument({data:arrayBuffer, verbosity:0}).promise;
  let allLines = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items.map(it=>({str:it.str, x:it.transform[4], y:Math.round(it.transform[5])}));
    items.sort((a,b)=> b.y-a.y || a.x-b.x);
    let lines = [], curY = null, curLine = [];
    items.forEach(it=>{
      if(curY===null || Math.abs(it.y-curY)>2){
        if(curLine.length) lines.push(curLine.map(x=>x.str).join(' '));
        curLine = [it]; curY = it.y;
      } else curLine.push(it);
    });
    if(curLine.length) lines.push(curLine.map(x=>x.str).join(' '));
    allLines = allLines.concat(lines);
  }
  return allLines.join('\n');
}

function parseAnthropometryPdfText(text){
  let flat = text.replace(/\s+/g,' ');
  // Algunos informes (p.ej. la sección "Puntuaciones Z") incluyen filas como
  // "Z D Biestiloideo 1,72" o "Z PL Pierna -2,27": son la puntuación Z de esa
  // variable, no la medida en sí. Si no se quitan, un informe que no incluya
  // la etiqueta normal de esa variable (p.ej. porque llama "Muñeca" a lo que
  // aquí es "Biestiloideo") puede acabar leyendo por error ese Z-score como
  // si fuera la medida real. Se eliminan antes de buscar ningún campo.
  flat = flat.replace(/\bZ\s+(?:D|PL|PR)\s+[A-Za-zÁÉÍÓÚÑáéíóúñ]+(?:\s+[A-Za-zÁÉÍÓÚÑáéíóúñ]+)?\s+-?\d+[.,]?\d*/g, ' ');
  const out = {}, found = [];
  const numPattern = "([\\d]+[.,]?[\\d]*)";
  const tryField = (key, regexes)=>{
    for(const re of regexes){
      const m = flat.match(re);
      if(m){
        const v = parseFloat(m[1].replace(',','.'));
        if(!isNaN(v)){ out[key]=v; found.push(key); return; }
      }
    }
  };
  tryField('peso',         [new RegExp("Peso\\s*\\(?Kg\\)?\\s*:?\\s*"+numPattern,"i")]);
  tryField('tallaSentado', [new RegExp("Talla\\s*sentado\\s*\\(?cm\\)?\\s*:?\\s*"+numPattern,"i")]);
  tryField('envergadura',  [new RegExp("Envergadura\\s*:?\\s*"+numPattern,"i")]);
  tryField('talla',        [new RegExp("Talla(?!\\s*sentado)\\s*\\(?cm\\)?\\s*:?\\s*"+numPattern,"i")]);
  tryField('pl_triceps',      [new RegExp("Tr[ií]ceps\\s*:?\\s*"+numPattern,"i")]);
  tryField('pl_subescapular', [new RegExp("Subescapular\\s*:?\\s*"+numPattern,"i")]);
  tryField('pl_biceps',       [new RegExp("B[ií]ceps\\s*:?\\s*"+numPattern,"i")]);
  tryField('pl_crestaIliaca', [new RegExp("Cresta\\s*Il[ií]aca\\s*:?\\s*"+numPattern,"i")]);
  tryField('pl_supraespinal', [new RegExp("Supraespinal\\s*:?\\s*"+numPattern,"i")]);
  tryField('pl_abdominal',    [new RegExp("Abdominal\\s*:?\\s*"+numPattern,"i")]);
  tryField('pr_brazoRelajado',  [new RegExp("Brazo\\s*Relajado\\s*:?\\s*"+numPattern,"i")]);
  tryField('pr_brazoContraido', [new RegExp("Brazo\\s*Contra[ií]do\\s*:?\\s*"+numPattern,"i")]);
  tryField('pr_cintura', [new RegExp("Cintura\\s*:?\\s*"+numPattern,"i")]);
  tryField('pr_cadera',  [new RegExp("Caderas?\\s*:?\\s*"+numPattern,"i")]);
  tryField('d_humero',       [new RegExp("H[uú]mero\\s*:?\\s*"+numPattern,"i")]);
  // Algunos informes llaman "Muñeca" (o "Biestiloideo de muñeca") a este diámetro
  // en vez de "Biestiloideo": se prueban ambas etiquetas.
  tryField('d_biestiloideo', [
    new RegExp("Biestiloideo\\s*:?\\s*"+numPattern,"i"),
    new RegExp("Mu[ñn]eca\\s*:?\\s*"+numPattern,"i")
  ]);
  tryField('d_femur',        [new RegExp("F[eé]mur\\s*:?\\s*"+numPattern,"i")]);

  // "Muslo" y "Pierna" aparecen dos veces en el informe: una vez como pliegue
  // y otra como perímetro. En vez de depender de encontrar literalmente las
  // cabeceras "PLIEGUES"/"PERÍMETROS" (frágil: cambia según cómo cada PDF
  // exporte el texto), se usa el orden real de aparición: el informe siempre
  // lista primero los pliegues cutáneos y después los perímetros, así que la
  // 1ª aparición de cada palabra es el pliegue y la 2ª es el perímetro.
  const allMatches = (label)=>{
    const re = new RegExp(label+"\\s*:?\\s*"+numPattern, "gi");
    const vals = [];
    let m;
    while((m = re.exec(flat)) !== null){
      const v = parseFloat(m[1].replace(',','.'));
      if(!isNaN(v)) vals.push(v);
    }
    return vals;
  };
  const musloVals = allMatches("Muslo");
  if(musloVals[0]!==undefined){ out.pl_muslo = musloVals[0]; found.push('pl_muslo'); }
  if(musloVals[1]!==undefined){ out.pr_muslo = musloVals[1]; found.push('pr_muslo'); }
  const piernaVals = allMatches("Pierna");
  if(piernaVals[0]!==undefined){ out.pl_pierna = piernaVals[0]; found.push('pl_pierna'); }
  if(piernaVals[1]!==undefined){ out.pr_pierna = piernaVals[1]; found.push('pr_pierna'); }

  // Fecha de la valoración (si el PDF la incluye)
  const fecha = parseSpanishDateFromFlat(flat, "Fecha\\s*de\\s*la\\s*Valoraci[oó]n");

  // Nombre detectado (solo para avisar de posible PDF equivocado, no se usa para nada más)
  let nombreDetectado = null;
  const mN = flat.match(/Nombre\s*:?\s*([A-ZÁÉÍÓÚÑa-záéíóúñ']+(?:\s+[A-ZÁÉÍÓÚÑa-záéíóúñ']+)?)/);
  if(mN) nombreDetectado = mN[1].trim();

  return { values: out, found, fecha, nombreDetectado, rawText: text };
}

// Busca "<etiqueta> : dd/mm/aaaa" (o separadores - .) en el texto ya "aplanado"
// (espacios normalizados) de un PDF y devuelve la fecha en formato ISO, o null.
function parseSpanishDateFromFlat(flat, labelPattern){
  const re = new RegExp(labelPattern+"\\s*:?\\s*(\\d{1,2}[\\/\\-.]\\d{1,2}[\\/\\-.]\\d{2,4})", "i");
  const m = flat.match(re);
  if(!m) return null;
  const parts = m[1].split(/[\/\-.]/);
  if(parts.length!==3) return null;
  let [d,mo,y] = parts;
  if(y.length===2) y = "20"+y;
  const iso = `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
  return isNaN(new Date(iso).getTime()) ? null : iso;
}

/* ============================================================
   IMPORTAR CLIENTE NUEVO DESDE PDF (beta)
   Reconoce, además de las medidas (parseAnthropometryPdfText), los datos
   personales básicos del informe (nombre, sexo, fecha de nacimiento, etc.)
   para precargar el formulario de "Nuevo cliente". Todo es orientativo: el
   formulario se abre siempre para revisión antes de guardar nada.
   ============================================================ */
function parsePersonalFieldsFromPdfText(text){
  const flat = text.replace(/\s+/g,' ');
  const out = {};
  const tryField = (key, re)=>{
    const m = flat.match(re);
    if(m && m[1]) out[key] = m[1].trim();
  };
  // Palabras de otras etiquetas del informe: si aparecen justo después de la que
  // buscamos, cortan la captura ahí (evita que "Nombre: Juan Apellidos: Pérez"
  // capture "Juan Apellidos" como si fuera parte del nombre).
  const STOP_WORDS = "Nombre|Apellidos|Edad|Fecha|Sexo|Nacionalidad|Raza|Deporte|Posici[oó]n|Peso|Talla|Envergadura|Sedentario|Activo|Frecuencia|Total|Compite|Nivel|Lesiones|Otros|Dieta|IMC";
  const NAME_WORD = "(?!(?:"+STOP_WORDS+")\\b)[A-ZÁÉÍÓÚÑa-záéíóúñ']+";
  const NAME_RE = "("+NAME_WORD+"(?:\\s+"+NAME_WORD+"){0,2})";
  tryField('nombre',       new RegExp("Nombre\\s*:?\\s*"+NAME_RE));
  tryField('apellidos',    new RegExp("Apellidos\\s*:?\\s*"+NAME_RE));
  tryField('nacionalidad', new RegExp("Nacionalidad\\s*:?\\s*"+NAME_RE));
  tryField('deporte',      new RegExp("Deporte\\s*:?\\s*"+NAME_RE));
  tryField('posicion',     new RegExp("Posici[oó]n\\s*\\/?\\s*prueba\\s*preferida\\s*:?\\s*"+NAME_RE, "i"));

  const mSexo = flat.match(/Sexo\s*(?:\([^)]*\))?\s*:?\s*(Hombre|Mujer|Var[oó]n|Masculino|Femenino)/i);
  if(mSexo){
    const s = mSexo[1].toLowerCase();
    out.sexo = (s==="mujer"||s==="femenino") ? "Mujer" : "Hombre";
  }

  out.fechaNacimiento = parseSpanishDateFromFlat(flat, "Fecha\\s*de\\s*Nacimiento");

  return out;
}

// Aplica los valores numéricos reconocidos en un PDF al borrador de valoración
// de un cliente (y a sus diámetros óseos, que viven en la ficha del cliente).
// Se reutiliza tanto al importar un PDF sobre un cliente ya existente como al
// crear un cliente nuevo desde PDF. Devuelve el nº de campos aplicados.
function applyParsedValuesToDraft(client, draft, parsedValues){
  let count = 0;
  BASIC_KEYS.forEach(k=>{
    if(parsedValues[k]!==undefined){ draft.basic[k] = String(parsedValues[k]); count++; }
  });
  Object.keys(draft.triples).forEach(k=>{
    if(parsedValues[k]!==undefined){ draft.triples[k].m1 = String(parsedValues[k]); count++; }
  });
  // Los diámetros óseos se guardan en el cliente (se miden una sola vez), no en el borrador de la valoración
  let diamCount = 0;
  DIAM_KEYS.forEach(k=>{
    const pk = "d_"+k;
    if(parsedValues[pk]!==undefined){
      if(!client.diametrosOseos) client.diametrosOseos = {};
      if(!client.diametrosOseos[k]) client.diametrosOseos[k] = {m1:"",m2:"",m3:""};
      client.diametrosOseos[k].m1 = String(parsedValues[pk]);
      diamCount++;
    }
  });
  if(diamCount>0){ syncPerfilFields(client.id, {diametros_oseos: client.diametrosOseos}); count += diamCount; }
  // Talla, talla sentado y envergadura también se guardan en el cliente (fijas), no en el borrador
  let fixedCount = 0; const fixedUpdates = {};
  FIXED_KEYS.forEach(k=>{
    if(parsedValues[k]!==undefined){
      client[k] = parsedValues[k];
      fixedUpdates[FIXED_DB_COL[k]] = parsedValues[k];
      fixedCount++;
    }
  });
  if(fixedCount>0){ syncPerfilFields(client.id, fixedUpdates); count += fixedCount; }
  return count;
}

async function handlePdfImport(file, client){
  const statusEl = document.getElementById("pdfImportStatus");
  if(statusEl) statusEl.innerHTML = `<span class="small-note">Leyendo PDF…</span>`;
  try{
    const buf = await file.arrayBuffer();
    const text = await extractPdfText(buf);
    const parsed = parseAnthropometryPdfText(text);
    LAST_PDF_RAW_TEXT = parsed.rawText;

    const draft = ensureDraft(client);
    let count = applyParsedValuesToDraft(client, draft, parsed.values);
    if(parsed.fecha) draft.fecha = parsed.fecha;

    renderView("valoracion");
    toast(count>0 ? `PDF leído: ${count} campo(s) importados. Revisa los valores antes de guardar.` : "No se reconoció ningún campo conocido en el PDF.");

    const statusEl2 = document.getElementById("pdfImportStatus");
    if(statusEl2){
      let warn = "";
      if(parsed.nombreDetectado && client && client.nombre){
        const firstName = client.nombre.split(" ")[0].toLowerCase();
        if(!parsed.nombreDetectado.toLowerCase().includes(firstName)){
          warn = `<div class="tolbadge bad" style="margin-top:6px;"><span class="ic">${ic("alert")}</span> El PDF menciona a "${esc(parsed.nombreDetectado)}" — comprueba que es el informe correcto</div>`;
        }
      }
      statusEl2.innerHTML = pdfImportStatusHtml(count) + warn;
      wireVerTextoPdf();
    }
  }catch(err){
    console.error(err);
    if(statusEl) statusEl.innerHTML = `<span class="tolbadge bad"><span class="ic">${ic("alert")}</span> No se pudo leer este PDF. Prueba con otro archivo o introduce los datos a mano.</span>`;
  }
}

    client.diametrosOseos = newDiam;
    await syncPerfilFields(client.id, {diametros_oseos: newDiam});

    toast("Diámetros guardados");

function ensureDraft(client){
  if(!CURRENT_VALORACION_DRAFT || CURRENT_VALORACION_DRAFT._clientId!==client.id){
    CURRENT_VALORACION_DRAFT = { _clientId: client.id, fecha: new Date().toISOString().slice(0,10),
      basic:{}, triples:{} };
    // Los diámetros óseos (húmero, biestiloideo, fémur) se miden una vez y se guardan en el cliente,
    // no en cada valoración — por eso no se incluyen aquí.
    [...FOLD_KEYS.map(k=>"pl_"+k), ...PERIM_KEYS.map(k=>"pr_"+k)].forEach(k=>{
      CURRENT_VALORACION_DRAFT.triples[k] = {m1:"",m2:"",m3:""};
    });
  }
  return CURRENT_VALORACION_DRAFT;
}

function wireValoracion(){
  const c = getClient(CURRENT_CLIENT_ID);

  const clientSel = document.getElementById("valClientSelect");
  if(clientSel) clientSel.addEventListener("change", ()=>{
    CURRENT_CLIENT_ID = clientSel.value;
    CURRENT_VALORACION_DRAFT = null;
    renderView("valoracion");
  });

  const draft = ensureDraft(c);
  const tolMap = {};
  FOLD_KEYS.forEach(k=>tolMap["pl_"+k]=0.05);
  PERIM_KEYS.forEach(k=>tolMap["pr_"+k]=0.01);

  const fecha = document.getElementById("valFecha");
  if(fecha) fecha.addEventListener("change", ()=>{ draft.fecha = fecha.value; });

  const btnDiam = document.getElementById("btnEditarDiametros");

  document.querySelectorAll("[data-single]").forEach(inp=>{
    applyPlausibilityCheck(inp, inp.dataset.single);
    inp.addEventListener("input", ()=>{
      draft.basic[inp.dataset.single]=inp.value;
      applyPlausibilityCheck(inp, inp.dataset.single);
      updateQuickCompare();
    });
  });

  document.querySelectorAll("[data-tk]").forEach(inp=>{
    applyPlausibilityCheck(inp, inp.dataset.tk);
    inp.addEventListener("input", ()=>{
      const key = inp.dataset.tk, n = inp.dataset.tn;
      draft.triples[key]["m"+n] = inp.value;
      updateToleranceBadge(key, tolMap[key]);
      applyPlausibilityCheck(inp, key);
      updateQuickCompare();
    });
  });
  Object.keys(draft.triples).forEach(k=>updateToleranceBadge(k, tolMap[k]));
  updateQuickCompare();

  const btnSave = document.getElementById("btnGuardarValoracion");
  if(btnSave) btnSave.addEventListener("click", ()=>guardarValoracion(c));
  const btnClear = document.getElementById("btnLimpiarValoracion");
  if(btnClear) btnClear.addEventListener("click", ()=>{
    confirmModal("¿Vaciar todos los campos del formulario?", ()=>{
      CURRENT_VALORACION_DRAFT = null; goView("valoracion");
    }, {title:"Vaciar formulario", confirmLabel:"Vaciar"});
  });
}

// Rangos fisiológicamente plausibles por variable, solo para avisar de
// posibles errores de tecleo (p.ej. escribir "90" en vez de "9,0" en un
// pliegue, o confundir mm con cm) — nunca bloquean el guardado, y no son
// un rango "saludable" ni de rendimiento, solo lo que cabe esperar de una
// medida humana real. Deliberadamente amplios.
const PLAUSIBLE_RANGES = {
  peso:[30,160], talla:[120,220], tallaSentado:[60,120], envergadura:[120,230],
  pl_triceps:[2,40], pl_subescapular:[3,50], pl_biceps:[1,30], pl_crestaIliaca:[3,60],

function checkPlausible(key, value){
  const range = PLAUSIBLE_RANGES[key];
  if(!range || value===null || value===undefined || isNaN(value)) return null;
  const [min,max] = range;
  if(value<min || value>max) return `Valor fuera de lo habitual (lo esperable ronda ${min}–${max}). Revisa que no sea un error al escribir; si es correcto, puedes guardarlo igualmente.`;
  return null;
}
// Marca visualmente un <input> si su valor actual no es plausible para esa
// variable. No impide escribir ni guardar — es solo un aviso suave (borde +
// tooltip nativo con el detalle).
function applyPlausibilityCheck(input, key){
  if(input.value===""){ input.classList.remove("field-warn"); input.title=""; return; }
  const msg = checkPlausible(key, parseFloat(input.value));
  input.classList.toggle("field-warn", !!msg);
  input.title = msg || "";
}

function updateToleranceBadge(key, tolerancePct){
  const draft = CURRENT_VALORACION_DRAFT;
  const t = draft.triples[key];
  const badge = document.getElementById("tol_"+key);
  if(!badge) return;
  if(!t.m1){ badge.className="tolbadge pending"; badge.textContent="—"; return; }
  const r = computeTriple(t.m1, t.m2, t.m3, tolerancePct);
  if(!r.valid){ badge.className="tolbadge pending"; badge.textContent="—"; return; }
  if(r.singleMeasure){
    badge.className="tolbadge single";
    badge.textContent = "1 medida · "+fmt(r.value,1);
    return;
  }
  if(r.outOfTolerance){
    badge.className="tolbadge bad";
    badge.textContent = (t.m3? "Fuera tol." : "Añade 3ª · "+(r.pctDiff*100).toFixed(1)+"%");
  } else {
    badge.className="tolbadge ok";
    badge.textContent = "OK · "+fmt(r.value,1);
  }
}

function draftToValores(draft){
  const tol = { pl:0.05, pr:0.01, d:0.01 };
  const v = {};
  BASIC_KEYS.forEach(k=>{ v[k] = draft.basic[k]!==undefined && draft.basic[k]!=="" ? parseFloat(draft.basic[k]) : null; });
  Object.keys(draft.triples).forEach(k=>{
    const prefix = k.split("_")[0];
    const t = tol[prefix] || 0.01;
    const r = computeTriple(draft.triples[k].m1, draft.triples[k].m2, draft.triples[k].m3, t);
    v[k] = r.valid ? r.value : null;
  });
  return v;
}

function updateQuickCompare(){
  const box = document.getElementById("quickCompare");
  if(!box) return;
  const c = getClient(CURRENT_CLIENT_ID);
  const prev = lastValoracion(c);
  if(!prev) return;
  const prevValores = valoresDesdeValoracion(prev, c);
  const curValores = draftToValores(CURRENT_VALORACION_DRAFT);
  const rows = ALL_COMPARE_KEYS.filter(k=>curValores[k]!==null && curValores[k]!==undefined).map(k=>{
    const a = curValores[k], p = prevValores[k];
    if(p===undefined||p===null||isNaN(p)) return "";
    const diff = a-p;
    return `<tr><td>${ALL_COMPARE_LABELS[k]}</td><td>${fmt(p,1)}</td><td>${fmt(a,1)}</td><td class="${diffClass(diff)}">${diffSign(diff)}</td></tr>`;
  }).join("");
  box.innerHTML = rows ? `<table><thead><tr><th>Variable</th><th>Anterior</th><th>Actual</th><th>Diferencia</th></tr></thead><tbody>${rows}</tbody></table>`
                       : `<p class="small-note">Rellena los campos para ver la comparación en vivo.</p>`;
}

async function guardarValoracion(client){
  const draft = CURRENT_VALORACION_DRAFT;
  if(!draft.fecha){ toast("Indica la fecha de la valoración"); return; }
  const medidas = {};
  BASIC_KEYS.forEach(k=>{ medidas[k] = draft.basic[k]!==undefined && draft.basic[k]!=="" ? parseFloat(draft.basic[k]) : null; });
  const tol = { pl:0.05, pr:0.01, d:0.01 };
  let hasError = false;
  Object.keys(draft.triples).forEach(k=>{
    const prefix = k.split("_")[0];
    const r = computeTriple(draft.triples[k].m1, draft.triples[k].m2, draft.triples[k].m3, tol[prefix]||0.01);
    if(!r.valid) hasError = true;
    medidas[k] = r.value;
  });
  if(BASIC_KEYS.some(k=>medidas[k]===null) || hasError){
    toast("Faltan medidas por completar"); return;
  }
  const btnSave = document.getElementById("btnGuardarValoracion");
  if(btnSave) btnSave.disabled = true;
  let inserted;
  try{
    let resumen = null;
    try{ resumen = resumenValoracion(client, { fecha: draft.fecha, medidas }); }catch(e){}
    try{
      inserted = await sbInsertValoracion({ deportista_id: client.id, fecha: draft.fecha, medidas, resumen });
    }catch(e0){
      if(SYNC_RESUMEN_DISPONIBLE===true) throw e0;
      resumen = null; // la columna resumen puede no existir todavía: se guarda sin ella
      inserted = await sbInsertValoracion({ deportista_id: client.id, fecha: draft.fecha, medidas });
    }
    inserted = Array.isArray(inserted) ? inserted : [inserted];
    inserted[0].__resumen = resumen;
  }catch(e){
    console.error(e);
    toast("No se pudo guardar en el servidor — inténtalo de nuevo");
    if(btnSave) btnSave.disabled = false;
    return;
  }
  const row = Array.isArray(inserted) ? inserted[0] : inserted;
  const valoracion = { id: row.id, fecha: draft.fecha, medidas, resumen: row.__resumen || row.resumen || null };
  client.valoraciones.push(valoracion);
  CURRENT_VALORACION_DRAFT = null;
  RESULT_VALORACION_ID = valoracion.id;
  if(!resolveDiametros(client, valoracion)){
    toast("Valoración guardada — falta medir los diámetros óseos del cliente para ver resultados completos");
  } else if(!resolveMedidasFijas(client, valoracion)){
    toast("Valoración guardada — falta medir talla, talla sentado y envergadura del cliente para ver resultados completos");
  } else {
    toast("Valoración guardada");
  }
  goView("resultados");
}

function pickResultClient(){
  // Prioriza siempre el cliente activo (CURRENT_CLIENT_ID). Si no, cae al cliente dueño
  // de RESULT_VALORACION_ID. Esto evita que, al cambiar de cliente, Resultados se quede
  // mostrando por error la valoración de otro cliente visto anteriormente.
  if(CURRENT_CLIENT_ID){
    const c = getClient(CURRENT_CLIENT_ID);
    if(c) return c;
  }
  if(RESULT_VALORACION_ID){
    for(const c of STATE.clients){
      if(c.valoraciones.some(v=>v.id==RESULT_VALORACION_ID)) return c;
    }
  }
  return null;
}
function pickResultValoracion(c){
  if(!c || c.valoraciones.length===0) return null;
  if(RESULT_VALORACION_ID){
    const v = c.valoraciones.find(v=>v.id==RESULT_VALORACION_ID);
    if(v) return v;
  }
  return lastValoracion(c);
}
