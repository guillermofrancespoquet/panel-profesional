<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Método 3 Meses · Guillermo Francés</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-rounded-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-rounded-512.png">
<link rel="apple-touch-icon" href="./icon-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Método 3M">
<meta name="application-name" content="Método 3M">
<meta name="theme-color" content="#04342C">
<style>
:root{
  --t900:#04342C;--t800:#085041;--t600:#0F6E56;--t400:#1D9E75;--t100:#9FE1CB;--t50:#E1F5EE;
  --gold:#B8956A;--gold-dk:#7A5430;--beige:#EDE8DE;
  --p400:#534AB7;--p50:#EEEDFE;--p800:#3C3489;
  --a400:#BA7517;--a50:#FAEEDA;--a800:#633806;
  --g900:#1a1a18;--g700:#444441;--g500:#5F5E5A;--g400:#888780;--g200:#D3D1C7;--g100:#F1EFE8;
  --bg:#FAFAF8;--sf:#fff;
  --bd:rgba(0,0,0,.09);--bdm:rgba(0,0,0,.15);
  --f:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--f);background:var(--bg);color:var(--g900);min-height:100vh;line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased}
.view{display:none}.view.active{display:block}

/* LOADING */
#vload{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px}
.spin{width:32px;height:32px;border:2.5px solid var(--t100);border-top-color:var(--t400);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.spin-txt{font-size:13px;color:var(--g400)}

/* NAV */
.nav{position:sticky;top:0;z-index:50;background:rgba(250,250,248,.95);backdrop-filter:blur(12px);border-bottom:.5px solid var(--bd);padding:0 2rem;height:52px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{font-size:14px;font-weight:600;color:var(--t800);letter-spacing:-.01em}
.nav-tabs{display:flex;gap:2px;background:var(--g100);border-radius:8px;padding:3px}
.ntab{font-size:12px;padding:5px 14px;border-radius:6px;border:none;background:transparent;color:var(--g500);cursor:pointer;font-family:var(--f);transition:all .15s;font-weight:500}
.ntab.on{background:var(--sf);color:var(--g900);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* HEADER */
.hdr{background:var(--t900);padding:2.5rem 2rem 2rem;position:relative;overflow:hidden}
.hdr::before{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none}
.hdr-in{display:flex;align-items:flex-start;justify-content:space-between;gap:1.5rem;position:relative}
.hdr-left{flex:1;min-width:0}
.hdr-logo{flex-shrink:0;width:72px;height:72px;border-radius:22%;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.hdr-logo img{width:100%;height:100%;object-fit:cover;display:block}
.hdr-eyebrow{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--t100);margin-bottom:10px}
.hdr-title{font-size:26px;font-weight:600;color:#fff;margin-bottom:6px;letter-spacing:-.02em}
.hdr-sub{font-size:14px;color:rgba(255,255,255,.55)}
.hdr-meta{display:flex;gap:12px;margin-top:1.75rem;flex-wrap:wrap}
.mpill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.12);border-radius:20px;padding:5px 12px;font-size:12px;color:rgba(255,255,255,.7)}

/* PROGRESS */
.prog-strip{background:var(--sf);border-bottom:.5px solid var(--bd);padding:.875rem 2rem;display:flex;align-items:center;gap:1rem}
.prog-lbl{font-size:12px;color:var(--g400);white-space:nowrap}
.prog-track{flex:1;height:4px;background:var(--g100);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--t400);border-radius:2px;transition:width .6s ease}
.prog-pct{font-size:12px;font-weight:500;color:var(--t600);white-space:nowrap}

/* ACTIVE STRIP */
.astrip{background:var(--sf);border-bottom:.5px solid var(--bd);padding:.75rem 2rem;display:flex;align-items:center;gap:10px}
.adot{width:7px;height:7px;border-radius:50%;background:var(--t400);flex-shrink:0}
.albl{font-size:11px;font-weight:500;color:var(--g400);text-transform:uppercase;letter-spacing:.08em}
.awk{font-size:14px;font-weight:500;color:var(--g900);margin-left:auto;text-align:right}

/* MAIN */
.main{padding:1.5rem 2rem 2rem;max-width:780px;margin:0 auto}
.slbl{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--g400);margin-bottom:10px}
.sgap{margin-bottom:1.25rem}
.card{background:var(--sf);border-radius:12px;border:.5px solid var(--bd);overflow:hidden;margin-bottom:12px}

/* RETO */
.rcard{background:var(--t50);border-color:rgba(29,158,117,.2)}
.rhead{padding:1.1rem 1.5rem .875rem;border-bottom:.5px solid rgba(29,158,117,.15)}
.rtag{display:inline-flex;align-items:center;gap:5px;background:var(--t400);color:#fff;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-bottom:8px}
.rtitle{font-size:15px;font-weight:600;color:var(--t800);line-height:1.35}
.rbody{padding:1rem 1.5rem}
.rtxt{font-size:14px;color:var(--t800);line-height:1.7;opacity:.9}

/* PILDORA */
.chead{padding:1.1rem 1.5rem;display:flex;align-items:flex-start;gap:12px}
.cicon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--t50)}
.cmeta{flex:1;min-width:0}
.ctag{font-size:10px;font-weight:500;color:var(--g400);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.ctitle{font-size:15px;font-weight:600;color:var(--g900)}
.cbody{padding:0 1.5rem 1.25rem}
.ctxt{font-size:14px;color:var(--g500);line-height:1.7;margin-bottom:1rem}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cpill{background:var(--t50);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--t800);font-weight:500;line-height:1.3}
.cpill.gld{background:#F5EDD8;color:var(--gold-dk)}

/* MENU */
.mbadge{display:inline-block;font-size:11px;font-weight:500;padding:2px 9px;border-radius:20px;margin-bottom:12px}
.mitem{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:.5px solid var(--bd);font-size:14px;color:var(--g700);line-height:1.45}
.mitem:last-child{border-bottom:none}
.mdot{width:6px;height:6px;border-radius:50%;background:var(--t400);flex-shrink:0;margin-top:5px}

/* WEEKS */
.wks{padding:1.5rem 2rem 6rem;max-width:780px;margin:0 auto}
.pblk{margin-bottom:1.75rem}
.prow{display:flex;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:10px;border-bottom:.5px solid var(--bd)}
.ppip{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.pname{font-size:12px;font-weight:500;color:var(--g500)}
.prange{font-size:11px;color:var(--g400);margin-left:auto}
.wrow{display:flex;align-items:center;gap:12px;padding:12px 1.25rem;background:var(--sf);border-radius:10px;border:.5px solid var(--bd);margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.wrow.lkd{opacity:.38;pointer-events:none}
.wrow.wact{border-color:var(--t400)}
.wrow:not(.lkd):active{background:var(--g100)}
.wnum{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
.wnum.dn{background:var(--t400);color:#fff}
.wnum.ac{background:var(--t50);color:var(--t800)}
.wnum.lk{background:var(--g100);color:var(--g400)}
.winf{flex:1;min-width:0}
.wtit{font-size:14px;font-weight:500;color:var(--g900)}
.wsub{font-size:11px;color:var(--g400);margin-top:2px}
.warr{color:var(--g200);flex-shrink:0}
.wchk{color:var(--t400);font-size:15px;flex-shrink:0}

/* DETAIL */
.dbk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--t600);font-weight:500;padding:1.25rem 2rem 0;cursor:pointer;background:none;border:none;font-family:var(--f)}
.dhero{padding:1.25rem 1.5rem;background:var(--sf);margin:1rem 2rem 0;border-radius:12px;border:.5px solid var(--bd)}
.dey{font-size:11px;color:var(--g400);font-weight:500;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.dtit{font-size:22px;font-weight:600;color:var(--g900);letter-spacing:-.02em;line-height:1.2;margin-bottom:8px}
.dbadge{display:inline-block;font-size:11px;font-weight:500;padding:2px 9px;border-radius:20px}
.dwrap{padding:0 2rem;max-width:780px;margin:0 auto}
.dslbl{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--g400);margin:1.25rem 0 .625rem;padding-bottom:6px;border-bottom:.5px solid var(--bd)}
.pcard{background:var(--t50);border-radius:10px;padding:1.1rem 1.25rem}
.pintro{font-size:14px;color:var(--t800);line-height:1.7;margin-bottom:.875rem}
.pcons{display:flex;flex-direction:column;gap:6px}
.pcon{background:rgba(255,255,255,.6);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--t800);line-height:1.5}
.pcon strong{display:block;font-weight:600;margin-bottom:2px}
.dreto{background:var(--t50);border-radius:10px;padding:1.1rem 1.25rem}
.drtag{font-size:10px;font-weight:600;color:var(--t600);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.drtxt{font-size:14px;color:var(--t800);line-height:1.65;font-weight:500}

/* CHECKLIST */
.chi{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:.5px solid var(--bd);cursor:pointer}
.chi:last-child{border-bottom:none}
.chb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--bdm);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.chb.on{background:var(--t400);border-color:var(--t400)}
.chb.on::after{content:'';width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.chl{font-size:14px;color:var(--g700);line-height:1.45;flex:1}
.chl.dn{text-decoration:line-through;color:var(--g400)}

.bsp{height:5rem}
.note-wrap{margin-top:1rem}
.note-label{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--g400);margin-bottom:8px;padding-bottom:6px;border-bottom:.5px solid var(--bd);display:block}
.note-ta{width:100%;min-height:90px;padding:10px 12px;border:.5px solid var(--bdm);border-radius:10px;font-size:14px;font-family:var(--f);outline:none;resize:vertical;line-height:1.6;background:var(--bg);transition:border-color .15s;color:var(--g900)}
.note-ta:focus{border-color:var(--t400)}
.note-ta::placeholder{color:var(--g400)}
.note-saving{font-size:11px;color:var(--g400);margin-top:5px;min-height:14px;transition:opacity .3s}

@media(max-width:600px){
  .nav,.prog-strip,.astrip{padding-left:1.25rem;padding-right:1.25rem}
  .hdr{padding:2rem 1.25rem 1.75rem}
  .main,.wks{padding-left:1.25rem;padding-right:1.25rem}
  .dbk{padding-left:1.25rem}
  .dhero{margin-left:1.25rem;margin-right:1.25rem}
  .dwrap{padding-left:1.25rem;padding-right:1.25rem}
  .cgrid{grid-template-columns:1fr}
  .hdr-logo{width:58px;height:58px}
}
</style>
</head>

  <div id="vs" class="view">

      <span class="nav-brand">Método 3M</span>

        <button class="ntab" onclick="go('i')">Inicio</button>

      </div>

    <div class="bsp"></div>
  </div>
</div>

<script>
const SURL='https://knmucvrbxpzmrjwxyksj.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtubXVjdnJieHB6bXJqd3h5a3NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExOTE4NTgsImV4cCI6MjA5Njc2Nzg1OH0.DRKDDzKlxCXFedofGvXF0dLhWtSQ4LLI9oLWItEYJGQ';

// Datos del cliente: solo a través de funciones de Supabase (RPC) que reciben su clave personal (?t=...) y solo
// dejan leer y escribir SU fila y SOLO sus marcas y sus notas. La semana desbloqueada la cambia el profesional
// desde el Panel; aquí el cliente no puede tocarla. Ver supabase_seguridad_1_tokens.sql.
async function rpc(fn,args){
  const r=await fetch(`${SURL}/rest/v1/rpc/${fn}`,{
    method:'POST',
    headers:{'apikey':SKEY,'Authorization':'Bearer '+SKEY,'Content-Type':'application/json'},
    body:JSON.stringify(args)
  });
  if(!r.ok) throw new Error('rpc '+fn+' '+r.status);
  const t=await r.text();
  return t?JSON.parse(t):null;
}
const dbGet=token=>rpc('m3m_cliente',{p_token:token});
const dbSet=(token,checks)=>rpc('m3m_guardar_checks',{p_token:token,p_checks:checks});
async function dbSaveNote(token,weekNum,text){
  const current=S.cn||{};
  current[weekNum]=text;
  S.cn=current;
  await rpc('m3m_guardar_nota',{p_token:token,p_semana:weekNum,p_texto:text});

const MN={
  1:['Frutas y verduras','Cereales integrales','Legumbres','Frutos secos y semillas'],
  2:['Legumbres — lentejas, garbanzos, alubias negras, alubias blancas, guisantes, edamame','Cereales integrales — avena, arroz integral, quinoa, pan integral de masa madre, mijo, trigo sarraceno','Verduras y hortalizas — hoja verde, crucíferas, raíces, alliums','Frutas enteras — de temporada y variadas, siempre enteras','Grasas de calidad — AOVE, aguacate, nueces, almendras, semillas de chía y lino, pipas de calabaza','Proteína vegetal procesada — tofu, tempeh (mejor la legumbre entera)','Complementos de calidad — pescado azul, huevo campero, yogur natural sin azúcar'],
  3:['Legumbres — lentejas, garbanzos, alubias negras, alubias blancas, guisantes, edamame','Cereales integrales — avena, arroz integral, quinoa, pan integral de masa madre, mijo, trigo sarraceno','Verduras y hortalizas — hoja verde, crucíferas, calabacín, berenjena, pimientos, tomate, raíces, alliums','Frutas enteras — frutos rojos, cítricos, manzana, pera, plátano, fruta de temporada','Grasas de calidad — AOVE, aguacate, nueces, almendras, semillas de chía y lino, pipas de calabaza','Proteína vegetal — tofu, tempeh','Complementos de calidad — pescado azul, huevo campero, yogur natural sin azúcar']

const WK=[
  {p:1,t:'¿Dónde estás ahora?',pi:'Antes de mejorar algo hay que entenderlo. Esta semana no cambiamos nada: observamos. Tu alimentación actual, tus horarios, tus hábitos. Sin juicios ni comparaciones. La información que recopilemos esta semana es la base de todo lo que construiremos juntos en los próximos 3 meses.',co:[{t:'Punto de partida real',d:'Los datos honestos valen más que los datos perfectos. Registra lo que comes de verdad, no lo que crees que deberías comer.'},{t:'Sin juicio',d:'No hay comidas buenas ni malas esta semana. Solo hay información. Observar sin juzgar es una habilidad que también se entrena.'},{t:'Primera acción',d:'Identifica una comida de tu día que te gustaría mejorar. No la cambies todavía. Solo nómbrala.'}],re:'Registra tu alimentación durante 3 días tal y como la haces habitualmente. Y elige una comida de tu semana que te gustaría que fuera mejor. No tienes que cambiarla, solo identificarla. Ese es tu primer paso.',ch:['He registrado al menos 3 días de alimentación real sin modificar nada','He identificado la comida de mi día que quiero mejorar','He completado el cuestionario de diagnóstico antes de la primera sesión']},
  {p:1,t:'Cómo funciona la energía',pi:'Lo que comes cada día está hecho de tres ingredientes principales: proteína, carbohidratos y grasa. Ninguno es el enemigo. Cada uno tiene una función concreta en tu cuerpo y los tres son necesarios. Esta semana aprendes a reconocerlos en tu plato, entiendes por qué los alimentos vegetales son la base de todo, y ya hacemos el primer ajuste real.',co:[{t:'Proteína',d:'Construye y repara. Te mantiene saciado más tiempo. La encuentras en legumbres, tofu, edamame, y también en huevos, pescado y yogur.'},{t:'Carbohidratos y fibra',d:'Son la energía del día. La fibra, que viene con los carbohidratos vegetales, regula el azúcar en sangre, alimenta tu microbiota y te mantiene saciado. Cereales integrales, frutas, verduras y legumbres son su mejor fuente.'},{t:'Grasas',d:'Regulan hormonas y protegen el cerebro. Las mejores vienen de frutos secos, semillas, aceite de oliva y aguacate. El pescado azul también aporta las grasas más valiosas.'}],re:'Mira tus comidas habituales e identifica qué macronutriente falta o sobra en cada una. Elige una comida concreta y hazle un pequeño ajuste esta semana priorizando alimentos vegetales. Un cambio, sostenible y real.',ch:['Sé distinguir proteínas, carbohidratos y grasas en mis comidas habituales','Entiendo por qué la fibra y los alimentos vegetales son la base','He hecho un ajuste real en una comida esta semana priorizando origen vegetal']},
  {p:1,t:'Los mejores alimentos según la ciencia',pi:'La ciencia es clara: los alimentos vegetales deben ocupar la mayor parte de tu plato. No porque los demás sean malos, sino porque tienen algo que los otros no tienen en la misma medida: fibra, antioxidantes, fitoquímicos y una matriz nutricional que protege tu salud a largo plazo. Esta semana entiendes por qué y empiezas a construir con ellos.',co:[{t:'Vegetal primero',d:'Frutas, verduras, cereales integrales, legumbres, frutos secos y semillas tienen la mejor relación entre nutrientes y calorías. Son la base, no el acompañamiento.'},{t:'Por qué la ciencia los respalda',d:'Menos grasas saturadas y colesterol que los productos animales, sin hierro hemo en exceso, más fibra, más antioxidantes y más fitoquímicos protectores.'},{t:'El resto tiene su lugar',d:'Pescado, huevos, carnes y lácteos no desaparecen. Ocupan un espacio más reducido y complementan lo que la base vegetal ya cubre.'}],re:'Construye una comida completa usando únicamente alimentos de la lista base: frutas y verduras, cereales integrales, legumbres, frutos secos y semillas. Que sea algo que te apetezca comer de verdad, no un sacrificio.',ch:['Entiendo por qué los alimentos vegetales deben predominar en mi dieta','He construido una comida completa con alimentos de la lista base','Esa comida me ha gustado y podría repetirla']},
  {p:1,t:'Hambre, saciedad y señales reales',pi:'Tu cuerpo sabe cuándo necesita comer. El problema es que llevamos años ignorando esas señales o confundiéndolas con otras cosas: estrés, aburrimiento, hábito, ansiedad. Esta semana aprendes a distinguir el hambre real del hambre que no lo es, y empiezas a comer respondiendo a tu cuerpo en lugar de a tus emociones o a la hora del reloj.',co:[{t:'Hambre fisiológica',d:'Aparece de forma gradual, en el estómago, varias horas después de la última comida. Cualquier alimento la satisface. Es la señal real de que tu cuerpo necesita energía.'},{t:'Hambre emocional',d:'Aparece de repente, pide alimentos concretos (dulce, salado, ultraprocesado), y no desaparece del todo aunque comas. No es hambre de comida, es hambre de otra cosa.'},{t:'El entorno decide más de lo que crees',d:'Lo que tienes a mano, el tamaño del plato, comer con pantallas, el ritmo del día. Los hábitos que rodean la comida condicionan lo que comes tanto como el hambre en sí.'}],re:'Antes de cada comida principal esta semana, párate 30 segundos y pregúntate: ¿tengo hambre física ahora mismo o hay algo más? No tienes que cambiar nada, solo observar y anotarlo. Si identificas un momento de hambre emocional, escribe también qué estabas sintiendo justo antes.',ch:['Sé distinguir hambre fisiológica de hambre emocional en mi propio cuerpo','He identificado al menos un momento de hambre emocional esta semana','He detectado algún hábito o situación de mi entorno que condiciona lo que como']},
  {p:2,t:'Proteína: la gran incomprendida',pi:'Vivimos en una cultura obsesionada con la proteína. Batidos, suplementos, dietas hiperproteicas. Y sin embargo, con una alimentación mínimamente bien estructurada llegamos a los requerimientos de sobra sin pensar en ello. La evidencia más sólida que tenemos sitúa los requerimientos en torno a 0.8g por kilo de peso corporal al día: mucho menos de lo que la industria quiere que creas. Esta semana aprendes qué fuentes son realmente buenas, por qué las legumbres están a otro nivel, y cómo la proteína es la consecuencia natural de elegir bien, no un objetivo que perseguir.',co:[{t:'No necesitas tanta como crees',d:'0.8g por kg de peso corporal al día es el requerimiento respaldado por la evidencia. Con una dieta bien estructurada llegas sin esfuerzo. No hace falta contar gramos ni centrar tus comidas en la proteína.'},{t:'Legumbres primero',d:'Lentejas, garbanzos, alubias, edamame, tofu y tempeh son la mejor fuente proteica por su matriz nutricional completa: proteína + fibra + antioxidantes + sin hierro hemo ni grasas saturadas. La ciencia las respalda de forma consistente.'},{t:'La proteína como consecuencia',d:'Cuando eliges buenas fuentes de alimentos integrales, los requerimientos proteicos se cubren solos. No necesitas diseñar tu dieta alrededor de la proteína: diseña tu dieta alrededor de buenos alimentos y la proteína vendrá con ellos.'}],re:'Dos pasos esta semana. Primero, elige una comida que ya tengas incorporada y mejora su fuente proteica priorizando origen vegetal integral. Segundo, construye una comida nueva donde una legumbre sea el protagonista absoluto. Que sea algo que te apetezca repetir.',ch:['Entiendo por qué las legumbres son la mejor fuente proteica según la evidencia','He mejorado la fuente proteica de una comida que ya tenía incorporada','He construido una comida nueva con una legumbre como protagonista','Entiendo que la proteína es una consecuencia de elegir bien, no un objetivo aislado']},
  {p:2,t:'Carbohidratos sin miedo',pi:'Los carbohidratos llevan décadas siendo el villano de las dietas. Primero fue la era baja en grasa, luego la era baja en carbohidratos. La realidad es que los carbohidratos no son el problema: el problema es el tipo y la cantidad. Los carbohidratos de calidad son el combustible principal de tu cerebro y tus músculos, y cuando vienen en su forma integral traen consigo fibra, vitaminas y minerales que no puedes obtener de ningún otro sitio. Esta semana aprendes a elegirlos bien, a combinarlos mejor, y a dejar de temerlos.',co:[{t:'Integral siempre',d:'La diferencia entre el arroz blanco y el arroz integral no es solo la fibra. Es la velocidad de absorción, la saciedad, el impacto en la glucosa y la microbiota. Siempre que puedas, elige la versión integral.'},{t:'El momento importa',d:'Los carbohidratos rinden mejor cuando tu cuerpo los necesita: por la mañana para arrancar el día, antes de entrenar como combustible, o después para recuperar. No son iguales a las 8h que a las 22h.'},{t:'El azúcar oculto',d:'El azúcar es un carbohidrato refinado especialmente problemático porque está en productos donde no lo esperas: zumos naturales, yogures de sabores, cereales de desayuno, salsas. Esta semana empieza a detectarlo.'}],re:'Esta semana el foco está en el desayuno. Analiza tu desayuno habitual: ¿tiene carbohidrato integral o refinado? ¿Hay azúcar añadido oculto? Rediseñalo con una fuente de carbohidrato integral como base, sin azúcar añadido, y acompañado de proteína o grasa de calidad.',ch:['Entiendo la diferencia entre carbohidratos integrales y refinados y por qué importa','He analizado mi desayuno habitual e identificado carbohidratos refinados o azúcar oculto','He rediseñado mi desayuno con carbohidrato integral y sin azúcar añadido','Sé combinar carbohidratos con proteína o grasa para mejorar su impacto']},
  {p:2,t:'Grasas, inflamación y longevidad',pi:'Las grasas fueron el villano de los años 80 y 90. Nos vendieron que comer grasa engordaba y que había que evitarla. El resultado fue una explosión de productos light llenos de azúcar y una generación con más enfermedad cardiovascular que nunca. Hoy la ciencia es clara: no todas las grasas son iguales, y las grasas de calidad son imprescindibles para tu corazón, tu cerebro y tu longevidad.',co:[{t:'Grasas saludables — las que protegen',d:'Las grasas insaturadas del aceite de oliva virgen extra, los frutos secos, las semillas y el aguacate reducen el colesterol LDL, protegen el corazón y tienen un potente efecto antiinflamatorio. Son la base.'},{t:'Omega 3 — especialmente importante',d:'El pescado azul (sardinas, caballa, salmón), las nueces y las semillas de lino y chía aportan omega 3, la grasa con mayor evidencia científica para la salud cardiovascular, la función cerebral y la reducción de inflamación crónica.'},{t:'Grasas saturadas y trans — con criterio',d:'Las grasas saturadas en exceso elevan el colesterol LDL. Las grasas trans (bollería industrial, margarinas, ultraprocesados) son las únicas que merecen evitarse activamente. Busca aceite vegetal hidrogenado en las etiquetas.'}],re:'Dos pasos. Primero, revisa qué grasas predominan en tu alimentación: ¿hay aceite de oliva virgen extra como base? ¿Frutos secos o semillas? ¿Pescado azul al menos una vez a la semana? Segundo, incorpora una fuente de omega 3 esta semana si no la tienes ya.',ch:['Entiendo la diferencia entre grasas saludables, saturadas y trans','Sé qué impacto tienen las grasas en el colesterol y la inflamación','He identificado qué grasas predominan en mi alimentación habitual','He incorporado una fuente de omega 3 esta semana']},
  {p:2,t:'Construye tu menú semanal',pi:'Llevas dos meses haciendo cambios reales. Sabes elegir proteína, carbohidratos y grasas. Tienes un desayuno rediseñado, una comida con legumbre incorporada y criterio para leer lo que comes. Esta semana juntamos todo en algo concreto: tu menú de 3 días. No es una pauta que seguir ciegamente, es una herramienta que tú construyes, entiendes y puedes adaptar. A partir de aquí, el menú es tuyo.',co:[{t:'3 días es suficiente',d:'No necesitas planificar 7 días para comer bien. Con 3 días bien construidos tienes un patrón que puedes rotar y adaptar. La planificación reduce decisiones, ahorra dinero y elimina el ¿qué como hoy? de cada día.'},{t:'El plato completo',d:'Cada comida principal tiene tres elementos: proteína de calidad (preferiblemente vegetal), carbohidrato integral y vegetal abundante. No hace falta pesar ni calcular: si los tres están, el plato está bien.'},{t:'El desayuno ya lo tienes',d:'Llevas semanas trabajando el desayuno. Esta semana lo consolidas como parte fija del menú: carbohidrato integral + proteína o grasa de calidad + sin azúcar añadido.'}],re:'Construye tu menú de 3 días completos: desayuno, comida, cena y snack. Puedes llegar con un borrador a la sesión o construirlo desde cero juntos. Lo importante es que al terminar la videollamada el menú sea tuyo, lo entiendas y sepas por qué cada elección está ahí.',ch:['Tengo un menú de 3 días completo construido con criterio propio','Cada comida principal tiene proteína de calidad, carbohidrato integral y vegetal','El desayuno está consolidado y lo repetiría sin pensarlo','Entiendo por qué cada elección del menú está ahí']},
  {p:3,t:'Nutrición en el mundo real',pi:'Saber comer bien en casa ya no es tu reto. El reto ahora es el mundo real: el restaurante de la cena de empresa, la reunión familiar del domingo, el bar después de entrenar. Estas situaciones no son excepciones a tu alimentación, son parte de ella. Esta semana no improvisas, planificas. Identificas las situaciones que más te cuestan y construyes una estrategia concreta para cada una. La autonomía no es comer perfecto siempre, es saber qué hacer cuando las cosas no son perfectas.',co:[{t:'Anticipar, no reaccionar',d:'La mayoría de decisiones nutricionales malas ocurren por sorpresa. Cuando sabes de antemano a dónde vas y qué vas a encontrar, la decisión ya está tomada antes de llegar.'},{t:'La regla del mínimo no negociable',d:'En cualquier situación social siempre puedes elegir agua en vez de refresco, verdura o ensalada como acompañamiento, y evitar el ultraprocesado más obvio. Tres decisiones pequeñas que suman mucho a lo largo del tiempo.'},{t:'Sin culpa, sin excepción',d:'Una comida fuera de criterio no arruina nada. Un patrón de rendición ante cada situación social sí. La diferencia está en volver al criterio después, no en la perfección puntual.'}],re:'Identifica tus 3 situaciones sociales más frecuentes donde se te complica comer con criterio. Para cada una, construye tu estrategia con tres puntos: ¿qué suelo hacer?, ¿qué puedo hacer diferente?, ¿cuál es mi mínimo no negociable? Si esta semana se da alguna de esas situaciones, aplica tu estrategia. Si no se da ninguna, identifica cuándo va a ser la próxima vez y prepárate para entonces. Tráelo a la próxima sesión.',ch:['He identificado mis 3 situaciones sociales más complicadas','Tengo una estrategia concreta para cada una con sus tres puntos','He aplicado una estrategia esta semana o sé cuándo será la próxima ocasión','Entiendo que la autonomía nutricional incluye el mundo social, no solo la cocina de casa']},
  {p:3,t:'Leer etiquetas y no morir en el intento',pi:'Las etiquetas nutricionales tienen toda la información que necesitas para elegir bien. El problema no es la etiqueta, es que nadie nos ha enseñado a leerlas. Esta semana aprendes a interpretarlas en menos de 30 segundos: la lista de ingredientes, los valores nutricionales y los claims del envase. Con eso, el supermercado se convierte en un lugar donde eliges con criterio propio.',co:[{t:'La lista de ingredientes primero',d:'Los ingredientes aparecen de mayor a menor cantidad. Lo que está en los primeros tres puestos es lo que más pesa en ese producto. Empieza siempre por ahí antes de mirar cualquier otra cosa.'},{t:'El azúcar tiene muchos nombres',d:'Maltosa, dextrosa, jarabe de maíz, zumo de caña evaporado, sirope de agave... Cuando ves varios nombres distintos para el azúcar en la misma lista, todos suman. Aprender a reconocerlos cambia cómo lees cualquier producto.'},{t:'Los valores nutricionales te dicen la verdad',d:'Grasas saturadas, sal, sodio y azúcares añadidos están siempre en la tabla. Son datos objetivos que no dependen de lo que diga el frontal del envase. Los números no mienten.'}],re:'Dos pasos. Primero, revisa tu despensa: elige 5 productos que tengas en casa y léeles la etiqueta con lo aprendido hoy — lista de ingredientes, azúcares con distintos nombres y valores nutricionales. ¿Hay alguna sorpresa? Segundo, la próxima vez que vayas al supermercado, compara dos versiones del mismo producto y elige con criterio propio.',ch:['Sé leer una etiqueta nutricional con criterio: lista de ingredientes y valores nutricionales','He revisado al menos 5 productos de mi despensa con lo aprendido','He identificado azúcares con distintos nombres en al menos un producto','He comparado dos versiones del mismo producto en el supermercado y elegido con criterio']},
  {p:3,t:'Tu cuerpo a largo plazo',pi:'Lo que comes hoy no solo afecta a cómo te sientes esta semana. Determina cómo va a estar tu cuerpo dentro de 10, 20 o 30 años. Esta semana conectamos todo lo que has aprendido con tu salud a largo plazo: tu microbiota, la inflamación crónica de bajo grado, y el papel del sueño. Y cerramos con algo que quiero que te lleves grabado: la evidencia sobre alimentación de base vegetal y longevidad es abrumadora.',co:[{t:'Tu microbiota trabaja para ti',d:'Los billones de bacterias de tu intestino influyen en tu inmunidad, tu estado de ánimo y cómo metabolizas lo que comes. Se alimentan de fibra. Cuanta más variedad de plantas comes, más variedad de bacterias beneficiosas tienes.'},{t:'Inflamación crónica: el denominador común',d:'La mayoría de enfermedades crónicas comparten un mismo terreno: inflamación de bajo grado mantenida en el tiempo. Una dieta rica en vegetales, fibra y grasas de calidad la reduce de forma medible.'},{t:'El sueño también cuenta',d:'Dormir mal altera tus hormonas del hambre y tu sensibilidad a la insulina. No es el protagonista de esta semana, pero es una pieza más del mismo sistema.'}],re:'Durante los 7 días de esta semana, lleva la cuenta de cuántos alimentos vegetales distintos comes: cada fruta, verdura, legumbre, cereal integral, fruto seco, semilla o incluso hierba y especia cuenta como uno. No repitas el mismo dos veces. El objetivo es llegar a 20-25 alimentos vegetales diferentes en la semana. Es un juego, no una obligación. Y de forma más ligera: una sola noche esta semana, observa si duermes peor de lo normal y si al día siguiente notas más hambre o más antojo de dulce.',ch:['Entiendo la conexión entre alimentación, microbiota e inflamación','He contado mi diversidad vegetal semanal','He observado la relación entre una mala noche de sueño y mi apetito al día siguiente','Sé nombrar al menos 2 beneficios de una dieta rica en vegetales a largo plazo']},
  {p:3,t:'Cierre y entrega de autonomía',pi:'Has llegado a la última semana. Durante estos 3 meses has construido criterio propio sobre macronutrientes, has aprendido a elegir las mejores fuentes de proteína, carbohidratos y grasas, sabes leer etiquetas, sabes moverte en el mundo real, y entiendes por qué lo que comes hoy importa a largo plazo. Esta semana construimos tu menú semanal completo — el primero de 7 días de todo el programa — y te llevas tu protocolo nutricional propio. A partir de aquí, esto ya es tuyo.',co:[{t:'El menú es tuyo, no mío',d:'Tú lo construyes, tú decides las rotaciones, tú ajustas según tu semana real. Yo estoy aquí para corregir y afinar, no para decidir por ti.'},{t:'La autonomía no es perfección',d:'No vas a comer perfecto cada día para siempre. Vas a tener criterio para decidir bien la mayoría de las veces, y saber volver cuando te desvíes.'},{t:'Tu protocolo, tu referencia',d:'El documento que te llevas hoy resume estos 3 meses: tus principios, tu menú base, tus estrategias para el mundo real. Vuelve a él cuando lo necesites.'}],re:'Construye tu menú semanal completo de 7 días junto con tu nutricionista durante la sesión. Al terminar, tendrás tu protocolo nutricional propio: un documento que resume todo lo aprendido y que es tuyo para siempre.',ch:['He construido mi menú semanal completo de 7 días','Cada comida principal tiene proteína de calidad, carbohidrato integral y vegetal','Tengo mi protocolo nutricional personal','Me siento capaz de gestionar mi alimentación de forma autónoma']}
];
const PC=p=>p===1?'#1D9E75':p===2?'#534AB7':'#BA7517';
const PB=p=>p===1?'#E1F5EE':p===2?'#EEEDFE':'#FAEEDA';
const PT=p=>p===1?'#085041':p===2?'#3C3489':'#633806';
const PL=p=>p===1?'Fase 1 · Diagnóstico y base':p===2?'Fase 2 · Cambio activo':'Fase 3 · Consolidación y autonomía';
const PR=p=>p===1?'Semanas 1–4':p===2?'Semanas 5–8':'Semanas 9–12';

let S={u:0,ch:{},adm:false};
const SK='m3m_v6';
const ld=()=>{}; // state loaded from Supabase
const sv=()=>{ if(window._CID) dbSet(window._CID,S.ch).catch(()=>{}); };
let CUR='i';

function go(v){
  CUR=v;
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.ntab').forEach(e=>e.classList.remove('on'));
  if(v==='i'){document.getElementById('vi').classList.add('active');document.querySelectorAll('.ntab').forEach(t=>{if(t.textContent.trim()==='Inicio')t.classList.add('on')});renderI();}
  else if(v==='s'){document.getElementById('vs').classList.add('active');document.querySelectorAll('.ntab').forEach(t=>{if(t.textContent.trim()==='Semanas')t.classList.add('on')});renderS();}
}
function openD(i){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('vd').classList.add('active');renderD(i);}

function renderI(){
  const idx=Math.min(S.u,11),w=WK[idx],wn=Math.min(S.u+1,12),pct=Math.min(Math.round(S.u/12*100),100),ph=w.p;
  document.getElementById('Hdr').innerHTML=`<div class="hdr"><div class="hdr-in"><div class="hdr-left"><p class="hdr-eyebrow">Guillermo Francés · Nutricionista</p><p class="hdr-title">Método 3 Meses</p><p class="hdr-sub">Tu programa personalizado de nutrición basado en evidencia</p><div class="hdr-meta"><span class="mpill"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>12 semanas</span><span class="mpill"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>60 min / sesión</span><span class="mpill"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>Autonomía al finalizar</span></div></div><div class="hdr-logo"><img src="${LOGO}" alt="Guillermo Francés"></div></div></div>`;
  document.getElementById('Prog').innerHTML=`<div class="prog-strip"><span class="prog-lbl">Progreso</span><div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div><span class="prog-pct">${S.u} / 12 semanas</span></div>`;
  document.getElementById('Ast').innerHTML=`<div class="astrip"><div class="adot"></div><span class="albl">Tu programa activo</span><span class="awk">Semana ${wn} · ${w.t}</span></div>`;
  document.getElementById('Reto').innerHTML=`<p class="slbl">Tu reto esta semana</p><div class="card rcard"><div class="rhead"><div class="rtag"><svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Reto activo</div><p class="rtitle">${w.t}</p></div><div class="rbody"><p class="rtxt">${w.re}</p></div></div>`;
  document.getElementById('Pil').innerHTML=`<p class="slbl">Lo que aprendes esta semana</p><div class="card"><div class="chead"><div class="cicon"><svg fill="none" stroke="#0F6E56" stroke-width="2" viewBox="0 0 24 24" width="18" height="18"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div><div class="cmeta"><p class="ctag">${PL(ph)}</p><p class="ctitle">${w.t}</p></div></div><div class="cbody"><p class="ctxt">${w.pi}</p><div class="cgrid">${w.co.map((c,i)=>`<div class="cpill${i%2===1?' gld':''}">${c.t}</div>`).join('')}</div></div></div>`;
  document.getElementById('Menu').innerHTML=`<p class="slbl">Tu menú de referencia</p><div class="card"><div class="cbody" style="padding-top:1.25rem"><span class="mbadge" style="background:${PB(ph)};color:${PT(ph)}">${PL(ph)}</span>${MN[ph].map(m=>`<div class="mitem"><div class="mdot"></div><span>${m}</span></div>`).join('')}</div></div>`;
}

function renderS(){
  let h='',cp=0;
  WK.forEach((w,i)=>{
    const n=i+1,dn=n<=S.u,ac=n===S.u+1,lk=n>S.u+1;
    if(w.p!==cp){if(cp)h+='</div>';cp=w.p;h+=`<div class="pblk"><div class="prow"><div class="ppip" style="background:${PC(w.p)}"></div><span class="pname">${PL(w.p)}</span><span class="prange">${PR(w.p)}</span></div>`;}
    h+=`<div class="wrow${lk?' lkd':ac?' wact':''}" onclick="openD(${i})"><div class="wnum ${dn?'dn':ac?'ac':'lk'}">${dn?'✓':n}</div><div class="winf"><div class="wtit">${w.t}</div><div class="wsub">${dn?'Completada':ac?'Activa':'Bloqueada'}</div></div>${dn?'<span class="wchk">✓</span>':'<svg class="warr" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>'}</div>`;
  });
  h+='</div>';
  document.getElementById('wlist').innerHTML=h;
}

function renderD(i){
  const w=WK[i],n=i+1,dn=n<=S.u,ac=n===S.u+1,chs=S.ch['w'+n]||{};
  let h=`<button class="dbk" onclick="go('s')"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Todas las semanas</button><div class="dhero"><p class="dey">Semana ${n}</p><p class="dtit">${w.t}</p><span class="dbadge" style="background:${PB(w.p)};color:${PT(w.p)}">${PL(w.p)}</span></div><div class="dwrap"><p class="dslbl">Tu reto esta semana</p><div class="dreto"><p class="drtag">Reto activo</p><p class="drtxt">${w.re}</p></div><p class="dslbl">Lo que aprendes esta semana</p><div class="pcard"><p class="pintro">${w.pi}</p><div class="pcons">${w.co.map(c=>`<div class="pcon"><strong>${c.t}</strong>${c.d}</div>`).join('')}</div></div>`;
  if(dn||ac){
    h+=`<p class="dslbl">Tu progreso esta semana</p><div>`;
    w.ch.forEach((c,ci)=>{const on=chs[ci];h+=`<div class="chi" onclick="tgCh(${i},${ci})"><div class="chb${on?' on':''}" id="cb-${i}-${ci}"></div><span class="chl${on?' dn':''}" id="cl-${i}-${ci}">${c}</span></div>`;});
    h+=`</div>`;
  }
  // Notes section — only for unlocked weeks
  if(dn||ac){
    const noteVal=(S.cn&&S.cn[n])||'';
    h+=`<div class="det-wrap" style="margin-top:0">
      <div class="note-wrap">
        <span class="note-label">Mis notas de esta semana</span>
        <textarea class="note-ta" id="nta-${n}" placeholder="Escribe aquí tus observaciones, reflexiones o lo que quieras recordar de esta semana…" oninput="scheduleNoteSave(${n})">${noteVal}</textarea>
        <div class="note-saving" id="nsav-${n}"></div>
      </div>
    </div>`;
  }
  h+=`</div>`;
  document.getElementById('dcont').innerHTML=h;
  // Restore textarea value after innerHTML (to avoid encoding issues)
  const nta=document.getElementById('nta-${n}');
  if(nta) nta.value=(S.cn&&S.cn[n])||'';
}

// Note saving with debounce
let _noteTimer={};
function scheduleNoteSave(weekNum){
  const savEl=document.getElementById('nsav-'+weekNum);
  if(savEl){savEl.textContent='Guardando…';savEl.style.opacity='1';}
  clearTimeout(_noteTimer[weekNum]);
  _noteTimer[weekNum]=setTimeout(async()=>{
    const ta=document.getElementById('nta-'+weekNum);
    if(!ta||!window._CID)return;
    await dbSaveNote(window._CID,weekNum,ta.value).catch(()=>{});
    if(savEl){savEl.textContent='✓ Guardado';setTimeout(()=>{savEl.style.opacity='0';},1500);}
  },1200);
}

function tgCh(wi,ci){
  const k='w'+(wi+1);if(!S.ch[k])S.ch[k]={};
  S.ch[k][ci]=!S.ch[k][ci];sv();
  const b=document.getElementById(`cb-${wi}-${ci}`),l=document.getElementById(`cl-${wi}-${ci}`);
  if(b)b.className='chb'+(S.ch[k][ci]?' on':'');
  if(l)l.className='chl'+(S.ch[k][ci]?' dn':'');
}
document.addEventListener('DOMContentLoaded',async()=>{
  const CID=new URLSearchParams(window.location.search).get('t');
  if(!CID){document.getElementById('vload').style.display='none';document.getElementById('verr').style.display='flex';return;}
  const data=await dbGet(CID).catch(()=>null);
  if(!data){document.getElementById('vload').style.display='none';document.getElementById('verr').style.display='flex';return;}
  S.u=data.semana||0;S.ch=data.checks||{};S.cn=data.client_notes||{};window._CID=CID;
  document.getElementById('vload').style.display='none';
  document.getElementById('app').style.display='block';
  renderI();
});
</script>

<div id="verr" style="display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center;gap:12px">
  <p style="font-size:18px;font-weight:600;color:#1a1a18">Enlace no válido</p>
  <p style="font-size:14px;color:#888780;line-height:1.6;max-width:280px">Este programa requiere un enlace personalizado.<br>Contacta con Guillermo para obtener el tuyo.</p>
</div>
</body>
</html>
